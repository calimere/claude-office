// Grille d'emplacements — 3 colonnes × 2 rangées = 6 sessions simultanées visibles.
const POD_X = [-6, 1.5, 9], POD_Z = [-4.5, 4.5];
// Bureaux d'un ilot. L'ordre d'attribution est recalcule par ilot (cote ouvert
// d'abord), si bien que le lead s'assoit toujours face a l'allee.
const POD_SEATS = [[-1.6, 1.6], [-1.6, -1.6], [1.6, -1.6], [1.6, 1.6]];
// Couleur d'identite d'un projet : tapis, abat-jour, liseres, cadre du panneau et
// pastille du panneau Sessions. Terre cuite, sauge, bleu poussiereux, moutarde,
// prune, canard.
const TINTS = [0xc9795b, 0x7f9d6f, 0x6e8ca8, 0xd2a35c, 0xa97fa0, 0x5fa39b];

const podSlots = [];
for (const z of POD_Z) for (const x of POD_X) podSlots.push({ x, z, count: 0 });

// Descente de lit de l'îlot : c'est elle qui porte le nom du projet. Au sol plutôt
// qu'en panneau suspendu — un panneau en l'air masquait les bureaux du fond et
// flottait sans rien toucher ; un tapis ancre l'équipe à son emplacement.
function matTexture(title, sub, tint) {
  const W = 640, H = 200, PAD = 38, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const hex = '#' + tint.toString(16).padStart(6, '0');
  // Laine teintée a la couleur du projet, champ sombre au centre pour que le nom
  // ressorte sur le parquet.
  x.fillStyle = hex; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(34,24,17,.82)'; x.fillRect(14, 14, W - 28, H - 28);
  x.strokeStyle = hex; x.lineWidth = 3; x.strokeRect(25, 25, W - 50, H - 50);
  // Frange tissee en haut et en bas : ca se lit comme un tapis, pas comme une dalle.
  x.fillStyle = hex;
  for (let i = 0; i < 56; i++) { x.fillRect(15 + i * 11, 1, 5, 10); x.fillRect(15 + i * 11, H - 11, 5, 10); }
  x.textAlign = 'center';
  // Un nom long doit RETRECIR, pas s'ecraser : le maxWidth de fillText le rendait
  // filiforme et illisible de loin. On cherche le plus grand corps qui tienne.
  let size = 92;
  for (; size > 26; size -= 3) {
    x.font = '700 ' + size + 'px system-ui,Segoe UI,sans-serif';
    if (x.measureText(title).width <= W - PAD * 2) break;
  }
  x.fillStyle = '#f7eee2'; x.fillText(title, W / 2, 112);
  x.fillStyle = 'rgba(247,238,226,.46)'; x.font = '400 30px ui-monospace,Consolas,monospace';
  x.fillText(sub, W / 2, 158, W - PAD * 2);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t;
}

const pods = new Set();

class Pod {
  constructor(title, sub, tint) {
    this.tint = tint; this.members = new Set(); this.closing = false; this.closed = false;
    // Au-delà de podSlots.length sessions simultanées, on empile sur l'emplacement
    // le moins chargé ; le comptage garde la libération correcte.
    this.slot = podSlots.find((s) => !s.count)
      ?? podSlots.reduce((a, b) => (b.count < a.count ? b : a));
    this.slot.count++;
    const { x, z } = this.slot;
    this.g = new THREE.Group(); scene.add(this.g);

    // Tapis : liseré à la couleur du projet, laine teintée au centre
    const edge = box(6.1, .04, 6.3, tint, { roughness: 1 });
    edge.position.set(x, .02, z); edge.castShadow = false; this.g.add(edge);
    const inner = new THREE.Color(0x5a4336).lerp(new THREE.Color(tint), .45);
    const rug = box(5.8, .05, 6.0, inner, { roughness: 1 });
    rug.position.set(x, .045, z); rug.castShadow = false;
    rug.userData.pod = this; this.g.add(rug);

    // Suspension au-dessus de l'îlot : c'est elle qui donne le halo chaud.
    const cord = box(.035, 1.1, .035, 0x3a302a); cord.position.set(x, 3.95, z); this.g.add(cord);
    const lampShade = new THREE.Mesh(new THREE.ConeGeometry(.78, .62, 20, 1, true),
      new THREE.MeshStandardMaterial({ color: tint, roughness: .75, side: THREE.DoubleSide }));
    lampShade.position.set(x, 3.1, z); this.g.add(lampShade);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(.15, 12, 10),
      new THREE.MeshStandardMaterial({ color: 0xfff1d4, emissive: 0xffc980, emissiveIntensity: 1.5 }));
    bulb.position.set(x, 2.86, z); this.g.add(bulb);
    const lamp = new THREE.PointLight(0xffc98a, 15, 11, 2);
    lamp.position.set(x, 2.8, z); this.g.add(lamp);

    // Cloisons : bois en bas, verre dépoli en haut. Trois côtés ; l'îlot s'ouvre sur
    // l'allée centrale, par où tout le monde entre et sort.
    const open = z < 0 ? 1 : -1; // sens de l'ouverture (vers z = 0)
    const panel = (px, pz, w, d) => {
      const base = box(w, .78, d, 0x6d4b33); base.position.set(px, .39, pz); this.g.add(base);
      const glass = new THREE.Mesh(new THREE.BoxGeometry(w, .72, d),
        new THREE.MeshStandardMaterial({
          color: 0xd6e4e6, transparent: true, opacity: .2, roughness: .15,
        }));
      glass.position.set(px, 1.16, pz); this.g.add(glass);
      const rail = box(w + .06, .07, d + .06, shade(tint, -.3));
      rail.position.set(px, 1.55, pz); this.g.add(rail);
    };
    panel(x - 3.05, z, .1, 6.2);          // côté gauche
    panel(x + 3.05, z, .1, 6.2);          // côté droit
    panel(x, z - 3.05 * open, 6.2, .1);   // fond, à l'opposé de l'allée

    // Descente de lit devant l'ouverture, entre le portillon et l'allée : elle porte
    // le nom du projet. Posee au ras du sol, a l'exterieur du grand tapis de l'ilot.
    this.mat = new THREE.Mesh(new THREE.PlaneGeometry(4.0, 1.25),
      new THREE.MeshBasicMaterial({ map: matTexture(title, sub, tint), transparent: true }));
    this.mat.rotation.x = -Math.PI / 2;
    this.mat.position.set(x, .04, z + 3.8 * open);
    this.mat.userData.pod = this; // cliquable comme le tapis de l'ilot
    this.g.add(this.mat);

    // Gyrophare : eteint la plupart du temps, il s'allume quand la session appelle.
    this.beacon = new THREE.Mesh(new THREE.SphereGeometry(.26, 14, 12),
      new THREE.MeshStandardMaterial({ color: 0x3a2f27, emissive: 0x000000 }));
    this.beacon.position.set(x, 5.25, z); this.beacon.visible = false; this.g.add(this.beacon);
    this.beaconLight = new THREE.PointLight(0xffffff, 0, 9, 2);
    this.beaconLight.position.set(x, 5.1, z); this.g.add(this.beaconLight);

    // Point d'entrée dans l'allée, devant l'ouverture
    this.gate = new V3(x, 0, z + 3.5 * open);

    // Côté ouvert en premier : le lead, servi d'abord, s'assoit face à l'allée dans
    // les deux rangées — sinon il tourne le dos au spectateur dans l'une des deux.
    const seats = [...POD_SEATS].sort((a, b) => (b[1] - a[1]) * open);
    this.desks = seats.map(([dx, dz]) => makeDesk(this.g, x + dx, z + dz));
    pods.add(this); framePods();
  }
  // Au-delà de 4 agents l'îlot est plein : on double sur le dernier bureau plutôt
  // que de déborder sur un autre projet. D'où le comptage d'occupants.
  claimDesk() {
    const d = this.desks.find((k) => !k.busy) ?? this.desks[this.desks.length - 1];
    d.busy = true; d.occupants = (d.occupants || 0) + 1; return d;
  }
  setBeacon(color) {
    this.beaconColor = color ?? null;
    this.beacon.visible = color != null;
    if (color != null) {
      this.beacon.material.emissive.setHex(color);
      this.beaconLight.color.setHex(color);
    } else this.beaconLight.intensity = 0;
  }
  releaseDesk(d) {
    if ((d.occupants = (d.occupants || 1) - 1) <= 0) { d.busy = false; d.setScreen(null); }
  }
  // Session terminée : on attend que les sous-agents aient franchi la porte, puis
  // le lead s'efface sur place (il ne sort jamais) et l'îlot est démonté.
  maybeClose() {
    if (!this.closing || this.closed) return;
    if ([...this.members].some((a) => a.kind !== 'main')) return;
    this.closed = true;
    for (const a of [...this.members]) a.dispose();
    this.dispose();
  }
  dispose() {
    scene.remove(this.g);
    this.g.traverse((o) => { o.geometry?.dispose(); o.material?.map?.dispose(); o.material?.dispose(); });
    this.slot.count--; pods.delete(this); framePods();
  }
}

// Recentre et redimensionne la vue sur les îlots actifs.
function framePods() {
  if (focused) return; // un ilot est epingle : on ne recadre pas dans son dos
  let cx = 0, cz = 0;
  for (const p of pods) { cx += p.slot.x; cz += p.slot.z; }
  const n = pods.size;
  camTarget.set(n ? cx / n : 0, 0, n ? cz / n : 0);
  camSpan = n <= 1 ? 8.5 : n <= 2 ? 13 : n <= 4 ? 17 : 21;
  resize();
}

/* ---------- Personnages ---------- */
// Garde-robe. Sans variété de coupe, de teint et de pantalon, douze cubes de la même
// silhouette donnent une impression d'uniforme — d'où les styles ci-dessous.
const SKINS = [0xf3d2b3, 0xe8bd96, 0xd1a070, 0xb07a4c, 0x8a5a36, 0x5f3d26];
const HAIRS = [0x2a1d16, 0x15110e, 0x7a4a24, 0xd9b26f, 0x8a3b24, 0x9b9389, 0x4a3b55];
const CUTS = ['court', 'chignon', 'long', 'chauve', 'bonnet', 'casquette'];
const SHIRTS = [0x5c7f9e, 0x74925f, 0x9a7194, 0xc99a55, 0xb86b50, 0x4f948c,
  0x7c6ba0, 0xa8584f, 0x3f7a86, 0xb3985c];
const LEAD_SHIRTS = [0xe8743b, 0xd9632e, 0xef8b4c, 0xc2561f];
const PANTS = [0x3b4254, 0x4a3f36, 0x334039, 0x5a4a52, 0x2f3a4a, 0x6b5744, 0x7a6a58];
const TOPS = ['simple', 'capuche', 'veste', 'simple', 'col'];

const hash = (s) => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7) >>> 0;
const shade = (hex, k) =>
  new THREE.Color(hex).lerp(new THREE.Color(k < 0 ? 0x000000 : 0xffffff), Math.abs(k)).getHex();

// Un décalage de bits ne suffit pas : les noms d'agents partagent leurs préfixes,
// les bits de poids fort bougent à peine et tout le monde finit habillé pareil.
// Chaque champ tire donc dans un flux mélangé indépendamment.
function mix(h, k) {
  let x = (h ^ Math.imul(k + 1, 0x9e3779b1)) >>> 0;
  x = Math.imul(x ^ (x >>> 16), 0x85ebca6b) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35) >>> 0;
  return (x ^ (x >>> 16)) >>> 0;
}

// La graine mêle le nom ET l'identifiant d'instance : deux Explore simultanés ne sont
// pas jumeaux. L'allure est donc stable pour la vie d'un agent — rappel au café
// compris — mais pas d'une session à l'autre.
function lookFor(h, isLead) {
  const p = (arr, k) => arr[mix(h, k) % arr.length];
  return {
    skin: p(SKINS, 1), hair: p(HAIRS, 2), cut: p(CUTS, 3),
    shirt: isLead ? LEAD_SHIRTS[mix(h, 4) % LEAD_SHIRTS.length] : p(SHIRTS, 4),
    pants: p(PANTS, 5), top: p(TOPS, 6),
    shortSleeves: mix(h, 7) % 2 === 0,
    glasses: mix(h, 8) % 4 === 0,
    height: .92 + (mix(h, 9) % 7) * .027,
    build: .92 + (mix(h, 10) % 5) * .045,
  };
}

// L'avant du modele est -Z : c'est vers -Z que les bras tapent (voir la pose
// 'type'), et le clavier s'y trouve. Tout trait de visage va donc en z negatif,
// la nuque en z positif. Se tromper de cote fait marcher les gens a reculons.
function makeChar(look) {
  const skinMat = new THREE.MeshStandardMaterial({ color: look.skin, roughness: .75 });
  const hairMat = new THREE.MeshStandardMaterial({ color: look.hair, roughness: .9 });
  const g = new THREE.Group(); g.scale.setScalar(look.height);
  const torso = new THREE.Group(); torso.position.y = .65; g.add(torso);

  const body = box(.55 * look.build, .6, .35, look.shirt); body.position.y = .3; torso.add(body);
  if (look.top === 'capuche') {
    const hood = box(.48 * look.build, .24, .28, shade(look.shirt, -.2));
    hood.position.set(0, .6, .11); torso.add(hood);
  } else if (look.top === 'veste') {
    const lapel = box(.58 * look.build, .5, .38, shade(look.shirt, -.28));
    lapel.position.y = .3; lapel.scale.z = .99; torso.add(lapel);
    const shirtFront = box(.2, .5, .4, 0xf0e6d8); shirtFront.position.y = .3; torso.add(shirtFront);
  } else if (look.top === 'col') {
    const collar = box(.58 * look.build, .1, .38, shade(look.shirt, .3));
    collar.position.y = .56; torso.add(collar);
  }

  const head = new THREE.Group(); head.position.y = .82; torso.add(head);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(.22, 20, 16), skinMat);
  skull.castShadow = true; head.add(skull);

  if (look.cut !== 'chauve') {
    const cap = new THREE.Mesh(
      new THREE.SphereGeometry(.235, 20, 16, 0, Math.PI * 2, 0, Math.PI / 2),
      look.cut === 'bonnet' ? new THREE.MeshStandardMaterial({ color: shade(look.shirt, -.1), roughness: .95 })
      : look.cut === 'casquette' ? new THREE.MeshStandardMaterial({ color: shade(look.shirt, -.35), roughness: .9 })
      : hairMat);
    cap.position.set(0, .02, .03); cap.rotation.x = .25; head.add(cap);
    if (look.cut === 'casquette') {
      const visor = box(.3, .04, .22, shade(look.shirt, -.4)); visor.position.set(0, .07, -.24); head.add(visor);
    }
    if (look.cut === 'chignon') {
      const bun = new THREE.Mesh(new THREE.SphereGeometry(.12, 12, 10), hairMat);
      bun.position.set(0, .14, .21); head.add(bun);
    }
    if (look.cut === 'long') {
      const fall = box(.42, .34, .2, look.hair); fall.position.set(0, -.08, .1); fall.name = 'nuque'; head.add(fall);
    }
  }
  if (look.glasses) {
    const bridge = box(.3, .03, .03, 0x2b2b2b); bridge.position.set(0, .02, -.21); bridge.name = 'visage'; head.add(bridge);
    for (const lx of [-.1, .1]) {
      const lens = box(.13, .11, .02, 0x8fb7cc, { transparent: true, opacity: .55 });
      lens.position.set(lx, .02, -.22); head.add(lens);
    }
  }

  const mkArm = (x) => {
    const p = new THREE.Group(); p.position.set(x * look.build, .55, 0);
    const upper = box(.14, .26, .14, look.shirt); upper.position.y = -.13; p.add(upper);
    const lower = box(.13, .24, .13, look.shortSleeves ? look.skin : look.shirt);
    lower.position.y = -.37; p.add(lower);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(.08, 10, 8), skinMat);
    hand.position.y = -.5; p.add(hand);
    torso.add(p); return p;
  };
  const mkLeg = (x) => {
    const p = new THREE.Group(); p.position.set(x, .65, 0);
    const l = box(.18, .55, .2, look.pants); l.position.y = -.28; p.add(l);
    const shoe = box(.19, .09, .27, 0x2e2622); shoe.position.set(0, -.58, .04); p.add(shoe);
    g.add(p); return p;
  };
  const armL = mkArm(-.36), armR = mkArm(.36);
  // Tasse dans la main droite, montrée seulement pendant la pause café.
  const mug = new THREE.Mesh(new THREE.CylinderGeometry(.075, .062, .13, 10),
    new THREE.MeshStandardMaterial({ color: 0xf2e8da, roughness: .6 }));
  mug.position.set(0, -.62, -.07); mug.visible = false; mug.castShadow = true; armR.add(mug);
  // Manette, tenue a deux mains devant le torse : montree seulement sur le canape.
  const pad = box(.3, .08, .15, 0x2e2622);
  pad.position.set(0, .34, -.3); pad.visible = false; torso.add(pad);
  return { g, torso, head, armL, armR, mug, pad, legL: mkLeg(-.13), legR: mkLeg(.13) };
}

const DOOR = new V3(-14.3, 0, 7);
const CORRIDOR_X = -13.0; // couloir le long du mur de gauche, jusqu'a la porte
const AISLE_Z = 0;        // allee centrale : seule voie traversant la piece sans cloison
const labelsEl = document.getElementById('labels');
const agents = new Set();
const tmp = new V3();

class Agent {
  constructor(id, { name, kind, task, pod, seated, variant = 0 }) {
    this.id = id; this.name = name; this.kind = kind; this.task = task;
    // Un employé repris de la mémoire du serveur n'a ni îlot ni bureau : il est dans
    // la maison sans être sur un dossier. `pod` reste donc facultatif.
    this.pod = pod ?? null;
    this.desk = pod ? pod.claimDesk() : null;
    // Graine sur le NOM, pas sur l'instance : un agent que tu nommes (« architecte »)
    // garde la même silhouette de session en session, on finit par le reconnaître.
    // La variante ne sert qu'à distinguer deux homonymes présents en même temps.
    this.c = makeChar(lookFor(mix(hash(name), variant), kind === 'main'));
    scene.add(this.c.g);
    // Le lead tient le poste tant que la session vit : il est déjà assis, et ne
    // franchira jamais la porte. Seuls les sous-agents entrent et sortent.
    // Le lead tient le poste : déjà assis, il ne franchira jamais la porte. Un agent
    // reconstitué au rechargement (seated) est lui aussi posé directement — il était
    // déjà là avant qu'on ouvre la page, le faire entrer serait un mensonge.
    if (kind === 'main' || (seated && this.desk)) {
      this.c.g.position.copy(this.desk.seat); this.state = 'work'; this.path = [];
    } else if (this.desk) {
      this.c.g.position.copy(DOOR); this.state = 'walkin'; this.path = this.toDesk();
    } else {
      this.state = 'idle'; this.path = []; // place par hire(), juste apres
    }
    this.el = document.createElement('div'); this.el.className = 'label';
    this.c.g.userData.agent = this; // cible de selection au clic
    this.el.style.borderLeft = '3px solid ' +
      (pod ? '#' + pod.tint.toString(16).padStart(6, '0') : 'rgba(185,168,148,.45)');
    const b = document.createElement('b'); b.textContent = (kind === 'main' ? '🧠 ' : '🤖 ') + name;
    this.t = document.createElement('span'); this.t.className = 't';
    this.sayEl = document.createElement('span'); this.sayEl.className = 'say'; this.sayEl.hidden = true;
    this.el.append(b, this.t, this.sayEl); labelsEl.appendChild(this.el);
    this.set(kind === 'main' ? 'idle' : 'walk', kind === 'main' ? '☕ prêt' : '🚶 arrive…');
    agents.add(this); pod?.members.add(this);
    this.gen = 0; // jeton d'affectation : invalide les minuteries d'une mission passee
  }
  // Depuis les cloisons, un îlot ne s'aborde que par son ouverture sur l'allée
  // centrale : couloir de gauche → allée → portillon → bureau. Jamais en diagonale,
  // sinon les agents traversent le verre.
  // Ces trajets sont calculés depuis la position réelle, pas depuis le bureau : un
  // agent congédié en pleine arrivée ne doit pas repartir en diagonale à travers le verre.
  insidePod() {
    if (!this.pod) return false; // employe sans affectation : il n'est dans aucun ilot
    const p = this.c.g.position, s = this.pod.slot;
    return Math.abs(p.x - s.x) < 3.05 && Math.abs(p.z - s.z) < 3.05;
  }
  // Rejoindre l'allée centrale depuis là où l'on se trouve. Trois cas seulement :
  // dans un îlot (on sort par le portillon), dans la baie café (on redescend le long
  // du bord droit), ou dans le couloir de gauche.
  fromHere() {
    const p = this.c.g.position;
    if (this.insidePod()) return [new V3(p.x, 0, this.pod.gate.z), new V3(p.x, 0, AISLE_Z)];
    // Le test porte aussi sur x : le salon est a l'avant GAUCHE et depasse lui aussi
    // CAFE_Z. Sans ca, un employe quittant le canape traverserait toute la piece.
    if (p.z >= CAFE_Z && p.x > 8) return [new V3(CAFE_LANE_X, 0, p.z), new V3(CAFE_LANE_X, 0, AISLE_Z)];
    return [new V3(CORRIDOR_X, 0, p.z), new V3(CORRIDOR_X, 0, AISLE_Z)];
  }
  toDesk() {
    const s = this.desk.seat;
    return [...this.fromHere(), new V3(s.x, 0, AISLE_Z),
      new V3(s.x, 0, this.pod.gate.z), s.clone()];
  }
  // Pas de trajet vers la sortie : depuis que la maison garde ses gens, personne ne
  // repart. La porte ne sert plus qu'aux arrivées.
  // On descend la voie d'acces jusqu'au niveau de la place, puis on s'y range : le
  // dernier pas est court et ne traverse ni le bar ni le mange-debout.
  toSpot(spot) {
    // Le salon et ses abords se gagnent par le couloir de gauche, le bar par la
    // voie de droite. Ce sont les deux seules facons de descendre sans traverser.
    const lane = spot.kind === 'coffee' ? CAFE_LANE_X : CORRIDOR_X;
    // Le canape s'aborde par la bande degagee devant lui, puis on s'assoit en
    // reculant : rejoindre la place en longeant l'assise traverserait l'accoudoir.
    if (spot.kind === 'couch') {
      return [...this.fromHere(), new V3(lane, 0, AISLE_Z), new V3(lane, 0, COUCH_LANE_Z),
        new V3(spot.pos.x, 0, COUCH_LANE_Z), spot.pos.clone()];
    }
    return [...this.fromHere(), new V3(lane, 0, AISLE_Z),
      new V3(lane, 0, spot.pos.z), spot.pos.clone()];
  }
  set(act, text) { this.act = act; this.t.textContent = text; this.el.dataset.act = act; }
  // Dernier mot de l'agent (last_assistant_message), affiché quelques secondes.
  say(msg) {
    const txt = trunc(String(msg ?? '').replace(/[#*`>_]/g, ''), 150);
    if (!txt) return;
    this.sayEl.textContent = '« ' + txt + ' »';
    this.sayEl.hidden = false;
    clearTimeout(this.sayTimer);
    this.sayTimer = setTimeout(() => { this.sayEl.hidden = true; }, 12000);
  }

  // « va boire un café » : le lead quitte son poste pour le mange-debout. Réservé au
  // lead — un employé au repos passe par goIdle(), qui lui ouvre aussi le canapé.
  // Le lead garde son bureau et y reviendra : il tient le poste, pause ou pas.
  toCoffee() {
    if (this.kind !== 'main') return;
    if (this.state === 'tocoffee' || this.state === 'coffee') return;
    const spot = claimSpot();
    if (!spot) return; // bar plein : le lead reste simplement à son poste
    this.spot = spot;
    this.state = 'tocoffee';
    this.path = this.toSpot(spot);
    this.set('walk', '🚶 va au café');
  }
  // Le lead rentre du café. Son bureau n'a jamais été rendu : il s'y rassoit.
  // Un sous-agent, lui, n'a pas de poste à retrouver — il repart par la porte.
  backToDesk() {
    if (this.kind !== 'main') return;
    if (this.state !== 'coffee' && this.state !== 'tocoffee') return;
    this.freeSpot();
    this.state = 'walkin';
    this.path = this.toDesk();
    this.set('walk', '🚶 revient du café');
  }
  // Affecte a un dossier : l'employe rejoint l'ilot qui l'appelle. C'est la seule
  // facon de changer d'ilot — un employe appartient a la maison, pas a une session.
  // `instant` sert au rejeu d'une page rechargee : l'employe travaillait deja quand
  // on a ouvert la page, le faire traverser la piece depuis le canape serait un
  // mensonge — on l'assoit directement.
  assignTo(session, task, instant) {
    this.gen++;
    this.freeSpot();
    this.session = session;
    this.pod = session.pod;
    this.pod.members.add(this);
    this.el.style.borderLeft = '3px solid #' + this.pod.tint.toString(16).padStart(6, '0');
    this.task = task;
    this.desk = this.pod.claimDesk();
    if (instant) {
      this.c.g.position.copy(this.desk.seat); this.state = 'work'; this.path = [];
      this.set('think', task ? '💭 ' + trunc(task, 34) : '💭 au travail');
      return;
    }
    this.state = 'walkin';
    this.path = this.toDesk();
    this.set('walk', '🚶 rejoint ' + session.project);
  }
  // Fin de mission : l'employe rend son bureau et quitte l'ilot, mais pas la maison.
  // Il va s'occuper ailleurs — café ou canapé — et reste disponible pour la suite.
  goIdle() {
    this.gen++;
    const spot = claimLeisure(this.spot?.kind);
    // Trajet calcule avant de lacher l'ilot : fromHere() part de la position reelle.
    const path = spot ? this.toSpot(spot) : null;
    this.freeDesk();
    this.freeSpot();
    if (this.pod) { const p = this.pod; p.members.delete(this); this.pod = null; p.maybeClose(); }
    this.session = null;
    this.task = null;
    this.el.style.borderLeft = '3px solid rgba(185,168,148,.45)'; // plus de couleur de projet
    if (!spot) { this.state = 'idle'; this.path = []; this.set('idle', '🧍 traîne dans l\'open space'); return; }
    this.spot = spot;
    this.state = 'toleisure';
    this.path = path;
    this.set('walk', spot.kind === 'couch' ? '🚶 va au canapé' : '🚶 va au café');
  }
  freeSpot() { if (this.spot) { this.spot.busy = false; this.spot = null; } }
  freeDesk() {
    if (!this.desk) return;
    if ((this.desk.occupants || 1) <= 1) this.desk.setScreen(null);
    this.pod?.releaseDesk(this.desk); this.desk = null;
  }
  dispose() {
    scene.remove(this.c.g); this.el.remove(); agents.delete(this);
    this.freeSpot(); this.freeDesk();
    const i = staff.indexOf(this); if (i >= 0) staff.splice(i, 1);
    const p = this.pod; this.pod = null;
    p?.members.delete(this);
    p?.maybeClose();
  }
  update(dt, t) {
    const c = this.c, g = c.g, ph = hash(this.id) % 10;
    if (this.path.length) {
      const tgt = this.path[0], d = tgt.clone().sub(g.position), dist = d.length(), step = 3.2 * dt;
      if (dist <= step) { g.position.copy(tgt); this.path.shift(); }
      else { g.position.addScaledVector(d, step / dist); g.rotation.y = Math.atan2(-d.x, -d.z); }
      const sw = Math.sin(t * 12) * .6;
      c.legL.rotation.x = sw; c.legR.rotation.x = -sw;
      c.armL.rotation.x = -sw * .8; c.armR.rotation.x = sw * .8;
      c.torso.position.y = .65 + Math.abs(Math.sin(t * 12)) * .04;
      c.head.rotation.set(0, 0, 0);
      c.mug.visible = false; // la tasse reste au mange-debout : on ne marche pas avec
      if (!this.path.length) {
        if (this.state === 'walkin') {
          this.state = 'work';
          if (this.act === 'walk') this.set('think', this.task ? '💭 ' + trunc(this.task, 34) : '💭 prêt');
        } else if (this.state === 'tocoffee') {
          this.state = 'coffee';
          this.coffeeUntil = t + COFFEE_SEC;
          this.faceAngle = Math.atan2(-(COFFEE.x - g.position.x), -(COFFEE.z - g.position.z));
          this.set('coffee', '☕ pause café');
        } else if (this.state === 'toleisure') {
          // Arrive a sa place de repos. On ne fixe pas de fin : l'employe changera
          // simplement d'occupation au bout d'un moment, ou repartira sur un dossier.
          this.state = 'leisure';
          this.idleUntil = t + 45 + (hash(this.id) % 60);
          this.faceAngle = this.spot.face;
          this.set(...LEISURE_ACT[this.spot.kind]);
        }
      }
      return;
    }
    // Immobile : assis au poste, debout au mange-debout, ou vautré sur le canapé.
    const onCouch = this.state === 'leisure' && this.spot?.kind === 'couch';
    const standing = this.state === 'coffee' || (this.state === 'leisure' && !onCouch);
    const resting = standing || onCouch;
    // Le lead rentre tenir son poste quand sa pause s'achève ; un employé, lui, ne
    // rentre nulle part — il change juste d'occupation.
    if (this.state === 'coffee' && t >= this.coffeeUntil) { this.backToDesk(); return; }
    if (this.state === 'leisure') {
      // Un employé repris de la mémoire du serveur arrive sans minuterie : on la lui
      // pose à sa première frame plutôt que de la calculer hors de la boucle.
      if (this.idleUntil == null) this.idleUntil = t + 45 + (hash(this.id) % 60);
      if (t >= this.idleUntil) { this.goIdle(); return; }
    }
    g.rotation.y = resting ? this.faceAngle : 0;
    c.legL.rotation.x = c.legR.rotation.x = standing ? 0 : Math.PI / 2;
    c.torso.position.y = .65; c.head.rotation.set(0, 0, 0);
    c.mug.visible = this.state === 'coffee' || this.spot?.kind === 'coffee';
    c.pad.visible = onCouch;
    const a = this.act;
    if (a === 'type' || a === 'term' || a === 'plan') {
      const sp = a === 'plan' ? 10 : 28;
      c.armL.rotation.x = 1.25 + .12 * Math.sin(t * sp + ph);
      c.armR.rotation.x = 1.25 + .12 * Math.sin(t * sp + ph + Math.PI);
      c.head.rotation.x = -.1;
    } else if (a === 'read' || a === 'web') {
      c.armL.rotation.x = .9; c.armR.rotation.x = 1.05 + .08 * Math.sin(t * 5 + ph);
      c.head.rotation.x = -.25; c.head.rotation.y = .15 * Math.sin(t * 1.3 + ph);
    } else if (a === 'think') {
      c.armL.rotation.x = .3; c.armR.rotation.x = 2.2; c.armR.rotation.z = -.2;
      c.head.rotation.z = .15 * Math.sin(t * 1.5 + ph);
      c.torso.position.y = .65 + .02 * Math.sin(t * 2 + ph);
    } else if (a === 'wait') {
      c.armL.rotation.x = .3; c.armR.rotation.x = 2.9 + .2 * Math.sin(t * 8);
      c.torso.position.y = .65 + Math.abs(Math.sin(t * 6)) * .06;
    } else if (a === 'coffee') { // debout, tasse en main, regard qui flâne
      c.armL.rotation.x = .22;
      c.armR.rotation.x = 1.45 + .07 * Math.sin(t * 1.5 + ph);
      c.head.rotation.y = .28 * Math.sin(t * .7 + ph);
      c.torso.position.y = .65 + .018 * Math.sin(t * 1.3 + ph);
    } else if (a === 'game') {
      // Manette : les bras en avant, les pouces qui s'agitent, le dos qui s'affaisse.
      c.armL.rotation.x = 1.12 + .06 * Math.sin(t * 9 + ph);
      c.armR.rotation.x = 1.12 + .06 * Math.sin(t * 11 + ph);
      c.head.rotation.x = -.06; c.torso.position.y = .62;
    } else { // idle
      c.armL.rotation.x = c.armR.rotation.x = .2; c.head.rotation.x = .15;
    }
    if (a !== 'think') c.armR.rotation.z = 0;
    this.desk?.setScreen(a, t);
  }
  // Position a l'ecran, sans toucher au DOM : la mise en page est faite en une passe
  // par layoutLabels(), qui a besoin de les connaitre toutes avant d'en placer une.
  projectLabel() {
    tmp.copy(this.c.g.position); tmp.y += 2.3; tmp.project(cam);
    this.lx = (tmp.x * .5 + .5) * innerWidth;
    this.ly = (-tmp.y * .5 + .5) * innerHeight;
  }
}

// Deux agents cote a cote — deux employes sur le canape, par exemple — donnaient deux
// etiquettes superposees, dont une illisible. On les empile : les plus hautes d'abord,
// et chacune redescend tant qu'elle en recouvre une deja posee dans sa colonne.
//
// Lectures et ecritures du DOM sont separees en deux boucles : les melanger forcerait
// un recalcul de mise en page du navigateur a chaque etiquette, a chaque frame.
const LABEL_GAP = 4;
function layoutLabels() {
  const list = [];
  for (const a of agents) { a.projectLabel(); list.push(a); }
  for (const a of list) { a.lw = a.el.offsetWidth || 120; a.lh = a.el.offsetHeight || 34; }
  list.sort((p, q) => p.ly - q.ly);
  const placed = [];
  for (const a of list) {
    const x0 = a.lx - a.lw / 2, x1 = a.lx + a.lw / 2;
    let y = a.ly;
    // Quelques passes suffisent ; la borne evite toute boucle folle si ca se croise.
    for (let pass = 0; pass < list.length + 1; pass++) {
      let moved = false;
      for (const p of placed) {
        if (x1 <= p.x0 || p.x1 <= x0) continue;        // colonnes disjointes
        if (y - a.lh >= p.y || y <= p.y - p.h) continue; // deja separees
        y = p.y + a.lh + LABEL_GAP; moved = true;
      }
      if (!moved) break;
    }
    placed.push({ x0, x1, y, h: a.lh });
    a.el.style.left = a.lx + 'px';
    a.el.style.top = y + 'px';
  }
}

/* ---------- Événements Claude Code → animations ---------- */
const trunc = (s, n) => { s = String(s ?? '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const isTask = (n) => n === 'Task' || n === 'Agent';

// « va boire un café » tapé dans une session Claude : le lead quitte son poste pour
// le mange-debout. Le prompt doit se réduire EXACTEMENT à l'une de ces phrases —
// sinon une demande qui *parle* de café (« ajoute un bouton café ») l'enverrait au bar.
const COFFEE_CMDS = new Set([
  'cafe', 'coffee', 'pause', 'break', 'pause cafe', 'coffee break', 'un cafe',
  'va boire un cafe', 'va prendre un cafe', 'va au cafe', 'go get coffee',
  'take a break', 'fais une pause', 'prends une pause', 'prends un cafe',
]);
const isCoffeeCmd = (p) => COFFEE_CMDS.has(String(p ?? '')
  .normalize('NFD').replace(/[̀-ͯ]/g, '')  // « café » → « cafe »
  .toLowerCase().replace(/[^a-z ]/g, ' ').replace(/s+/g, ' ').trim());

function describe(n = '', i = {}) {
  const f = i.file_path || i.notebook_path || i.path || '';
  const b = f ? f.split(/[\\/]/).pop() : '';
  if (n === 'Read') return ['read', '📖 lit ' + b];
  if (/^(Glob|Grep|LS)$/.test(n)) return ['read', '🔎 fouille ' + trunc(i.pattern || b, 24)];
  if (/^(Edit|MultiEdit|Write|NotebookEdit)$/.test(n)) return ['type', '⌨️ code ' + b];
  if (n === 'Bash') return ['term', '🖥️ ' + trunc(i.command, 30)];
  if (/^Web(Search|Fetch)$/.test(n)) return ['web', '🌐 ' + trunc(i.query || i.url, 30)];
  if (/^(TodoWrite|TaskCreate|TaskUpdate)$/.test(n)) return ['plan', '📝 planifie'];
  if (n.startsWith('mcp__')) return ['web', '🔌 ' + trunc(n.split('__').slice(1).join(' › '), 30)];
  return ['think', '⚙️ ' + n];
}

const sessions = new Map();
let podCount = 0;

// L'effectif : tous les employes de la maison, au travail ou non. Un agent appele
// une fois y entre et n'en sort plus — c'est ce qui fait la difference entre une
// agence d'interim et une entreprise. Les leads n'en font pas partie : ils SONT la
// session, et disparaissent avec elle.
const staff = [];
const idleStaff = (type) => staff.find((a) => a.name === type && !a.session);

// Ce qu'on fait selon l'endroit où l'on traîne. Partagé par l'arrivée au repos et
// par la reprise d'un employé gardé en mémoire, pour qu'ils ne divergent jamais.
const LEISURE_ACT = {
  couch: ['game', '🎮 joue à la console'],
  coffee: ['coffee', '☕ au mange-debout'],
  stand: ['idle', '🧍 discute près du salon'],
};

// Reconstitue un employé que le serveur a gardé en mémoire. Il était déjà dans la
// maison avant qu'on ouvre la page : on le pose directement à une place de repos
// plutôt que de le faire entrer par la porte, ce qui serait un mensonge.
function hire(type) {
  if (staff.some((a) => a.name === type)) return;
  const a = new Agent('staff:' + type, { name: type, kind: 'sub' });
  staff.push(a);
  const spot = claimLeisure();
  // Aucune place : on le pose quand même devant le salon plutôt qu'à l'origine de
  // la scène, c'est-à-dire au beau milieu de la pièce.
  a.c.g.position.copy(spot ? spot.pos : new V3(LOUNGE_X + 3.2, 0, LOUNGE_Z + .4));
  if (!spot) { a.set('idle', '🧍 traîne dans l\'open space'); return; }
  a.spot = spot;
  a.state = 'leisure';
  a.faceAngle = spot.face;
  a.set(...LEISURE_ACT[spot.kind]);
}

// Nom de projet = dernier segment du cwd (chemins Windows ou POSIX).
function projectName(cwd) {
  return String(cwd || '').split(/[\\/]+/).filter(Boolean).pop() || 'session';
}
// Deux sessions ouvertes sur le même projet : on les numérote.
function uniqueName(base) {
  const used = new Set([...sessions.values()].map((s) => s.project));
  if (!used.has(base)) return base;
  for (let i = 2; ; i++) if (!used.has(base + ' #' + i)) return base + ' #' + i;
}

function whoFor(s, ev) {
  if (!s.subs.length) return s.main;
  if (ev.agent_id) { // si la version de Claude Code fournit l'id du sous-agent
    let a = s.subs.find(x => x.agentId === ev.agent_id);
    if (!a) { a = s.subs.find(x => !x.agentId); if (a) a.agentId = ev.agent_id; }
    if (a) return a;
  }
  return s.subs[s.subs.length - 1]; // heuristique : le dernier sous-agent lancé
}

// Fin de mission : petit temps mort, puis le mange-debout — sauf rappel entre-temps.
// Fin de mission : un temps mort pour que le rapport se lise, puis l'employe quitte
// l'ilot. Le jeton `gen` garantit qu'une reaffectation entre-temps annule le depart.
function finishSub(s, sub, label) {
  sub.set('idle', label);
  const gen = sub.gen;
  setTimeout(() => { if (sub.gen === gen) sub.goIdle(); }, 1400);
  s.main.set('read', '📥 lit le rapport');
}

function handle(ev) {
  const sid = ev.session_id || 'local', evn = ev.hook_event_name;
  // L'effectif rejoué par le serveur : des employés, pas une session. Traité avant
  // toute autre chose — sans ça, l'absence de session_id créerait un îlot fantôme.
  if (evn === 'Staff') {
    for (const type of ev.staff || []) hire(type);
    renderSessions();
    return;
  }
  let s = sessions.get(sid);
  if (!s) {
    if (evn === 'SessionEnd') return;
    const project = uniqueName(projectName(ev.cwd));
    const pod = new Pod(project, sid.slice(0, 8), TINTS[podCount++ % TINTS.length]);
    s = {
      sid, cwd: ev.cwd || '', project, pod, subs: [],
      main: new Agent(sid, { name: project, kind: 'main', pod }),
      startedAt: Date.now(), tools: 0, slowest: null, lastTool: '', alert: null,
      bg: [], effort: ev.effort, mode: ev.permission_mode,
    };
    s.main.session = s;
    sessions.set(sid, s);
  }
  if (ev.cwd) s.cwd = ev.cwd;
  if (ev.effort) s.effort = ev.effort;
  if (ev.permission_mode) s.mode = ev.permission_mode;
  // `background_tasks` arrive sur Stop et SubagentStop : on garde les tâches en cours.
  if (Array.isArray(ev.background_tasks)) {
    s.bg = ev.background_tasks.filter((t) => t.status === 'running');
    refreshRack();
  }
  // Toute activité lève l'alerte : si ça travaille, ça n'attend pas.
  if (evn === 'UserPromptSubmit' || evn === 'PreToolUse') setAlert(s, null);
  // La pause du lead s'arrête dès qu'il y a du travail : on ne code pas au mange-debout.
  if (evn === 'PreToolUse' || (evn === 'UserPromptSubmit' && !isCoffeeCmd(ev.prompt))) s.main.backToDesk();

  let who = s.main, line = '';
  switch (evn) {
    case 'SessionStart': s.main.set('idle', '☕ en poste'); line = 'session démarrée'; break;
    case 'UserPromptSubmit':
      if (isCoffeeCmd(ev.prompt)) { s.main.toCoffee(); line = 'part en pause café'; break; }
      s.main.set('think', '💭 ' + trunc(ev.prompt, 40)); line = '« ' + trunc(ev.prompt, 60) + ' »'; break;
    case 'PreToolUse': {
      const ti = ev.tool_input || {};
      if (isTask(ev.tool_name)) {
        const type = ti.subagent_type || 'agent', task = ti.description || ti.prompt;
        // La maison garde ses gens : on cherche d'abord un employé de ce métier qui
        // traîne au café ou sur le canapé, quelle que soit la session qui l'avait
        // embauché. On n'embauche que si tous ceux de ce métier sont déjà sur un dossier.
        let sub = idleStaff(type);
        if (sub) {
          sub.assignTo(s, task, !!ev._replay);
          line = 'rappelle ' + type + ' : ' + trunc(ti.description, 40);
        } else {
          const variant = staff.filter((a) => a.name === type).length;
          sub = new Agent(sid + ':' + (ev.tool_use_id || Math.random().toString(36).slice(2)),
            { name: type, kind: 'sub', task, pod: s.pod, seated: !!ev._replay, variant });
          sub.session = s; staff.push(sub);
          line = 'embauche ' + type + ' : ' + trunc(ti.description, 40);
        }
        sub.toolUseId = ev.tool_use_id; s.subs.push(sub);
        s.main.set('think', '👉 délègue à ' + type);
      } else {
        who = whoFor(s, ev);
        const [act, label] = describe(ev.tool_name, ti); who.set(act, label); line = label;
        s.tools++; s.lastTool = ev.tool_name;
        who.startedTool = { name: ev.tool_name, at: Date.now() };
      }
      break;
    }
    case 'PostToolUse': {
      if (!isTask(ev.tool_name)) {
        if (ev.duration_ms > (s.slowest?.ms ?? 0)) s.slowest = { name: ev.tool_name, ms: ev.duration_ms };
        const w = whoFor(s, ev); if (w) w.startedTool = null;
        break;
      }
      let i = s.subs.findIndex(a => a.toolUseId && a.toolUseId === ev.tool_use_id);
      if (i < 0) i = 0;
      const sub = s.subs[i];
      if (!sub) break;
      const r = ev.tool_response || {};
      if (r.isAsync || r.status === 'async_launched') {
        // L'appel rend la main en quelques millisecondes : l'agent ne finit pas, il
        // démarre. On retient son identité pour reconnaître son vrai SubagentStop.
        sub.agentId = r.agentId;
        sub.set('think', sub.task ? '💭 ' + trunc(sub.task, 34) : '💭 au travail');
        who = sub; line = 'parti en mission';
      } else {
        s.subs.splice(i, 1);
        finishSub(s, sub, '✅ terminé');
        who = sub; line = 'mission terminée → pause café';
      }
      break;
    }
    case 'SubagentStop': {
      // Vraie fin d'un agent. `agent_id` permet de désigner le bon, même en parallèle.
      let i = ev.agent_id ? s.subs.findIndex(a => a.agentId === ev.agent_id) : -1;
      if (i < 0 && !ev.agent_id) i = s.subs.findIndex(a => !a.agentId);
      if (i < 0) break;
      const sub = s.subs.splice(i, 1)[0];
      finishSub(s, sub, '📤 rend son rapport');
      sub.say(ev.last_assistant_message);
      who = sub; line = 'rapport rendu → pause café';
      break;
    }
    case 'Notification':
      s.main.set('wait', '✋ ' + trunc(ev.message || 'attend ta validation', 36));
      setAlert(s, ev.notification_type === 'idle_prompt' ? 'idle' : 'permission', ev.message);
      line = trunc(ev.message, 60); break;
    case 'Stop':
      s.main.set('idle', '☕ pause — à toi');
      setAlert(s, 'done', 'a fini son tour');
      s.main.say(ev.last_assistant_message);
      line = 'a fini, attend ta suite'; break;
    case 'SessionEnd':
      s.pod.closing = true; // l'îlot part quand ses derniers occupants l'ont quitté
      // Le dossier est clos, pas les contrats : les employés retournent à l'open space.
      [...s.subs].forEach((a) => a.goIdle());
      s.subs = [];
      setAlert(s, null);
      sessions.delete(sid);
      s.pod.maybeClose(); // aucun sous-agent en vol : l'îlot se démonte tout de suite
      line = 'session fermée'; break;
  }
  if (line) log((who === s.main ? s.project : s.project + ' › ' + who.name) + ' · ' + line);
  renderSessions();
}

/* ---------- Appels : « cette session a besoin de toi » ---------- */
// C'est le signal qui rend le bureau utile en second ecran : on doit pouvoir le
// capter sans lire les etiquettes, et meme sans regarder l'onglet.
const ALERTS = {
  idle:       { label: 'attend ton input',   color: 0xffb020, emoji: '✋' },
  permission: { label: 'attend ta validation', color: 0xe0695e, emoji: '✋' },
  done:       { label: 'a fini son tour',    color: 0x8fcf8a, emoji: '✅' },
};

function setAlert(s, kind, detail) {
  if (s.alert?.kind === kind) return;
  s.alert = kind ? { kind, detail, at: Date.now() } : null;
  s.pod.setBeacon(kind ? ALERTS[kind].color : null);
  if (kind && kind !== 'done') ping();
  refreshAttention();
}

// Titre de l'onglet + pastille sur la favicon : lisibles depuis la barre des taches.
const favicon = document.createElement('link');
favicon.rel = 'icon'; document.head.appendChild(favicon);
function drawFavicon(n) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#2b221c'; x.beginPath();
  if (x.roundRect) x.roundRect(2, 2, 60, 60, 14); else x.rect(2, 2, 60, 60);
  x.fill();
  x.fillStyle = '#e8743b'; x.fillRect(12, 40, 40, 8);        // le bureau
  x.fillStyle = '#f4e9dc'; x.fillRect(20, 18, 24, 18);       // l'ecran
  if (n) {
    x.fillStyle = '#e0695e'; x.beginPath(); x.arc(48, 16, 15, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#fff'; x.font = 'bold 22px system-ui'; x.textAlign = 'center';
    x.fillText(String(n), 48, 24);
  }
  favicon.href = c.toDataURL('image/png');
}

function refreshAttention() {
  const waiting = [...sessions.values()].filter((s) => s.alert);
  document.title = waiting.length ? `(${waiting.length}) Claude Office` : 'Claude Office';
  drawFavicon(waiting.length);
  renderSessions();
}

// Son : coupe par defaut, et l'activer compte comme le geste utilisateur que les
// navigateurs exigent pour autoriser l'audio.
let audio = null, soundOn = false;
function ping() {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(1320, t + .12);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.12, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + .45);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + .5);
  } catch { /* pas d'audio disponible : tant pis, le visuel suffit */ }
}

/* ---------- Panneau « Sessions » ---------- */
const sessionsEl = document.getElementById('sessions'), sessionsListEl = document.getElementById('sessions-list');
function renderSessions() {
  sessionsEl.style.display = (sessions.size || staff.length) ? 'block' : 'none';
  sessionsListEl.textContent = '';
  for (const s of sessions.values()) {
    const row = document.createElement('div'); row.className = 's';
    const dot = document.createElement('span'); dot.className = 'dot';
    dot.style.background = '#' + s.pod.tint.toString(16).padStart(6, '0');
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = s.project;
    const ct = document.createElement('span'); ct.className = 'ct';
    const bits = [];
    if (s.subs.length) bits.push(s.subs.length + ' 🤖');
    if (s.main.state === 'coffee' || s.main.state === 'tocoffee') bits.push('🧠☕');
    ct.textContent = bits.join(' ') || '—';
    if (s.alert) { row.dataset.alert = s.alert.kind; ct.textContent = ALERTS[s.alert.kind].emoji + ' ' + ct.textContent; }
    row.onclick = () => { focusPod(s.pod); select({ session: s }); };
    row.append(dot, nm, ct); sessionsListEl.appendChild(row);
  }
  // Pied de panneau : l'effectif de la maison, sessions confondues.
  if (staff.length) {
    const busy = staff.filter((a) => a.session).length;
    const couch = staff.filter((a) => a.spot?.kind === 'couch').length;
    const bar = staff.filter((a) => a.spot?.kind === 'coffee').length;
    const foot = document.createElement('div'); foot.className = 'staff';
    foot.textContent = '🏢 ' + staff.length + ' employé' + (staff.length > 1 ? 's' : '')
      + ' · ' + busy + ' 🤖' + (bar ? ' · ' + bar + ' ☕' : '') + (couch ? ' · ' + couch + ' 🎮' : '');
    sessionsListEl.appendChild(foot);
  }
}

/* ---------- Inspection : cliquer un agent, un tapis, ou une ligne du panneau ---------- */
const detailEl = document.getElementById('detail');
const unfocusEl = document.getElementById('unfocus');
const raycaster = new THREE.Raycaster();
let selection = null; // { agent } ou { session }

const since = (ms) => {
  const sec = Math.max(0, Math.round((Date.now() - ms) / 1000));
  return sec < 60 ? sec + ' s' : sec < 3600 ? Math.floor(sec / 60) + ' min' : (sec / 3600).toFixed(1) + ' h';
};
const sessionOf = (pod) => [...sessions.values()].find((s) => s.pod === pod) ?? null;

function select(sel) {
  selection = sel;
  detailEl.style.display = sel ? 'block' : 'none';
  if (sel) renderDetail();
}
function renderDetail() {
  if (!selection) return;
  const rows = [];
  let title, sub;
  if (selection.agent) {
    const a = selection.agent, s = a.session;
    if (!agents.has(a)) return select(null); // l'agent est parti
    title = (a.kind === 'main' ? '🧠 ' : '🤖 ') + a.name;
    sub = s ? s.project + ' · ' + s.cwd : '';
    rows.push(['Rôle', a.kind === 'main' ? 'lead' : 'employé']);
    if (a.kind !== 'main') rows.push(['Affectation', a.session ? a.session.project : 'disponible']);
    rows.push(['État', a.t.textContent || '—']);
    if (a.task) rows.push(['Mission', trunc(a.task, 60)]);
    if (a.agentId) rows.push(['agent_id', a.agentId.slice(0, 10)]);
    if (a.startedTool) rows.push(['Outil en cours', a.startedTool.name + ' · ' + since(a.startedTool.at)]);
  } else {
    const s = selection.session;
    if (!sessions.has(s.sid)) return select(null); // session fermée
    title = s.project;
    sub = s.cwd;
    rows.push(['Session', s.sid.slice(0, 8)]);
    rows.push(['Ouverte depuis', since(s.startedAt)]);
    rows.push(['Sous-agents', s.subs.length + ' sur ce dossier']);
    rows.push(['Effectif maison', staff.length + ' (' + staff.filter((a) => !a.session).length + ' dispo)']);
    rows.push(['Outils appelés', String(s.tools)]);
    if (s.lastTool) rows.push(['Dernier outil', s.lastTool]);
    if (s.slowest) rows.push(['Le plus long', s.slowest.name + ' · ' + (s.slowest.ms / 1000).toFixed(1) + ' s']);
    if (s.bg?.length) rows.push(['Tâches de fond', String(s.bg.length)]);
    if (s.effort) rows.push(['Effort', s.effort]);
    if (s.mode) rows.push(['Permissions', s.mode]);
    if (s.alert) rows.push(['Appel', ALERTS[s.alert.kind].label + ' · ' + since(s.alert.at)]);
  }
  document.getElementById('detail-title').textContent = title;
  document.getElementById('detail-sub').textContent = sub;
  const dl = document.getElementById('detail-body');
  dl.textContent = '';
  for (const [k, v] of rows) {
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    dl.append(dt, dd);
  }
}
document.getElementById('detail-close').onclick = () => select(null);

// Cadrage sur un îlot : on vise son emplacement et on resserre.
let focused = null;
function focusPod(pod) {
  focused = pod;
  camTarget.set(pod.slot.x, 0, pod.slot.z);
  camSpan = 7.5; resize();
  unfocusEl.hidden = false;
}
unfocusEl.onclick = () => { focused = null; unfocusEl.hidden = true; framePods(); };

renderer.domElement.addEventListener('pointerdown', (e) => {
  const r = renderer.domElement.getBoundingClientRect();
  raycaster.setFromCamera(
    { x: ((e.clientX - r.left) / r.width) * 2 - 1, y: -((e.clientY - r.top) / r.height) * 2 + 1 }, cam);
  for (const hit of raycaster.intersectObjects(scene.children, true)) {
    for (let o = hit.object; o; o = o.parent) {
      if (o.userData?.agent) return select({ agent: o.userData.agent });
      if (o.userData?.pod) {
        const s = sessionOf(o.userData.pod);
        return s ? (focusPod(o.userData.pod), select({ session: s })) : select(null);
      }
    }
  }
  select(null); // clic dans le vide
});
addEventListener('keydown', (e) => { if (e.key === 'Escape') select(null); });

// Son : l'activation vaut geste utilisateur, ce que les navigateurs exigent.
const soundEl = document.getElementById('sound');
soundEl.onclick = () => {
  soundOn = !soundOn;
  soundEl.setAttribute('aria-pressed', String(soundOn));
  soundEl.textContent = (soundOn ? '🔔' : '🔕') + ' Son';
  if (soundOn) ping();
};

/* ---------- HUD ---------- */
const logEl = document.getElementById('log'), statusEl = document.getElementById('status'), hintEl = document.getElementById('hint');
let mode = 'connecting';
function log(txt) {
  const d = document.createElement('div');
  d.textContent = new Date().toLocaleTimeString('fr-FR') + '  ' + txt;
  logEl.appendChild(d);
  while (logEl.children.length > 5) logEl.firstChild.remove();
}
function setStatus(m, txt) { mode = m; statusEl.className = 'pill ' + m; statusEl.textContent = txt; }

/* ---------- Mode démo (sans serveur) ---------- */
let demoTimers = [], demoOn = false;
const at = (ms, fn) => demoTimers.push(setTimeout(fn, ms));
const pre = (tool_name, tool_input, tool_use_id) => ({ hook_event_name: 'PreToolUse', tool_name, tool_input, tool_use_id });
const post = (tool_name, tool_use_id) => ({ hook_event_name: 'PostToolUse', tool_name, tool_use_id, tool_input: {} });
function scenario(sid, cwd, offset, prompt, steps) {
  let t = offset;
  at(t, () => handle({ session_id: sid, cwd, hook_event_name: 'SessionStart' })); t += 900;
  at(t, () => handle({ session_id: sid, cwd, hook_event_name: 'UserPromptSubmit', prompt })); t += 1800;
  for (const [dt, o] of steps) { t += dt; const e = { session_id: sid, cwd, ...o }; at(t, () => handle(e)); }
  return t;
}
function startDemo() {
  if (demoOn) return;
  demoOn = true; demoTimers = []; setStatus('demo', 'Démo');
  COFFEE_SEC = Number(params.get('coffee')) || 22; // en démo, la pause est abrégée
  const endA = scenario('demo-A', 'C:/dev/boutique-api', 0, 'Ajoute un export CSV des commandes', [
    [0, pre('TodoWrite', {})],
    [1500, pre('Agent', { subagent_type: 'Explore', description: 'Trouver le code des commandes' }, 'a1')],
    [2600, pre('Grep', { pattern: 'class Order' })],
    [1800, pre('Read', { file_path: 'src/orders/order.service.ts' })],
    [1800, pre('Glob', { pattern: 'src/**/*.export.ts' })],
    [1600, { hook_event_name: 'SubagentStop' }],
    [600, post('Agent', 'a1')],
    [2000, pre('WebSearch', { query: 'papaparse unparse options' })],
    [2200, pre('Edit', { file_path: 'src/orders/export.ts' })],
    [2600, pre('Write', { file_path: 'src/orders/export.spec.ts' })],
    [2400, pre('Bash', { command: 'npm test -- export' })],
    [2600, { hook_event_name: 'Notification', message: 'Claude a besoin de ta permission pour git push' }],
    [3500, pre('Bash', { command: 'git push origin feat/export-csv' })],
    [2000, { hook_event_name: 'Stop' }],
  ]);
  const endB = scenario('demo-B', 'C:/dev/portail-client', 4000, 'Corrige le bug de pagination', [
    [0, pre('Agent', { subagent_type: 'general-purpose', description: 'Reproduire le bug de pagination' }, 'b1')],
    [2500, pre('Bash', { command: 'npm run dev' })],
    [2500, pre('Read', { file_path: 'src/api/paginate.ts' })],
    [2000, { hook_event_name: 'SubagentStop' }], [500, post('Agent', 'b1')],
    [1500, pre('Agent', { subagent_type: 'Plan', description: 'Plan du correctif' }, 'b2')],
    [2600, pre('Read', { file_path: 'src/api/cursor.ts' })],
    [2000, { hook_event_name: 'SubagentStop' }], [500, post('Agent', 'b2')],
    [1500, pre('Edit', { file_path: 'src/api/paginate.ts' })],
    [2500, pre('Bash', { command: 'npm test' })],
    [2000, { hook_event_name: 'Stop' }],
  ]);
  const end = Math.max(endA, endB);
  at(end + 5000, () => ['demo-A', 'demo-B'].forEach(sid => handle({ session_id: sid, hook_event_name: 'SessionEnd' })));
  at(end + 11000, () => { demoOn = false; startDemo(); });
}
function stopDemo() {
  demoTimers.forEach(clearTimeout); demoTimers = []; demoOn = false;
  for (const sid of [...sessions.keys()]) if (sid.startsWith('demo-')) handle({ session_id: sid, hook_event_name: 'SessionEnd' });
}

/* ---------- Connexion au serveur ---------- */
const server = params.get('server') ?? (location.protocol.startsWith('http') ? '' : null);
if (server === null || params.has('demo')) startDemo();
else {
  let opened = false;
  try {
    const es = new EventSource(server + '/stream');
    es.onopen = () => { opened = true; stopDemo(); setStatus('live', 'Live'); };
    // Une erreur avalée ici donnerait une pièce vide sans explication : on la montre.
    es.onmessage = (e) => {
      try { handle(JSON.parse(e.data)); }
      catch (err) { console.error('[claude-office]', err, e.data); log('⚠️ ' + err.message); }
    };
    es.onerror = () => { if (!opened) { es.close(); startDemo(); } else setStatus('connecting', 'Reconnexion…'); };
  } catch { startDemo(); }
  setTimeout(() => { if (!opened) startDemo(); }, 2500);
}

/* ---------- Boucle ---------- */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  for (const a of [...agents]) a.update(dt, t);
  for (const p of pods) {
    if (p.beaconColor != null) {            // battement du gyrophare
      const k = .45 + .55 * Math.abs(Math.sin(t * 4));
      p.beacon.material.emissiveIntensity = k * 2;
      p.beaconLight.intensity = k * 16;
      p.beacon.scale.setScalar(.9 + k * .25);
    }
  }
  coffeeLed.material.emissiveIntensity = .5 + .5 * Math.sin(t * 3);
  // La tele ne s'allume que si quelqu'un est sur le canapé : une pièce vide reste
  // éteinte. Le scintillement imite un jeu, pas une image fixe.
  const players = COUCH_SPOTS.filter((k) => k.busy).length;
  tvLight.intensity = players ? 5 + 3.5 * Math.sin(t * 7) * Math.sin(t * 2.3) : 0;
  consoleLed.material.emissiveIntensity = players ? .6 + .4 * Math.sin(t * 2) : .12;
  rackLeds.forEach((led, i) => {
    if (led.material.emissive.getHex()) led.material.emissiveIntensity = .5 + .5 * Math.sin(t * 6 + i * 1.7);
  });
  controls.target.lerp(camTarget, 1 - Math.exp(-dt * 2.5)); // glisse vers le nouveau cadrage
  controls.update();
  renderer.render(scene, cam);
  layoutLabels();
  if (selection) renderDetail();
  hintEl.style.display = mode === 'live' && sessions.size === 0 ? 'block' : 'none';
});
</script>
</body>
</html>
