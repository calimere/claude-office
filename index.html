  // `?demo=20` remplit la grille d'autant d'îlots de figuration, en plus des deux
  // scénarios. C'est la seule façon de VOIR si la pièce tient à pleine charge :
  // le serveur ne rejoue aucune session, donc une page rechargée arrive dans une
  // pièce vide et ne dira jamais si vingt îlots se marchent dessus.
  const fill = Number(params.get('demo')) || 0;
  if (fill > 0) fillDemo(Math.min(fill, POD_X.length * POD_Z.length));
}
const DEMO_PROJECTS = ['protrack', 'facturation', 'rh-portail', 'etl-nuit', 'mobile-v2',
  'datalake', 'sso', 'monitoring', 'crm', 'devis', 'stock', 'paie', 'cartographie',
  'notifs', 'search', 'billing', 'infra', 'docs', 'veille', 'achats'];
function fillDemo(n) {
  const metiers = ['Explore', 'Plan', 'general-purpose', 'ingenieur-exigences', 'redacteur-livrables'];
  for (let i = 0; i < n; i++) {
    const sid = 'demo-f' + i, cwd = 'C:/dev/' + (DEMO_PROJECTS[i] || 'projet-' + i);
    const machine = 'poste-' + String(1 + (i % 7)).padStart(2, '0');
    handle({ session_id: sid, cwd, machine, hook_event_name: 'SessionStart', fleet: true });
    for (let k = 0; k < 1 + (i % 3); k++) {
      handle({ session_id: sid, cwd, machine, fleet: true, hook_event_name: 'PreToolUse',
        act: 'task', tool_name: 'Agent', tool_use_id: 'f' + i + '-' + k,
        tool_input: { subagent_type: metiers[(i + k) % metiers.length] } });
    }
    // Un îlot sur cinq attend une réponse : c'est l'état qu'on vient vérifier.
    if (i % 5 === 2) handle({ session_id: sid, machine, fleet: true, hook_event_name: 'Notification' });
    else handle({ session_id: sid, machine, fleet: true, hook_event_name: 'PreToolUse',
      act: ['read', 'type', 'term', 'web'][i % 4], label: '🖥️ console' });
  }
}
function stopDemo() {
  demoTimers.forEach(clearTimeout); demoTimers = []; demoOn = false;
  for (const sid of [...sessions.keys()]) if (sid.startsWith('demo-')) handle({ session_id: sid, hook_event_name: 'SessionEnd' });
}

/* ---------- Connexion au serveur ---------- */
const server = params.get('server') ?? (location.protocol.startsWith('http') ? '' : null);
if (server === null || params.has('demo')) startDemo();
else {
  let opened = false;
  try {
    const es = new EventSource(server + '/stream');
    es.onopen = () => { opened = true; stopDemo(); setStatus('live', 'Live'); };
    // Une erreur avalée ici donnerait une pièce vide sans explication : on la montre.
    es.onmessage = (e) => {
      try { handle(JSON.parse(e.data)); }
      catch (err) { console.error('[claude-office]', err, e.data); log('⚠️ ' + err.message); }
    };
    es.onerror = () => { if (!opened) { es.close(); startDemo(); } else setStatus('connecting', 'Reconnexion…'); };
  } catch { startDemo(); }
  setTimeout(() => { if (!opened) startDemo(); }, 2500);
}


/* ---------- Grain, vignette ---------- */
// `?fx=0` coupe tout : grain, vignettage et halo. La scene reste parfaitement lisible
// sans eux — ce sont des agrements, pas de l'information.
const FX_ON = params.get('fx') !== '0';
if (FX_ON) {
  // Bruit tire une fois dans un petit carre, puis repete : un bruit recalcule a chaque
  // image grésillerait et couterait cher pour rien.
  const nz = document.createElement('canvas'); nz.width = nz.height = 128;
  const nx = nz.getContext('2d');
  const img = nx.createImageData(128, 128);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 110 + Math.random() * 90;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  nx.putImageData(img, 0, 0);
  const grainEl = document.getElementById('grain');
  grainEl.style.backgroundImage = 'url(' + nz.toDataURL('image/png') + ')';
  // On ne redessine pas le grain : on le decale. Huit positions suffisent a le faire
  // vivre, et c'est une seule propriete CSS a changer.
  let gi = 0;
  setInterval(() => { gi = (gi + 1) % 8; grainEl.style.backgroundPosition = (gi * 17) + 'px ' + (gi * 29) + 'px'; }, 90);
} else {
  document.getElementById('grain').style.display = 'none';
  document.getElementById('vignette').style.display = 'none';
}

/* ---------- Ambiance sonore ---------- */
// Aucune piste n'est livree avec le projet : une boucle lofi est une oeuvre, et ce
// depot est public. Posez votre `ambience.mp3` a cote d'index.html, le serveur le sert.
// Absent, le bouton de son continue de ne piloter que le bip.
let ambience = null, ambienceDead = false;
const volEl = document.getElementById('vol');
function ambienceOn(on) {
  if (server === null || ambienceDead) return;
  if (!ambience) {
    ambience = new Audio(server + '/ambience.mp3');
    ambience.loop = true;
    ambience.volume = Number(volEl.value) / 100;
    ambience.addEventListener('error', () => { ambienceDead = true; volEl.hidden = true; });
  }
  if (on) ambience.play().catch(() => { ambienceDead = true; volEl.hidden = true; });
  else ambience.pause();
  volEl.hidden = !on || ambienceDead;
}
volEl.addEventListener('input', () => { if (ambience) ambience.volume = Number(volEl.value) / 100; });

/* ---------- Halo sur les sources lumineuses ---------- */
// Import dynamique et sous try : si le CDN ne repond pas ou si le chemin des modules
// additionnels change, on rend sans halo plutot que de laisser une page blanche.
// Le seuil est haut : seules les ampoules et les ecrans allumes debordent.
if (FX_ON) {
  try {
    const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }] = await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
    ]);
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, cam));
    composer.addPass(new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight), .34, .8, .86));
    composer.setSize(innerWidth, innerHeight);
  } catch (e) {
    console.warn('[claude-office] halo indisponible, rendu simple :', e);
    composer = null;
  }
}

/* ---------- Boucle ---------- */
const clock = new THREE.Clock();
let dayLast = -9;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;

  // L'heure avance en continu. On ne recalcule l'eclairage que quatre fois par
  // seconde — sauf en horloge acceleree, ou il faut suivre image par image.
  const hour = nowHours(t);
  HEURE = hour; // lue par claimLeisure(), qui decide de l'heure du repas
  // Le cadrage suit les gens : il faut donc le reprendre pendant qu'ils marchent, et
  // plus seulement quand un ilot apparait. Deux fois par seconde suffit — la cible
  // glisse par interpolation, et camSpan a son propre seuil.
  if (t - frameLast > .5) { framePods(); frameLast = t; }
  if (CLOCK_SPEED > 0 || t - dayLast > .25) { applyDaylight(hour); applyEndOfDay(hour); dayLast = t; }

  // Le dehors n'est redessine que s'il bouge : pluie, neige et nuages a 10 images
  // par seconde, le reste seulement quand quelque chose a change. Redessiner une
  // ville entiere a 60 Hz pour un ciel bleu fixe serait du gaspillage pur.
  const vivant = WX.kind === 'rain' || WX.kind === 'snow' || WX.kind === 'storm'
    || WX.kind === 'cloud' || CLOCK_SPEED > 0;
  if (skyDirty || (vivant && t - skyLast > .1) || t - skyLast > 3) {
    drawSky(hour, t); skyLast = t; skyDirty = false;
  }
  for (const a of [...agents]) a.update(dt, t);
  updateSpills(dt, t);
  for (const p of pods) {
    if (p.beaconColor != null) {            // battement du gyrophare
      const k = .45 + .55 * Math.abs(Math.sin(t * 4));
      p.beacon.material.emissiveIntensity = k * 2;
      p.beacon.scale.setScalar(.9 + k * .25);
      if (p === beaconPod) beaconLight.intensity = k * 16;
    }
  }
  updateLife(dt, t);
  // L'horloge ne change qu'a chaque releve : inutile de la redessiner a 60 Hz.
  if (clockDirty) { drawClock(); clockDirty = false; }
  coffeeLed.material.emissiveIntensity = .5 + .5 * Math.sin(t * 3);
  // La tele ne s'allume que si quelqu'un est sur le canapé : une pièce vide reste
  // éteinte. Le scintillement imite un jeu, pas une image fixe.
  const players = COUCH_SPOTS.filter((k) => k.busy).length;
  tvLight.intensity = players ? 5 + 3.5 * Math.sin(t * 7) * Math.sin(t * 2.3) : 0;
  consoleLed.material.emissiveIntensity = players ? .6 + .4 * Math.sin(t * 2) : .12;
  rackLeds.forEach((led, i) => {
    if (led.material.emissive.getHex()) led.material.emissiveIntensity = .5 + .5 * Math.sin(t * 6 + i * 1.7);
  });
  controls.target.lerp(camTarget, 1 - Math.exp(-dt * 2.5)); // glisse vers le nouveau cadrage
  controls.update();
  if (composer) composer.render(); else renderer.render(scene, cam);
  layoutLabels();
  if (selection) renderDetail();
  hintEl.style.display = mode === 'live' && sessions.size === 0 ? 'block' : 'none';
});
</script>
</body>
