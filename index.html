    this.bulb.material.emissiveIntensity = (.15 + 1.45 * (this.lampLevel ?? 0)) * k;
  }
  // Tamise l'ilot (poste injoignable) ou l'eteint tout a fait (bureau deserte).
  setLampScale(k) { this.lampScale = k; this.applyLamp(); }
  setBeacon(color) {
    this.beaconColor = color ?? null;
    this.beacon.visible = color != null;
    if (color != null) this.beacon.material.emissive.setHex(color);
    placeBeaconLight();
  }
  releaseDesk(d) {
    if ((d.occupants = (d.occupants || 1) - 1) > 0) return;
    d.busy = false; d.setScreen(null);
    // L'équipe a rétréci : on rend les bureaux vides de la FIN. Jamais ceux du
    // milieu — leurs voisins glisseraient d'une place, et on verrait des gens
    // assis se téléporter. Le premier ne part pas : un îlot sans bureau n'existe pas.
    let rendu = false;
    while (this.desks.length > 1 && !this.desks[this.desks.length - 1].busy) {
      const mort = this.desks.pop();
      this.g.remove(mort.g);
      mort.g.traverse((o) => { o.geometry?.dispose(); o.material?.dispose(); });
      rendu = true;
    }
    if (rendu) this.fitRug();
  }
  // Session terminée : on attend que les sous-agents aient franchi la porte, puis
  // le lead s'efface sur place (il ne sort jamais) et l'îlot est démonté.
  maybeClose() {
    if (!this.closing || this.closed) return;
    if ([...this.members].some((a) => a.kind !== 'main')) return;
    this.closed = true;
    for (const a of [...this.members]) a.dispose();
    this.dispose();
  }
  dispose() {
    scene.remove(this.g);
    this.g.traverse((o) => { o.geometry?.dispose(); o.material?.map?.dispose(); o.material?.dispose(); });
    this.slot.count--; pods.delete(this); invalidateNav(); framePods();
    // L'ilot demonte pouvait porter la lumiere du gyrophare : elle doit retrouver
    // un porteur, ou s'eteindre.
    if (beaconPod === this) placeBeaconLight();
  }
}

// Recentre et redimensionne la vue sur ce qu'il y a à regarder.
//
// On cadre LES GENS, pas seulement les îlots. Un bureau se regarde pour ses
// occupants, et les lieux de repos — bar à droite, salon au centre, places debout à
// gauche, table du midi — s'étalent sur toute la largeur de la bande avant. Cadré
// sur les seuls îlots, le plateau coupait quiconque allait prendre un café : on
// perdait précisément ce qu'on vient voir.
//
// Les emplacements restent dans la boîte : un îlot dont tout le monde est sorti
// garde son tapis et son nom, et doit rester visible.
function framePods() {
  if (focused) return; // un ilot est epingle : on ne recadre pas dans son dos
  if (!pods.size) { camTarget.set(0, 0, 0); camSpan = 8.5; resize(); return; }
  // Cadrage sur la boite englobante plutot que sur la moyenne : avec vingt
  // emplacements, deux ilots aux coins opposes ont la meme moyenne que deux ilots
  // cote a cote, et l'un des deux cadrages serait faux. L'echelle d'avant etait une
  // echelle par paliers, qui n'allait pas au-dela de six.
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  const tenir = (x, z) => {
    x0 = Math.min(x0, x); x1 = Math.max(x1, x);
    z0 = Math.min(z0, z); z1 = Math.max(z1, z);
  };
  for (const p of pods) tenir(p.slot.x, p.slot.z);
  // Les partis du soir ne comptent pas : ils ne sont plus dans la piece.
  for (const a of agents) {
    if (a.state === 'away') continue;
    tenir(a.c.g.position.x, a.c.g.position.z);
  }
  // En vue isometrique, x et z poussent tous les deux l'image vers le haut : c'est
  // leur SOMME qui decide de la hauteur a l'ecran, pas le plus grand des deux. Cette
  // somme, divisee par racine(6), donne exactement la hauteur occupee a l'ecran.
  //
  // La marge est ADDITIVE, et c'est tout l'objet du reglage : une marge
  // proportionnelle (l'ancienne valait 2,7 fois le strict necessaire) donne un
  // cadrage correct sur un ilot et deux tiers d'ecran vides sur vingt, puisqu'elle
  // grandit avec ce qu'elle entoure. Ce qu'on veut, c'est une quantite FIXE de
  // contexte autour des ilots occupes, quel que soit leur nombre.
  //
  // CONTEXTE couvre la hauteur des suspensions (4,5, soit 3,7 a l'ecran) et de quoi
  // respirer autour. Le facteur 1,08 laisse le reste du jeu.
  const CONTEXTE = 5.8;
  const etendue = (x1 - x0 + 6.1) + (z1 - z0 + 6.3);
  // camSpan est la DEMI-hauteur du cadre, d'ou le 2 au denominateur.
  const contenu = Math.max(8.5, etendue / (2 * Math.sqrt(6)) * 1.08 + CONTEXTE);

  // LA PIECE ENTIERE, TOUJOURS. Depuis que l'aile de droite abrite trois salles, un
  // cadrage sur le seul contenu les laissait au bord et finissait par les couper :
  // la cantine, le coin loisir et la salle serveur existent meme quand personne n'y
  // est, et un bureau qu'on regarde comme un aquarium se regarde en entier.
  //
  // En isometrique, la piece occupe (w + d) / racine(6) de hauteur a l'ecran ; la
  // demi-hauteur en est la moitie. Le facteur 1,06 laisse un filet de marge.
  const spanPiece = (ROOM.w + ROOM.d) / (2 * Math.sqrt(6)) * 1.06;
  const vise = Math.max(contenu, spanPiece);

  // Hysteresis : on ne bouge que pour un vrai changement. En pratique le cadre est
  // fixe, puisque le contenu ne peut pas deborder des murs — mais le seuil protege
  // le jour ou la grille s'agrandirait au-dela.
  if (Math.abs(vise - camSpan) / camSpan > .04) camSpan = vise;
  camTarget.set(ROOM.cx, 0, ROOM.cz);
  resize();
}

/* ---------- Personnages ---------- */
// Garde-robe. Sans variété de coupe, de teint et de pantalon, douze cubes de la même
// silhouette donnent une impression d'uniforme — d'où les styles ci-dessous.
const SKINS = [0xf3d2b3, 0xe8bd96, 0xd1a070, 0xb07a4c, 0x8a5a36, 0x5f3d26];
const HAIRS = [0x2a1d16, 0x15110e, 0x7a4a24, 0xd9b26f, 0x8a3b24, 0x9b9389, 0x4a3b55];
const CUTS = ['court', 'chignon', 'long', 'chauve', 'bonnet', 'casquette'];
const SHIRTS = [0x5c7f9e, 0x74925f, 0x9a7194, 0xc99a55, 0xb86b50, 0x4f948c,
  0x7c6ba0, 0xa8584f, 0x3f7a86, 0xb3985c];
const LEAD_SHIRTS = [0xe8743b, 0xd9632e, 0xef8b4c, 0xc2561f];
const PANTS = [0x3b4254, 0x4a3f36, 0x334039, 0x5a4a52, 0x2f3a4a, 0x6b5744, 0x7a6a58];
const TOPS = ['simple', 'capuche', 'veste', 'simple', 'col'];

const hash = (s) => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7) >>> 0;
const shade = (hex, k) =>
  new THREE.Color(hex).lerp(new THREE.Color(k < 0 ? 0x000000 : 0xffffff), Math.abs(k)).getHex();

// Un décalage de bits ne suffit pas : les noms d'agents partagent leurs préfixes,
// les bits de poids fort bougent à peine et tout le monde finit habillé pareil.
// Chaque champ tire donc dans un flux mélangé indépendamment.
function mix(h, k) {
  let x = (h ^ Math.imul(k + 1, 0x9e3779b1)) >>> 0;
  x = Math.imul(x ^ (x >>> 16), 0x85ebca6b) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35) >>> 0;
  return (x ^ (x >>> 16)) >>> 0;
}

// La graine mêle le nom ET l'identifiant d'instance : deux Explore simultanés ne sont
// pas jumeaux. L'allure est donc stable pour la vie d'un agent — rappel au café
// compris — mais pas d'une session à l'autre.
function lookFor(h, isLead) {
  const p = (arr, k) => arr[mix(h, k) % arr.length];
  return {
    skin: p(SKINS, 1), hair: p(HAIRS, 2), cut: p(CUTS, 3),
    shirt: isLead ? LEAD_SHIRTS[mix(h, 4) % LEAD_SHIRTS.length] : p(SHIRTS, 4),
    pants: p(PANTS, 5), top: p(TOPS, 6),
    shortSleeves: mix(h, 7) % 2 === 0,
    glasses: mix(h, 8) % 4 === 0,
    height: .92 + (mix(h, 9) % 7) * .027,
    build: .92 + (mix(h, 10) % 5) * .045,
  };
}

// L'avant du modele est -Z : c'est vers -Z que les bras tapent (voir la pose
// 'type'), et le clavier s'y trouve. Tout trait de visage va donc en z negatif,
// la nuque en z positif. Se tromper de cote fait marcher les gens a reculons.
function makeChar(look) {
  const skinMat = new THREE.MeshStandardMaterial({ color: look.skin, roughness: .75 });
  const hairMat = new THREE.MeshStandardMaterial({ color: look.hair, roughness: .9 });
  const g = new THREE.Group(); g.scale.setScalar(look.height);
  const torso = new THREE.Group(); torso.position.y = .65; g.add(torso);

  const body = box(.55 * look.build, .6, .35, look.shirt); body.position.y = .3; torso.add(body);
  if (look.top === 'capuche') {
    const hood = box(.48 * look.build, .24, .28, shade(look.shirt, -.2));
    hood.position.set(0, .6, .11); torso.add(hood);
  } else if (look.top === 'veste') {
    const lapel = box(.58 * look.build, .5, .38, shade(look.shirt, -.28));
    lapel.position.y = .3; lapel.scale.z = .99; torso.add(lapel);
    const shirtFront = box(.2, .5, .4, 0xf0e6d8); shirtFront.position.y = .3; torso.add(shirtFront);
  } else if (look.top === 'col') {
    const collar = box(.58 * look.build, .1, .38, shade(look.shirt, .3));
    collar.position.y = .56; torso.add(collar);
  }

  // Tête agrandie d'un tiers. C'est le réglage qui fait le plus pour sortir du
  // registre « avatar » : à 1,7 de haut pour une tête de 0,44, on était au quart,
  // les proportions d'un adulte réaliste — exactement ce qui donne l'air Roblox.
  // À un tiers environ, on bascule vers le personnage dessiné. Tout le visage est
  // enfant du groupe, donc yeux, sourcils, bouche et lunettes suivent.
  //
  // Elle descend aussi un peu : le bas du crâne entre maintenant dans les épaules,
  // ce qui supprime le trou qu'on avait entre tête et torse.
  const head = new THREE.Group(); head.position.y = .80; head.scale.setScalar(1.3);
  torso.add(head);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(.22, 20, 16), skinMat);
  skull.castShadow = true; head.add(skull);

  if (look.cut !== 'chauve') {
    const cap = new THREE.Mesh(
      new THREE.SphereGeometry(.235, 20, 16, 0, Math.PI * 2, 0, Math.PI / 2),
      look.cut === 'bonnet' ? new THREE.MeshStandardMaterial({ color: shade(look.shirt, -.1), roughness: .95 })
      : look.cut === 'casquette' ? new THREE.MeshStandardMaterial({ color: shade(look.shirt, -.35), roughness: .9 })
      : hairMat);
    cap.position.set(0, .02, .03); cap.rotation.x = .25; head.add(cap);
    if (look.cut === 'casquette') {
      const visor = box(.3, .04, .22, shade(look.shirt, -.4)); visor.position.set(0, .07, -.24); head.add(visor);
    }
    if (look.cut === 'chignon') {
      const bun = new THREE.Mesh(new THREE.SphereGeometry(.12, 12, 10), hairMat);
      bun.position.set(0, .14, .21); head.add(bun);
    }
    if (look.cut === 'long') {
      const fall = box(.42, .34, .2, look.hair); fall.position.set(0, -.08, .1); fall.name = 'nuque'; head.add(fall);
    }
  }
  // Visage. Chaque element est pose JUSTE au-dela de la surface du crane (rayon .22) :
  // un millimetre trop en arriere et il disparait dans la sphere. Les z ci-dessous sont
  // calcules pour un rayon de .225 a la position (x, y) de l'element.
  const eyes = [], pupils = [], brows = [];
  for (const sx of [-1, 1]) {
    const eye = box(.052, .058, .018, 0xf2ece1, { roughness: .4 });
    eye.position.set(sx * .075, .025, -.211); head.add(eye); eyes.push(eye);
    const pup = box(.026, .032, .012, 0x2b2420);
    pup.position.set(0, 0, -.009); eye.add(pup); pupils.push(pup);
    const brow = box(.074, .016, .02, shade(look.hair, -.15));
    brow.position.set(sx * .075, .098, -.188); head.add(brow); brows.push(brow);
  }
  // Bouche en trois morceaux : les deux coins montent ou descendent, et c'est tout ce
  // qu'il faut pour un sourire. Un seul bloc ne pourrait que s'ouvrir.
  const mouth = new THREE.Group(); mouth.position.set(0, -.085, -.208); head.add(mouth);
  const corners = [];
  mouth.add(box(.05, .016, .018, 0x7e4a45));
  for (const sx of [-1, 1]) {
    const k = box(.02, .016, .018, 0x7e4a45);
    k.position.x = sx * .033; mouth.add(k); corners.push(k);
  }

  if (look.glasses) {
    const bridge = box(.3, .03, .03, 0x2b2b2b); bridge.position.set(0, .02, -.222); bridge.name = 'visage'; head.add(bridge);
    for (const lx of [-.1, .1]) {
      const lens = box(.13, .11, .02, 0x8fb7cc, { transparent: true, opacity: .45 });
      lens.position.set(lx, .02, -.232); head.add(lens);
    }
  }

  // Membres en CAPSULES, pas en boîtes. Deux parallélépipèdes empilés, c'est ce qui
  // donne la silhouette « assemblée en briques » : la couture à l'articulation se
  // voit, et les arêtes vives trahissent le pavé. Les bouts arrondis d'une capsule
  // se recouvrent, l'articulation disparaît, et le membre cesse d'être un meuble.
  // Une capsule mesure `longueur + 2 × rayon` au total : les longueurs ci-dessous
  // sont donc amputées du diamètre pour conserver les tailles d'avant.
  // Finesse volontairement basse : 2 anneaux de calotte et 8 cotes. A la taille ou
  // un personnage apparait en vue isometrique, on ne distingue pas 8 cotes de 16,
  // mais la piece peut contenir quatre-vingts personnes — six capsules chacune.
  const capsule = (r, h, col) => new THREE.Mesh(
    new THREE.CapsuleGeometry(r, h, 2, 8), new THREE.MeshStandardMaterial({ color: col, roughness: .8 }));
  const mkArm = (x) => {
    const p = new THREE.Group(); p.position.set(x * look.build, .55, 0);
    const upper = capsule(.07, .12, look.shirt);
    upper.position.y = -.13; upper.castShadow = true; p.add(upper);
    const lower = capsule(.065, .11, look.shortSleeves ? look.skin : look.shirt);
    lower.position.y = -.37; lower.castShadow = true; p.add(lower);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(.08, 10, 8), skinMat);
    hand.position.y = -.5; p.add(hand);
    torso.add(p); return p;
  };
  const mkLeg = (x) => {
    const p = new THREE.Group(); p.position.set(x, .65, 0);
    const l = capsule(.095, .36, look.pants); l.position.y = -.28; l.castShadow = true; p.add(l);
    // La chaussure deborde vers l'AVANT, donc vers -Z. Posee en +Z, la pointe partait
    // dans le dos et tout le monde marchait avec les pieds a l'envers.
    const shoe = box(.19, .09, .27, 0x2e2622); shoe.position.set(0, -.58, -.04); p.add(shoe);
    g.add(p); return p;
  };
  const armL = mkArm(-.36), armR = mkArm(.36);
  // Tasse dans la main droite, montrée seulement pendant la pause café.
  const mug = new THREE.Mesh(new THREE.CylinderGeometry(.075, .062, .13, 10),
    new THREE.MeshStandardMaterial({ color: 0xf2e8da, roughness: .6 }));
  mug.position.set(0, -.62, -.07); mug.visible = false; mug.castShadow = true; armR.add(mug);
  // Manette, tenue a deux mains devant le torse : montree seulement sur le canape.
  const pad = box(.3, .08, .15, 0x2e2622);
  pad.position.set(0, .34, -.3); pad.visible = false; torso.add(pad);
  return { g, torso, head, armL, armR, mug, pad, eyes, pupils, brows, mouth, corners,
    legL: mkLeg(-.13), legR: mkLeg(.13) };
}

// Une humeur par activite. `brow` ouvre ou fronce les sourcils, `lift` souleve tout le
// haut du visage, `smile` releve les coins de la bouche (negatif : il les baisse),
// `open` l'ouvre, `narrow` plisse les yeux. Rien ici n'est une information : c'est le
// ton de ce que l'animation du corps dit deja.
const MOODS = {
  type:   { brow: -.20, lift: -.010, smile: .00, open: .00, narrow: .14 },
  term:   { brow: -.20, lift: -.010, smile: .00, open: .00, narrow: .14 },
  read:   { brow: -.06, lift: .000, smile: .12, open: .00, narrow: .26 },
  web:    { brow: -.06, lift: .000, smile: .12, open: .00, narrow: .26 },
  think:  { brow: .24, lift: .012, smile: .05, open: .18, narrow: .00 },
  plan:   { brow: .06, lift: .004, smile: .28, open: .00, narrow: .10 },
  wait:   { brow: .38, lift: .018, smile: -.35, open: .45, narrow: .00 },
  coffee: { brow: .02, lift: .000, smile: .50, open: .00, narrow: .22 },
  game:   { brow: .16, lift: .008, smile: .62, open: .22, narrow: .00 },
  idle:   { brow: .00, lift: .000, smile: .30, open: .00, narrow: .10 },
  walk:   { brow: .00, lift: .000, smile: .16, open: .00, narrow: .06 },
  fall:   { brow: .40, lift: .020, smile: -.30, open: .55, narrow: .00 },
};

// Bousculade : un agent qui marche renverse celui qu'il percute. Rayon de contact a
// peu pres la largeur d'epaules ; durees de la chute, du temps au sol, du relevement.
const BUMP_R = .42, FALL_SLIDE = .35, FALL_TIP = .45, FALL_LIE = 1.8, FALL_UP = .8;

// Juste devant la porte, qui est elle-meme posee sur le mur de gauche. A ancrer au
// mur : fixe, ce point se retrouvait au milieu du parquet des que la piece
// s'agrandissait — et meme a l'interieur d'un ilot, d'ou des arrivees qui
// traversaient les cloisons de verre.
const DOOR = new V3(wallL(.7), 0, wallF(4));
const labelsEl = document.getElementById('labels');
const agents = new Set();
const tmp = new V3();

// Les trois etats que porte la pastille de la bulle. `walk` compte comme du travail :
// un agent qui rejoint son bureau est deja sur le dossier, et le faire clignoter en
// « repos » pendant sa traversee ne dirait rien de vrai.
const WORK_ACTS = new Set(['read', 'type', 'term', 'web', 'plan', 'think', 'walk']);

// Les pauses subies. Un libellé par motif : « en pause » tout court laisserait
// croire à une pause choisie, alors que c'est la machine ou le quota qui décide.
const PAUSE_LABEL = {
  absent: '☕ poste injoignable',
  bloc: '☕ bloc de 5 h épuisé',
};
const PAUSE_WALK = {
  absent: '🚶 le poste ne répond plus',
  bloc: '🚶 fin du bloc de 5 h',
};
const STATUS_ICON = { work: '💼', ask: '❓', rest: '☕' };
const STATUS_LABEL = { work: 'au travail', ask: 'attend ta réponse', rest: 'au repos' };

class Agent {
  constructor(id, { name, kind, task, pod, seated, variant = 0 }) {
    this.id = id; this.name = name; this.kind = kind; this.task = task;
    // Un employé repris de la mémoire du serveur n'a ni îlot ni bureau : il est dans
    // la maison sans être sur un dossier. `pod` reste donc facultatif.
    this.pod = pod ?? null;
    this.desk = pod ? pod.claimDesk() : null;
    // Graine sur le NOM, pas sur l'instance : un agent que tu nommes (« architecte »)
    // garde la même silhouette de session en session, on finit par le reconnaître.
    // La variante ne sert qu'à distinguer deux homonymes présents en même temps.
    this.c = makeChar(lookFor(mix(hash(name), variant), kind === 'main'));
    scene.add(this.c.g);
    // Le lead tient le poste tant que la session vit : il est déjà assis, et ne
    // franchira jamais la porte. Seuls les sous-agents entrent et sortent.
    // Le lead tient le poste : déjà assis, il ne franchira jamais la porte. Un agent
    // reconstitué au rechargement (seated) est lui aussi posé directement — il était
    // déjà là avant qu'on ouvre la page, le faire entrer serait un mensonge.
    if (kind === 'main' || (seated && this.desk)) {
      this.c.g.position.copy(this.desk.seat); this.state = 'work'; this.path = [];
    } else if (this.desk) {
      this.c.g.position.copy(DOOR); this.state = 'walkin'; this.path = this.toDesk();
    } else {
      this.state = 'idle'; this.path = []; // place par hire(), juste apres
    }
    this.el = document.createElement('div'); this.el.className = 'label';
    this.c.g.userData.agent = this; // cible de selection au clic
    this.el.style.borderLeft = '3px solid ' +
      (pod ? '#' + pod.tint.toString(16).padStart(6, '0') : 'rgba(185,168,148,.45)');
    const b = document.createElement('b'); b.textContent = (kind === 'main' ? '🧠 ' : '🤖 ') + name;
    this.t = document.createElement('span'); this.t.className = 't';
    this.stEl = document.createElement('i'); this.stEl.className = 'st';
    this.sayEl = document.createElement('span'); this.sayEl.className = 'say'; this.sayEl.hidden = true;
    this.el.append(this.stEl, b, this.t, this.sayEl); labelsEl.appendChild(this.el);
    this.set(kind === 'main' ? 'idle' : 'walk', kind === 'main' ? '☕ prêt' : '🚶 arrive…');
    agents.add(this); pod?.members.add(this);
    this.gen = 0; // jeton d'affectation : invalide les minuteries d'une mission passee
    // L'allure, dérivée du nom comme la silhouette. Sans elle, cinq personnes qui
    // traversent la pièce lèvent la jambe exactement en même temps — c'est le signal
    // « clones » le plus fort qui soit, et c'est l'erreur que les clignements
    // évitaient déjà : synchronisés, ils font l'effet inverse de ce qu'on cherche.
    this.pas = (hash(id + 'pas') % 628) / 100;        // déphasage
    this.allure = .88 + (hash(id + 'all') % 25) / 100; // cadence
    this.balance = .85 + (hash(id + 'bal') % 30) / 100; // amplitude du balancement
  }
  // Trajet vers `goal`, cherche en A* sur la grille (voir findPath()). Les cloisons,
  // bureaux et meubles sont des obstacles : plus besoin de couloirs imposes, chacun
  // prend le chemin le plus court qui ne traverse ni le verre ni un plateau.
  // `via` : derniere approche faite a la main, la ou la grille est trop grossiere —
  // on gagne le canape par la voie de devant, puis on s'y assoit en reculant.
  // On repart par ou l'on est arrive : quitter le canape, c'est d'abord se relever
  // vers cette voie, pas l'enjamber par le dossier.
  routeTo(goal, via = null) {
    const here = this.c.g.position, b = this.berth, head = [];
    let from = here;
    if (b && Math.hypot(here.x - b.pos.x, here.z - b.pos.z) < .05) { head.push(b.via.clone()); from = b.via; }
    const path = [...head, ...findPath(from, via ?? goal)];
    if (via) path.push(goal.clone());
    this.berth = via ? { pos: goal.clone(), via: via.clone() } : null;
    return path;
  }
  toDesk() { return this.routeTo(this.desk.seat); }
  // Pas de trajet vers la sortie : depuis que la maison garde ses gens, personne ne
  // repart. La porte ne sert plus qu'aux arrivées.
  toSpot(spot) {
    return this.routeTo(spot.pos, spot.kind === 'couch' ? new V3(spot.pos.x, 0, COUCH_LANE_Z) : null);
  }
  set(act, text) {
    // Au sol, on ne change pas d'etiquette : ce qu'on lui demande (une mission, une
    // pause) est mis de cote et s'affichera quand il sera releve.
    if (this.fall && act !== 'fall') { this.fall.act = act; this.fall.text = text; return; }
    this.act = act; this.t.textContent = text; this.el.dataset.act = act;
    this.refreshStatus();
  }
  // Trois etats, et trois seulement : il travaille, il attend une reponse de toi, il
  // se repose. C'est tout ce qu'on cherche a voir d'un poste qui n'est pas le sien —
  // et le seul niveau de detail qui reste lisible a vingt ilots. Un agent a terre
  // n'est ni l'un ni l'autre : il compte comme au repos, ce qu'il est.
  refreshStatus() {
    const st = (this.session?.alert && this.kind === 'main') ? 'ask'
      : WORK_ACTS.has(this.act) ? 'work' : 'rest';
    if (st === this.st) return;
    this.st = st;
    this.el.dataset.st = st;
    this.stEl.textContent = STATUS_ICON[st];
    this.stEl.title = STATUS_LABEL[st];
  }
  // Seuls ceux qui tiennent debout tombent : on ne renverse pas quelqu'un assis a son
  // bureau ou cale dans le canape. Un agent tout juste releve a quelques secondes de
  // repit, sinon celui qui le suit le refait tomber aussitot.
  canFall(t) {
    if (this.fall || t < (this.immuneUntil ?? 0)) return false;
    if (this.state === 'work' && !this.path.length) return false;
    if (this.state === 'leisure' && this.spot?.kind === 'couch') return false;
    return true;
  }
  // Appele en marchant, avec le pas qu'on vient de faire : quiconque est devant soi,
  // a portee d'epaule, passe par terre.
  bump(hx, hz, t) {
    const p = this.c.g.position, hl = Math.hypot(hx, hz);
    if (hl < 1e-6) return;
    for (const o of agents) {
      if (o === this || !o.canFall(t)) continue;
      const q = o.c.g.position, dx = q.x - p.x, dz = q.z - p.z, dist = Math.hypot(dx, dz);
      // Pile au meme point (deux arrivants poses ensemble sur la porte) : aucun sens
      // de poussee, on ne renverse personne.
      if (dist < .1 || dist > BUMP_R) continue;
      if ((dx * hx + dz * hz) / (dist * hl) < .5) continue; // il faut l'avoir devant soi
      o.knockDown(this, dx / dist, dz / dist, t);
    }
  }
  // Renverse par `by`, pousse dans la direction (ux, uz). Il se tourne vers celui qui
  // le percute et part a la renverse : le dos vers le sol, les pieds vers le fautif.
  // `by` peut manquer (chute declenchee depuis le menu Actions) ; `land` impose le
  // point de chute quand la glissade par defaut n'a pas de sens (depuis le canape).
  knockDown(by, ux, uz, t, land = null) {
    const from = this.c.g.position.clone(), to = land ? land.clone() : from.clone();
    if (!land) {
      to.x += ux * FALL_SLIDE; to.z += uz * FALL_SLIDE;
      if (navGrid && !navClear(from, to)) to.copy(from); // pas de glissade dans un meuble
    }
    const act = this.act, text = this.t.textContent; // a remettre une fois releve
    // Une tasse a la main ? Elle part en l'air, et le cafe finit par terre.
    const cup = this.c.mug.visible && !this.cupless;
    const why = by ? 'renversé par ' + by.name : 'patatras !';
    this.set('fall', cup ? '💥☕ ' + why + ', café par terre' : '💥 ' + why);
    this.fall = { t0: t, from, to, yaw: Math.atan2(ux, uz), act, text };
    if (cup) { this.cupless = true; spillCup(from, ux, uz); }
    thud();
  }
  // Chute sans fautif (menu Actions). On tombe dans une direction ou l'on a la place
  // de s'allonger ; du canape, on glisse de l'assise vers la voie de devant et l'on
  // s'etale le long de celle-ci, plutot que sur la table basse.
  topple(t) {
    if (this.fall) return;
    if (!navGrid) navGrid = buildNav();
    const p = this.c.g.position;
    if (this.state === 'leisure' && this.spot?.kind === 'couch') {
      const sx = Math.sign(this.spot.pos.x - LOUNGE_X) || (Math.random() < .5 ? -1 : 1);
      this.knockDown(null, sx, 0, t, new V3(p.x + sx * FALL_SLIDE, 0, COUCH_LANE_Z));
      return;
    }
    for (let k = 0; k < 16; k++) {
      const a = Math.random() * Math.PI * 2, ux = Math.sin(a), uz = Math.cos(a);
      if (navClear(p, new V3(p.x + ux * 1.6, 0, p.z + uz * 1.6))) { this.knockDown(null, ux, uz, t); return; }
    }
    this.knockDown(null, 0, 1, t, p); // coince de partout : il s'effondre sur place
  }
  // Chute, temps au sol, relevement. On pivote tout le personnage autour de ses pieds
  // (origine du groupe) : en ordre YXZ, rotation.x bascule dans le repere du corps,
  // apres le cap.
  updateFall(t) {
    const c = this.c, g = c.g, f = this.fall, e = t - f.t0;
    g.rotation.order = 'YXZ'; g.rotation.y = f.yaw;
    c.head.rotation.set(0, 0, 0); c.torso.position.y = .65; c.torso.rotation.x = 0;
    c.mug.visible = false;
    if (e < FALL_TIP) {
      const p = e / FALL_TIP;
      g.position.lerpVectors(f.from, f.to, Math.min(1, p * 1.4));
      g.rotation.x = p * p * Math.PI / 2; // ca accelere, comme toute chute
      c.armL.rotation.x = c.armR.rotation.x = 2.6 + .4 * Math.sin(e * 30); // les bras battent
      c.legL.rotation.x = .5 * p; c.legR.rotation.x = .2 * p;
    } else if (e < FALL_TIP + FALL_LIE) {
      const l = e - FALL_TIP;
      g.position.copy(f.to);
      g.position.y = .16;                                    // le dos sur le parquet, pas dedans
      g.rotation.x = Math.PI / 2 - .14 * Math.abs(Math.sin(l * 9)) * Math.exp(-l * 4); // rebond
      c.armL.rotation.x = c.armR.rotation.x = 0;
      c.armL.rotation.z = -1.2; c.armR.rotation.z = 1.2;     // bras en croix
      c.legL.rotation.x = .35; c.legR.rotation.x = .1;
      c.head.rotation.y = .35 * Math.sin(l * 4);             // sonne, il secoue la tete
    } else if (e < FALL_TIP + FALL_LIE + FALL_UP) {
      const p = (e - FALL_TIP - FALL_LIE) / FALL_UP, k = 1 - ease(p);
      g.position.copy(f.to); g.position.y = .16 * k;
      g.rotation.x = k * Math.PI / 2;
      c.armL.rotation.z = -1.2 * k; c.armR.rotation.z = 1.2 * k;
      c.armL.rotation.x = c.armR.rotation.x = .9 * (1 - k); // il s'appuie pour se relever
      c.legL.rotation.x = c.legR.rotation.x = .35 * k;
    } else {
      g.position.copy(f.to); g.position.y = 0; g.rotation.x = 0;
      c.armL.rotation.z = c.armR.rotation.z = 0;
      c.legL.rotation.x = c.legR.rotation.x = 0;
      this.fall = null;
      this.immuneUntil = t + 4;
      this.set(f.act, f.text);
      // Il revient a l'endroit d'ou on l'a pousse, puis reprend ce qu'il faisait.
      if (Math.hypot(f.from.x - f.to.x, f.from.z - f.to.z) > .01) this.path.unshift(f.from.clone());
    }
  }
  // Dernier mot de l'agent (last_assistant_message), affiché quelques secondes.
  say(msg) {
    const txt = trunc(String(msg ?? '').replace(/[#*`>_]/g, ''), 150);
    if (!txt) return;
    this.sayEl.textContent = '« ' + txt + ' »';
    this.sayEl.hidden = false;
    clearTimeout(this.sayTimer);
    this.sayTimer = setTimeout(() => { this.sayEl.hidden = true; }, 12000);
  }

  // « va boire un café » : le lead quitte son poste pour le mange-debout. Réservé au
  // lead — un employé au repos passe par goIdle(), qui lui ouvre aussi le canapé.
  // Le lead garde son bureau et y reviendra : il tient le poste, pause ou pas.
  toCoffee() {
    if (this.kind !== 'main') return;
    if (this.state === 'tocoffee' || this.state === 'coffee') return;
    const spot = claimSpot();
    if (!spot) return; // bar plein : le lead reste simplement à son poste
    this.spot = spot;
    this.state = 'tocoffee';
    this.path = this.toSpot(spot);
    this.set('walk', '🚶 va au café');
  }
  // Le lead rentre du café. Son bureau n'a jamais été rendu : il s'y rassoit.
  // Un sous-agent, lui, n'a pas de poste à retrouver — il repart par la porte.
  backToDesk() {
    if (this.kind !== 'main') return;
    if (this.state !== 'coffee' && this.state !== 'tocoffee') return;
    this.freeSpot();
    this.state = 'walkin';
    this.path = this.toDesk();
    this.set('walk', '🚶 revient du café');
  }
  // Pause SUBIE, par opposition a la pause café qu'on demande : le poste ne répond
  // plus, ou le bloc de 5 h est épuisé. Contrairement à goIdle(), l'employé GARDE
  // son bureau et son îlot — il ne quitte pas le dossier, il attend. Sans ça, le
  // retour du poste devrait reconstruire des affectations que plus personne ne
  // réannonce : le serveur ne réémet que ce qui a changé.
  toPause(motif) {
    if (this.paused) return;
    this.paused = motif;
    // Le bar d'abord : une pause subie se prend debout au café, pas vautré.
    const avant = this.spot?.kind;
    this.freeSpot();
    const spot = claimSpot() ?? claimLeisure(avant);
    if (!spot) { // tout est plein : on reste sur place, mais au repos
      this.state = 'idle'; this.path = [];
      this.set('coffee', PAUSE_LABEL[motif] || '☕ en pause');
      return;
    }
    this.spot = spot;
    this.state = spot.kind === 'coffee' ? 'tocoffee' : 'toleisure';
    this.path = this.toSpot(spot);
    this.set('walk', PAUSE_WALK[motif] || '🚶 va en pause');
  }
  // Fin de journée : on sort par la porte. L'employé n'est pas congédié — il garde
  // son bureau et son dossier, il rentre. La porte n'avait plus servi dans ce sens
  // depuis que la maison garde ses gens : elle ne servait plus qu'aux arrivées.
  goHome() {
    if (this.home) return;
    this.home = true;
    this.paused = null;
    this.freeSpot();
    this.state = 'gohome';
    this.path = this.routeTo(DOOR);
    this.set('walk', '🚶 rentre');
  }
  // Retour : on réapparaît à la porte, et on regagne son bureau.
  comeBack() {
    if (!this.home) return;
    this.home = false;
    this.c.g.visible = true;
    this.el.hidden = false;
    this.c.g.position.copy(DOOR);
    if (!this.desk || !this.pod) { this.goIdle(); return; }
    this.state = 'walkin';
    this.path = this.toDesk();
    this.set('walk', '🚶 revient');
  }
  // Fin de la pause subie : on retourne au bureau qu'on n'a jamais rendu.
  resumeFromPause() {
    if (!this.paused) return;
    this.paused = null;
    this.freeSpot();
    // Un employé dont l'îlot a été démonté entre-temps n'a plus de poste : il
    // rejoint l'open space comme après une mission.
    if (!this.desk || !this.pod) { this.goIdle(); return; }
    this.state = 'walkin';
    this.path = this.toDesk();
    this.set('walk', '🚶 reprend le travail');
  }
  // Affecte a un dossier : l'employe rejoint l'ilot qui l'appelle. C'est la seule
  // facon de changer d'ilot — un employe appartient a la maison, pas a une session.
  // `instant` sert au rejeu d'une page rechargee : l'employe travaillait deja quand
  // on a ouvert la page, le faire traverser la piece depuis le canape serait un
  // mensonge — on l'assoit directement.
  assignTo(session, task, instant) {
    this.gen++;
    this.freeSpot();
    this.session = session;
    this.pod = session.pod;
    this.pod.members.add(this);
    this.el.style.borderLeft = '3px solid #' + this.pod.tint.toString(16).padStart(6, '0');
    this.task = task;
    this.desk = this.pod.claimDesk();
    if (instant) {
      this.c.g.position.copy(this.desk.seat); this.state = 'work'; this.path = [];
      this.set('think', task ? '💭 ' + trunc(task, 34) : '💭 au travail');
      return;
    }
    this.state = 'walkin';
    this.path = this.toDesk();
    this.set('walk', '🚶 rejoint ' + session.project);
  }
  // Fin de mission : l'employe rend son bureau et quitte l'ilot, mais pas la maison.
  // Il va s'occuper ailleurs — café ou canapé — et reste disponible pour la suite.
  goIdle() {
    this.gen++;
    const spot = claimLeisure(this.spot?.kind);
    // Trajet calcule avant de lacher l'ilot : il part de la position reelle.
    const path = spot ? this.toSpot(spot) : null;
    this.freeDesk();
    this.freeSpot();
    if (this.pod) { const p = this.pod; p.members.delete(this); this.pod = null; p.maybeClose(); }
    this.session = null;
    this.task = null;
    this.el.style.borderLeft = '3px solid rgba(185,168,148,.45)'; // plus de couleur de projet
    if (!spot) { this.state = 'idle'; this.path = []; this.set('idle', '🧍 traîne dans l\'open space'); return; }
    this.spot = spot;
    this.state = 'toleisure';
    this.path = path;
    this.set('walk', spot.kind === 'couch' ? '🚶 va au canapé' : '🚶 va au café');
  }
  freeSpot() { if (this.spot) { this.spot.busy = false; this.spot = null; } }
  freeDesk() {
    if (!this.desk) return;
    if ((this.desk.occupants || 1) <= 1) this.desk.setScreen(null);
    this.pod?.releaseDesk(this.desk); this.desk = null;
  }
  dispose() {
    scene.remove(this.c.g); this.el.remove(); agents.delete(this);
    this.freeSpot(); this.freeDesk();
    const i = staff.indexOf(this); if (i >= 0) staff.splice(i, 1);
    const p = this.pod; this.pod = null;
    p?.members.delete(this);
    p?.maybeClose();
  }
  // Le visage, independamment de ce que fait le corps. Appele a chaque image : c'est
  // le clignement qui rend un personnage vivant, bien plus que sa pose.
  face(t) {
    const c = this.c, m = MOODS[this.act] ?? MOODS.idle;
    const ph = hash(this.id) % 97;
    // Clignement court et desynchronise : un cycle propre a chacun, sinon tout l'open
    // space cligne en choeur et l'effet se retourne contre nous.
    const cycle = 3.2 + (ph % 41) * .12;
    const blink = ((t + ph) % cycle) < .12;
    // Personne n'est fatigue au cafe ou sur le canape : c'est bien le propos.
    const tired = (this.state === 'leisure' || this.state === 'coffee') ? 0 : FATIGUE;
    const open = blink ? .08 : Math.max(.2, 1 - m.narrow - tired * .38);
    for (const e of c.eyes) { e.scale.y = open; e.position.y = .025 + m.lift * .4; }
    c.brows.forEach((b, i) => {
      const sx = i === 0 ? -1 : 1;           // l'extremite interne monte ou descend
      b.rotation.z = sx * m.brow * .55 - sx * tired * .20;
      b.position.y = .098 + m.lift + (m.brow > 0 ? .014 : -.007) - tired * .013;
    });
    const smile = m.smile - tired * .5;
    for (const k of c.corners) k.position.y = smile * .024;
    c.mouth.scale.y = 1 + m.open * 1.7;
    c.mouth.scale.x = 1 - m.open * .22 + Math.max(0, smile) * .14;
  }

  update(dt, t) {
    // Parti pour la soiree : plus de corps dans la piece, donc rien a animer. On
    // sort avant le visage, les chutes et le reste — un absent ne cligne pas des
    // yeux et ne se fait pas bousculer.
    if (this.state === 'away') return;
    const c = this.c, g = c.g, ph = hash(this.id) % 10;
    this.face(t);
    if (this.fall) { this.updateFall(t); return; }
    if (this.path.length) {
      const tgt = this.path[0], d = tgt.clone().sub(g.position), dist = d.length(), step = 3.2 * dt;
      if (dist <= step) { g.position.copy(tgt); this.path.shift(); }
      else { g.position.addScaledVector(d, step / dist); g.rotation.y = Math.atan2(-d.x, -d.z); }
      this.bump(d.x, d.z, t);
      // Cadence propre à chacun : déphasage, vitesse et amplitude tirés du nom.
      const cad = t * 12 * this.allure + this.pas;
      const sw = Math.sin(cad) * .6 * this.balance;
      c.legL.rotation.x = sw; c.legR.rotation.x = -sw;
      c.armL.rotation.x = -sw * .8; c.armR.rotation.x = sw * .8;
      c.torso.position.y = .65 + Math.abs(Math.sin(cad)) * .04;
      // Le buste penche vers l'avant et la tête suit le pas à contretemps. Une
      // marche sans inclinaison est une marche de pantin : c'est le corps qui part
      // devant et les jambes qui rattrapent, jamais l'inverse.
      c.torso.rotation.x = -.07;
      c.head.rotation.set(.05 - Math.sin(cad) * .025, Math.sin(cad * .5) * .07, 0);
      c.mug.visible = false; // la tasse reste au mange-debout : on ne marche pas avec
      if (!this.path.length) {
        if (this.state === 'walkin') {
          this.state = 'work';
          if (this.act === 'walk') this.set('think', this.task ? '💭 ' + trunc(this.task, 34) : '💭 prêt');
        } else if (this.state === 'tobrief') {
          this.state = 'briefing';
          this.briefUntil = t + 2.2;
          const s = this.briefAt;
          this.faceAngle = s && s.desk
            ? Math.atan2(g.position.x - s.desk.seat.x, g.position.z - s.desk.seat.z) : 0;
          this.set('think', '💬 brieffe ' + (s ? s.name : ''));
        } else if (this.state === 'gohome') {
          // Arrive a la porte : on s'efface. Le bureau reste reserve.
          this.state = 'away';
          c.g.visible = false;
          this.el.hidden = true;
        } else if (this.state === 'tocoffee') {
          this.state = 'coffee';
          this.cupless = false; // tasse neuve
          this.coffeeUntil = t + COFFEE_SEC;
          this.faceAngle = Math.atan2(-(COFFEE.x - g.position.x), -(COFFEE.z - g.position.z));
          this.set('coffee', this.paused ? PAUSE_LABEL[this.paused] : '☕ pause café');
        } else if (this.state === 'toleisure') {
          // Arrive a sa place de repos. On ne fixe pas de fin : l'employe changera
          // simplement d'occupation au bout d'un moment, ou repartira sur un dossier.
          this.state = 'leisure';
          this.cupless = false; // tasse neuve
          this.idleUntil = t + 45 + (hash(this.id) % 60);
          this.faceAngle = this.spot.face;
          this.set(...LEISURE_ACT[this.spot.kind]);
        }
      }
      return;
    }
    // Le briefing est fini : on retourne tenir le poste.
    if (this.state === 'briefing' && t >= this.briefUntil) {
      this.briefCool = t + 14; // on ne refait pas l'aller-retour pour chaque délégation
      this.briefAt = null;
      this.state = 'walkin';
      this.path = this.toDesk();
      this.set('walk', '🚶 retourne à son poste');
      return;
    }
    // Un agent vient d'être affecté : le lead va lui expliquer, puis reviendra.
    if (this.state === 'work' && this.briefTarget) {
      const sub = this.briefTarget;
      this.briefTarget = null;
      if (sub.pod === this.pod && sub.desk && t >= (this.briefCool ?? 0)) {
        // On se place du côté extérieur du bureau, pour ne pas s'asseoir dessus.
        const p = sub.desk.seat.clone();
        p.x += p.x > this.pod.slot.x ? 1.0 : -1.0;
        this.briefAt = sub;
        this.state = 'tobrief';
        this.path = this.routeTo(p);
        this.set('walk', '🚶 va briefer ' + sub.name);
        return;
      }
    }
    // Immobile : assis au poste, debout au mange-debout, ou vautré sur le canapé.
    // Assis : le canape et les chaises de la table. Debout : le mange-debout et
    // les places de discussion. Sans ca, on dejeunerait debout devant sa chaise.
    const assis = this.state === 'leisure'
      && (this.spot?.kind === 'couch' || this.spot?.kind === 'lunch');
    const onCouch = this.state === 'leisure' && this.spot?.kind === 'couch';
    const standing = this.state === 'coffee' || this.state === 'briefing'
      || (this.state === 'leisure' && !assis);
    const resting = standing || assis;
    // Le lead rentre tenir son poste quand sa pause s'achève ; un employé, lui, ne
    // rentre nulle part — il change juste d'occupation.
    // Une pause SUBIE ne s'achève pas toute seule : elle dure tant que le poste se
    // tait ou que le bloc est épuisé. Les deux minuteries ci-dessous ne valent que
    // pour les pauses choisies.
    if (this.state === 'coffee' && !this.paused && t >= this.coffeeUntil) { this.backToDesk(); return; }
    if (this.state === 'leisure' && !this.paused) {
      // Un employé repris de la mémoire du serveur arrive sans minuterie : on la lui
      // pose à sa première frame plutôt que de la calculer hors de la boucle.
      if (this.idleUntil == null) this.idleUntil = t + 45 + (hash(this.id) % 60);
      // À table, on reste jusqu'à la fin du service. Sans cette exception, le
      // changement d'occupation périodique leur faisait jouer aux chaises musicales :
      // la table passant en tête à midi, ils se levaient pour se rasseoir à côté,
      // toutes les minutes. À quatorze heures la règle tombe et ils repartent.
      const aTable = this.spot?.kind === 'lunch' && HEURE >= MIDI[0] && HEURE < MIDI[1];
      if (!aTable && t >= this.idleUntil) { this.goIdle(); return; }
    }
    g.rotation.y = resting ? this.faceAngle : 0;
    c.legL.rotation.x = c.legR.rotation.x = standing ? 0 : Math.PI / 2;
    c.torso.position.y = .65; c.torso.rotation.x = 0; c.head.rotation.set(0, 0, 0);
    // Apres une chute, plus de tasse jusqu'a la prochaine place au bar.
    c.mug.visible = (this.state === 'coffee' || this.spot?.kind === 'coffee') && !this.cupless;
    c.pad.visible = onCouch;
    const a = this.act;
    if (a === 'type' || a === 'term' || a === 'plan') {
      // Fatigue : la frappe ralentit. Au plus bas elle garde la moitie de sa cadence —
      // en dessous, on ne lirait plus que l'agent est en train de taper.
      const sp = (a === 'plan' ? 10 : 28) * (1 - .45 * FATIGUE);
      c.armL.rotation.x = 1.25 + .12 * Math.sin(t * sp + ph);
      c.armR.rotation.x = 1.25 + .12 * Math.sin(t * sp + ph + Math.PI);
      c.head.rotation.x = -.1;
    } else if (a === 'read' || a === 'web') {
      c.armL.rotation.x = .9; c.armR.rotation.x = 1.05 + .08 * Math.sin(t * 5 + ph);
      c.head.rotation.x = -.25; c.head.rotation.y = .15 * Math.sin(t * 1.3 + ph);
    } else if (a === 'think') {
      c.armL.rotation.x = .3; c.armR.rotation.x = 2.2; c.armR.rotation.z = -.2;
      c.head.rotation.z = .15 * Math.sin(t * 1.5 + ph);
      c.torso.position.y = .65 + .02 * Math.sin(t * 2 + ph);
    } else if (a === 'wait') {
      c.armL.rotation.x = .3; c.armR.rotation.x = 2.9 + .2 * Math.sin(t * 8);
      c.torso.position.y = .65 + Math.abs(Math.sin(t * 6)) * .06;
    } else if (a === 'coffee') { // debout, tasse en main, regard qui flâne
      c.armL.rotation.x = .22;
      c.armR.rotation.x = 1.45 + .07 * Math.sin(t * 1.5 + ph);
      c.head.rotation.y = .28 * Math.sin(t * .7 + ph);
      c.torso.position.y = .65 + .018 * Math.sin(t * 1.3 + ph);
    } else if (a === 'game') {
      // Manette : les bras en avant, les pouces qui s'agitent, le dos qui s'affaisse.
      c.armL.rotation.x = 1.12 + .06 * Math.sin(t * 9 + ph);
      c.armR.rotation.x = 1.12 + .06 * Math.sin(t * 11 + ph);
      c.head.rotation.x = -.06; c.torso.position.y = .62;
    } else { // idle
      c.armL.rotation.x = c.armR.rotation.x = .2; c.head.rotation.x = .15;
    }
    if (a !== 'think') c.armR.rotation.z = 0;
    // Le dos s'affaisse et la tete penche, en plus de la pose de l'outil et jamais a sa
    // place : l'animation de l'outil est l'information, la fatigue n'est qu'un ton.
    // Au repos, personne n'est fatigue — on est au cafe, c'est bien le propos.
    if (FATIGUE > .02 && this.state !== 'leisure' && this.state !== 'coffee') {
      c.torso.position.y -= .06 * FATIGUE;
      c.head.rotation.x += .22 * FATIGUE;
    }
    this.desk?.setScreen(a, t);
  }
  // Position a l'ecran, sans toucher au DOM : la mise en page est faite en une passe
  // par layoutLabels(), qui a besoin de les connaitre toutes avant d'en placer une.
  projectLabel() {
    tmp.copy(this.c.g.position); tmp.y += 2.3; tmp.project(cam);
    this.lx = (tmp.x * .5 + .5) * innerWidth;
    this.ly = (-tmp.y * .5 + .5) * innerHeight;
  }
}

// Deux agents cote a cote — deux employes sur le canape, par exemple — donnaient deux
// etiquettes superposees, dont une illisible. On les empile : les plus hautes d'abord,
// et chacune redescend tant qu'elle en recouvre une deja posee dans sa colonne.
//
// Lectures et ecritures du DOM sont separees en deux boucles : les melanger forcerait
// un recalcul de mise en page du navigateur a chaque etiquette, a chaque frame.
const LABEL_GAP = 4;
// Glissement maximal d'une étiquette désempilée, en pixels. Environ deux hauteurs
// d'étiquette : au-delà, on ne sait plus à qui elle appartient.
const LABEL_MAX_DROP = 90;
function layoutLabels() {
  const list = [];
  for (const a of agents) { a.projectLabel(); list.push(a); }
  // En mode pastille, on ne désempile pas. Le désempilement existe pour des étiquettes
  // de texte, qui deviennent illisibles en se recouvrant ; une pastille, elle, reste
  // lisible sous une autre, alors qu'une pastille descendue de deux cents pixels sous
  // son personnage ne désigne plus personne. À pleine charge, la cascade partait même
  // hors de l'écran. Accessoirement, on évite quarante lectures de `offsetWidth` par
  // image, qui forcent chacune un recalcul de mise en page.
  if (labelDensity === 'pastille') {
    for (const a of list) { a.el.style.left = a.lx + 'px'; a.el.style.top = a.ly + 'px'; }
    return;
  }
  for (const a of list) { a.lw = a.el.offsetWidth || 120; a.lh = a.el.offsetHeight || 34; }
  list.sort((p, q) => p.ly - q.ly);
  const placed = [];
  for (const a of list) {
    const x0 = a.lx - a.lw / 2, x1 = a.lx + a.lw / 2;
    let y = a.ly;
    // Quelques passes suffisent ; la borne evite toute boucle folle si ca se croise.
    for (let pass = 0; pass < list.length + 1; pass++) {
      let moved = false;
      for (const p of placed) {
        if (x1 <= p.x0 || p.x1 <= x0) continue;        // colonnes disjointes
        if (y - a.lh >= p.y || y <= p.y - p.h) continue; // deja separees
        y = p.y + a.lh + LABEL_GAP; moved = true;
      }
      if (!moved) break;
    }
    // Le désempilement a une limite. Au-delà, l'étiquette a tellement glissé qu'elle
    // ne désigne plus personne — à pleine charge la cascade descendait sous le
    // plancher, en colonne. Mieux vaut deux étiquettes qui se recouvrent, chacune sur
    // la bonne tête, qu'une colonne lisible qui ne dit plus de qui elle parle.
    if (y - a.ly > LABEL_MAX_DROP) y = a.ly;
    placed.push({ x0, x1, y, h: a.lh });
    a.el.style.left = a.lx + 'px';
    a.el.style.top = y + 'px';
  }
}

/* ---------- Événements Claude Code → animations ---------- */
const trunc = (s, n) => { s = String(s ?? '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const isTask = (n) => n === 'Task' || n === 'Agent';

// « va boire un café » tapé dans une session Claude : le lead quitte son poste pour
// le mange-debout. Le prompt doit se réduire EXACTEMENT à l'une de ces phrases —
// sinon une demande qui *parle* de café (« ajoute un bouton café ») l'enverrait au bar.
const COFFEE_CMDS = new Set([
  'cafe', 'coffee', 'pause', 'break', 'pause cafe', 'coffee break', 'un cafe',
  'va boire un cafe', 'va prendre un cafe', 'va au cafe', 'go get coffee',
  'take a break', 'fais une pause', 'prends une pause', 'prends un cafe',
]);
const isCoffeeCmd = (p) => COFFEE_CMDS.has(String(p ?? '')
  .normalize('NFD').replace(/[̀-ͯ]/g, '')  // « café » → « cafe »
  .toLowerCase().replace(/[^a-z ]/g, ' ').replace(/s+/g, ' ').trim());

function describe(n = '', i = {}) {
  const f = i.file_path || i.notebook_path || i.path || '';
  const b = f ? f.split(/[\\/]/).pop() : '';
  if (n === 'Read') return ['read', '📖 lit ' + b];
  if (/^(Glob|Grep|LS)$/.test(n)) return ['read', '🔎 fouille ' + trunc(i.pattern || b, 24)];
  if (/^(Edit|MultiEdit|Write|NotebookEdit)$/.test(n)) return ['type', '⌨️ code ' + b];
  if (n === 'Bash') return ['term', '🖥️ ' + trunc(i.command, 30)];
  if (/^Web(Search|Fetch)$/.test(n)) return ['web', '🌐 ' + trunc(i.query || i.url, 30)];
  if (/^(TodoWrite|TaskCreate|TaskUpdate)$/.test(n)) return ['plan', '📝 planifie'];
  if (n.startsWith('mcp__')) return ['web', '🔌 ' + trunc(n.split('__').slice(1).join(' › '), 30)];
  return ['think', '⚙️ ' + n];
}

const sessions = new Map();
let podCount = 0;

// L'effectif : tous les employes de la maison, au travail ou non. Un agent appele
// une fois y entre et n'en sort plus — c'est ce qui fait la difference entre une
// agence d'interim et une entreprise. Les leads n'en font pas partie : ils SONT la
// session, et disparaissent avec elle.
const staff = [];
const idleStaff = (type) => staff.find((a) => a.name === type && !a.session);

// Ce qu'on fait selon l'endroit où l'on traîne. Partagé par l'arrivée au repos et
// par la reprise d'un employé gardé en mémoire, pour qu'ils ne divergent jamais.
const LEISURE_ACT = {
  couch: ['game', '🎮 joue à la console'],
  coffee: ['coffee', '☕ au mange-debout'],
  stand: ['idle', '🧍 discute près du salon'],
  lunch: ['coffee', '🍽️ déjeune'],
  baby: ['game', '⚽ au baby-foot'],
  billard: ['game', '🎱 au billard'],
};

// Reconstitue un employé que le serveur a gardé en mémoire. Il était déjà dans la
// maison avant qu'on ouvre la page : on le pose directement à une place de repos
// plutôt que de le faire entrer par la porte, ce qui serait un mensonge.
function hire(type) {
  if (staff.some((a) => a.name === type)) return;
  const a = new Agent('staff:' + type, { name: type, kind: 'sub' });
  staff.push(a);
  const spot = claimLeisure();
  // Aucune place : on le pose quand même devant le salon plutôt qu'à l'origine de
  // la scène, c'est-à-dire au beau milieu de la pièce.
  a.c.g.position.copy(spot ? spot.pos : new V3(LOUNGE_X + 3.2, 0, LOUNGE_Z + .4));
  if (!spot) { a.set('idle', '🧍 traîne dans l\'open space'); return; }
  a.spot = spot;
  a.state = 'leisure';
  a.faceAngle = spot.face;
  a.set(...LEISURE_ACT[spot.kind]);
}

// Nom de projet = dernier segment du cwd (chemins Windows ou POSIX).
function projectName(cwd) {
  return String(cwd || '').split(/[\\/]+/).filter(Boolean).pop() || 'session';
}
// Deux sessions ouvertes sur le même projet : on les numérote.
function uniqueName(base) {
  const used = new Set([...sessions.values()].map((s) => s.project));
  if (!used.has(base)) return base;
  for (let i = 2; ; i++) if (!used.has(base + ' #' + i)) return base + ' #' + i;
}

function whoFor(s, ev) {
  if (!s.subs.length) return s.main;
  if (ev.agent_id) { // si la version de Claude Code fournit l'id du sous-agent
    let a = s.subs.find(x => x.agentId === ev.agent_id);
    if (!a) { a = s.subs.find(x => !x.agentId); if (a) a.agentId = ev.agent_id; }
    if (a) return a;
  }
  return s.subs[s.subs.length - 1]; // heuristique : le dernier sous-agent lancé
}

// Fin de mission : petit temps mort, puis le mange-debout — sauf rappel entre-temps.
// Fin de mission : un temps mort pour que le rapport se lise, puis l'employe quitte
// l'ilot. Le jeton `gen` garantit qu'une reaffectation entre-temps annule le depart.
function finishSub(s, sub, label) {
  sub.set('idle', label);
  const gen = sub.gen;
  setTimeout(() => { if (sub.gen === gen) sub.goIdle(); }, 1400);
  s.main.set('read', '📥 lit le rapport');
}

// Un poste injoignable : veille, wifi coupé, fenêtre fermée. Ses sessions existent
// toujours quelque part — elles ne nous parlent simplement plus. Ses gens passent
// donc en pause, et gardent leur bureau : ils ne quittent pas le dossier. L'îlot
// est tamisé pour qu'on voie la différence avec une vraie pause café.
function setMachineAbsent(machine, absent) {
  if (!machine) return;
  for (const s of sessions.values()) {
    if (s.machine !== machine) continue;
    s.absent = absent;
    s.pod.setLampScale(absent ? .3 : 1);
    for (const a of [s.main, ...s.subs]) {
      if (absent) a.toPause('absent'); else a.resumeFromPause();
    }
  }
  renderSessions();
}

function handle(ev) {
  const sid = ev.session_id || 'local', evn = ev.hook_event_name;
  // L'effectif rejoué par le serveur : des employés, pas une session. Traité avant
  // toute autre chose — sans ça, l'absence de session_id créerait un îlot fantôme.
  if (evn === 'Staff') {
    for (const type of ev.staff || []) hire(type);
    renderSessions();
    return;
  }
  // Un poste entier se tait, ou revient. Ça ne concerne aucune session en
  // particulier : ça les concerne toutes, celles de cette machine. Traité ici, avant
  // que l'absence de session_id ne fabrique un îlot fantôme.
  if (evn === 'MachineOffline' || evn === 'MachineOnline') {
    setMachineAbsent(ev.machine, evn === 'MachineOffline');
    return;
  }
  let s = sessions.get(sid);
  if (!s) {
    if (evn === 'SessionEnd') return;
    const project = uniqueName(projectName(ev.cwd));
    // Sous le nom du projet : le poste en mode flotte, l'identifiant de session en
    // local. Sur un plateau qui mélange plusieurs machines, savoir CHEZ QUI se passe
    // un dossier vaut mieux que huit caractères d'UUID.
    const pod = new Pod(project, ev.machine || sid.slice(0, 8), TINTS[podCount++ % TINTS.length]);
    s = {
      sid, cwd: ev.cwd || '', project, pod, subs: [], machine: ev.machine || '',
      main: new Agent(sid, { name: project, kind: 'main', pod }),
      startedAt: Date.now(), tools: 0, slowest: null, lastTool: '', alert: null,
      bg: [], effort: ev.effort, mode: ev.permission_mode,
    };
    s.main.session = s;
    sessions.set(sid, s);
  }
  if (ev.cwd) s.cwd = ev.cwd;
  if (ev.effort) s.effort = ev.effort;
  if (ev.permission_mode) s.mode = ev.permission_mode;
  // `background_tasks` arrive sur Stop et SubagentStop : on garde les tâches en cours.
  if (Array.isArray(ev.background_tasks)) {
    s.bg = ev.background_tasks.filter((t) => t.status === 'running');
    refreshRack();
  }
  // Toute activité lève l'alerte : si ça travaille, ça n'attend pas.
  if (evn === 'UserPromptSubmit' || evn === 'PreToolUse') setAlert(s, null);
  // La pause du lead s'arrête dès qu'il y a du travail : on ne code pas au mange-debout.
  if (evn === 'PreToolUse' || (evn === 'UserPromptSubmit' && !isCoffeeCmd(ev.prompt))) s.main.backToDesk();

  let who = s.main, line = '';
  switch (evn) {
    case 'SessionStart': s.main.set('idle', '☕ en poste'); line = 'session démarrée'; break;
    case 'UserPromptSubmit':
      if (isCoffeeCmd(ev.prompt)) { s.main.toCoffee(); line = 'part en pause café'; break; }
      // En flotte le prompt n'a pas quitté le poste : on sait qu'une consigne est
      // tombée, pas laquelle. C'est tout l'objet de la pièce.
      if (ev.fleet) { s.main.set('think', ev.label || '💭 nouvelle consigne'); line = 'nouvelle consigne'; break; }
      s.main.set('think', '💭 ' + trunc(ev.prompt, 40)); line = '« ' + trunc(ev.prompt, 60) + ' »'; break;
    case 'PreToolUse': {
      const ti = ev.tool_input || {};
      if (isTask(ev.tool_name)) {
        const type = ti.subagent_type || 'agent', task = ti.description || ti.prompt;
        // La maison garde ses gens : on cherche d'abord un employé de ce métier qui
        // traîne au café ou sur le canapé, quelle que soit la session qui l'avait
        // embauché. On n'embauche que si tous ceux de ce métier sont déjà sur un dossier.
        let sub = idleStaff(type);
        if (sub) {
          sub.assignTo(s, task, !!ev._replay);
          // Pas de description en flotte : elle est restée sur le poste.
          line = 'rappelle ' + type + (task ? ' : ' + trunc(task, 40) : '');
        } else {
          const variant = staff.filter((a) => a.name === type).length;
          sub = new Agent(sid + ':' + (ev.tool_use_id || Math.random().toString(36).slice(2)),
            { name: type, kind: 'sub', task, pod: s.pod, seated: !!ev._replay, variant });
          sub.session = s; staff.push(sub);
          line = 'embauche ' + type + (task ? ' : ' + trunc(task, 40) : '');
        }
        sub.toolUseId = ev.tool_use_id; s.subs.push(sub);
        s.main.set('think', '👉 délègue à ' + type);
        // L'orchestrateur ne délègue plus depuis sa chaise : il se lève et va
        // expliquer. C'est le moment le plus lisible de la vie d'une session — on
        // voit la consigne passer d'une tête à l'autre. Il garde son bureau et y
        // revient : il tient le poste, briefing ou pas.
        s.main.briefTarget = sub;
      } else {
        who = whoFor(s, ev);
        // En mode flotte, le poste n'a envoyé que l'activité : le libellé arrive tout
        // fait et volontairement muet. describe() ne sert qu'en local, où l'on a
        // encore le détail sous la main.
        const [act, label] = ev.act ? [ev.act, ev.label || '⚙️ travaille']
          : describe(ev.tool_name, ti);
        who.set(act, label); line = label;
        s.tools++; s.lastTool = ev.tool_name;
        who.startedTool = { name: ev.tool_name, at: Date.now() };
      }
      break;
    }
    case 'PostToolUse': {
      if (!isTask(ev.tool_name)) {
        if (ev.duration_ms > (s.slowest?.ms ?? 0)) s.slowest = { name: ev.tool_name, ms: ev.duration_ms };
        const w = whoFor(s, ev); if (w) w.startedTool = null;
        break;
      }
      let i = s.subs.findIndex(a => a.toolUseId && a.toolUseId === ev.tool_use_id);
      if (i < 0) i = 0;
      const sub = s.subs[i];
      if (!sub) break;
      const r = ev.tool_response || {};
      if (r.isAsync || r.status === 'async_launched') {
        // L'appel rend la main en quelques millisecondes : l'agent ne finit pas, il
        // démarre. On retient son identité pour reconnaître son vrai SubagentStop.
        sub.agentId = r.agentId;
        sub.set('think', sub.task ? '💭 ' + trunc(sub.task, 34) : '💭 au travail');
        who = sub; line = 'parti en mission';
      } else {
        s.subs.splice(i, 1);
        finishSub(s, sub, '✅ terminé');
        who = sub; line = 'mission terminée → pause café';
      }
      break;
    }
    case 'SubagentStop': {
      // Vraie fin d'un agent. `agent_id` permet de désigner le bon, même en parallèle.
      let i = ev.agent_id ? s.subs.findIndex(a => a.agentId === ev.agent_id) : -1;
      if (i < 0 && !ev.agent_id) i = s.subs.findIndex(a => !a.agentId);
      if (i < 0) break;
      const sub = s.subs.splice(i, 1)[0];
      finishSub(s, sub, '📤 rend son rapport');
      sub.say(ev.last_assistant_message);
      who = sub; line = 'rapport rendu → pause café';
      break;
    }
    case 'Notification':
      s.main.set('wait', '✋ ' + trunc(ev.message || 'attend ta validation', 36));
      setAlert(s, ev.notification_type === 'idle_prompt' ? 'idle' : 'permission', ev.message);
      line = trunc(ev.message, 60); break;
    case 'Stop':
      s.main.set('idle', '☕ pause — à toi');
      setAlert(s, 'done', 'a fini son tour');
      s.main.say(ev.last_assistant_message);
      line = 'a fini, attend ta suite'; break;
    case 'SessionEnd':
      s.pod.closing = true; // l'îlot part quand ses derniers occupants l'ont quitté
      // Le dossier est clos, pas les contrats : les employés retournent à l'open space.
      [...s.subs].forEach((a) => a.goIdle());
      s.subs = [];
      setAlert(s, null);
      sessions.delete(sid);
      s.pod.maybeClose(); // aucun sous-agent en vol : l'îlot se démonte tout de suite
      line = 'session fermée'; break;
  }
  if (line) log((who === s.main ? s.project : s.project + ' › ' + who.name) + ' · ' + line);
  renderSessions();
}

/* ---------- Appels : « cette session a besoin de toi » ---------- */
// C'est le signal qui rend le bureau utile en second ecran : on doit pouvoir le
// capter sans lire les etiquettes, et meme sans regarder l'onglet.
const ALERTS = {
  idle:       { label: 'attend ton input',   color: 0xffb020, emoji: '✋' },
  permission: { label: 'attend ta validation', color: 0xe0695e, emoji: '✋' },
  done:       { label: 'a fini son tour',    color: 0x8fcf8a, emoji: '✅' },
};

function setAlert(s, kind, detail) {
  if (s.alert?.kind === kind) return;
  s.alert = kind ? { kind, detail, at: Date.now() } : null;
  s.pod.setBeacon(kind ? ALERTS[kind].color : null);
  // La pastille du lead suit l'appel : c'est lui qui attend ta reponse, pas ses
  // sous-agents, qui continuent de travailler pendant ce temps.
  s.main.refreshStatus();
  if (kind && kind !== 'done') ping();
  refreshAttention();
}

// Titre de l'onglet + pastille sur la favicon : lisibles depuis la barre des taches.
const favicon = document.createElement('link');
favicon.rel = 'icon'; document.head.appendChild(favicon);
function drawFavicon(n) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#2b221c'; x.beginPath();
  if (x.roundRect) x.roundRect(2, 2, 60, 60, 14); else x.rect(2, 2, 60, 60);
  x.fill();
  x.fillStyle = '#e8743b'; x.fillRect(12, 40, 40, 8);        // le bureau
  x.fillStyle = '#f4e9dc'; x.fillRect(20, 18, 24, 18);       // l'ecran
  if (n) {
    x.fillStyle = '#e0695e'; x.beginPath(); x.arc(48, 16, 15, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#fff'; x.font = 'bold 22px system-ui'; x.textAlign = 'center';
    x.fillText(String(n), 48, 24);
  }
  favicon.href = c.toDataURL('image/png');
}

function refreshAttention() {
  const waiting = [...sessions.values()].filter((s) => s.alert);
  document.title = waiting.length ? `(${waiting.length}) Claude Office` : 'Claude Office';
  drawFavicon(waiting.length);
  renderSessions();
}

// Son : coupe par defaut, et l'activer compte comme le geste utilisateur que les
// navigateurs exigent pour autoriser l'audio.
let audio = null, soundOn = false;
function ping() {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(1320, t + .12);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.12, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + .45);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + .5);
  } catch { /* pas d'audio disponible : tant pis, le visuel suffit */ }
}

// Cafe renverse : la tasse vole dans le sens de la poussee, retombe, et laisse une
// flaque qui s'etale puis seche. Tasse et flaque vivent hors des agents (spills) :
// elles survivent a celui qui les a semees.
const SPILL_DRY = 18; // secondes avant que la flaque ait seche
const spills = [];
const spillCupMat = new THREE.MeshStandardMaterial({ color: 0xf2e8da, roughness: .6 });
function spillCup(at, ux, uz) {
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(.075, .062, .13, 10), spillCupMat);
  cup.position.set(at.x, 1.15, at.z); cup.castShadow = true; scene.add(cup);
  spills.push({ cup, vx: ux * 1.6, vz: uz * 1.6, vy: 2.4, puddle: null, t0: 0 });
}
function updateSpills(dt, t) {
  for (let i = spills.length - 1; i >= 0; i--) {
    const s = spills[i];
    if (s.cup) {
      s.vy -= 9.8 * dt;
      s.cup.position.x += s.vx * dt; s.cup.position.z += s.vz * dt; s.cup.position.y += s.vy * dt;
      s.cup.rotation.x += 11 * dt; s.cup.rotation.z += 7 * dt; // elle tournoie
      if (s.cup.position.y <= .07) {
        // Impact : la flaque nait sous la tasse, qui reste couchee a cote.
        const p = s.cup.position;
        s.puddle = new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, .01, 20),
          new THREE.MeshStandardMaterial({ color: 0x3b2314, roughness: .15, transparent: true, opacity: .9 }));
        s.puddle.position.set(p.x, .012, p.z); s.puddle.scale.set(.05, 1, .05); scene.add(s.puddle);
        p.y = .07; s.cup.rotation.set(Math.PI / 2, s.cup.rotation.y, 0);
        s.lying = s.cup; s.cup = null; s.t0 = t;
      }
      continue;
    }
    const e = t - s.t0;
    const grow = Math.min(1, e / .6), k = 1 - (1 - grow) ** 3; // s'etale vite puis ralentit
    s.puddle.scale.set(k * (.8 + .2 * Math.sin(s.t0)), 1, k);
    s.puddle.material.opacity = .9 * Math.min(1, Math.max(0, (SPILL_DRY - e) / 4));
    if (e >= SPILL_DRY) {
      scene.remove(s.puddle); scene.remove(s.lying);
      s.puddle.geometry.dispose(); s.puddle.material.dispose(); s.lying.geometry.dispose();
      spills.splice(i, 1);
    }
  }
}

// Un corps qui tombe sur le parquet : un son grave et bref, qui retombe.
function thud() {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(48, t + .22);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.25, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + .3);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + .35);
  } catch { /* pas d'audio : la chute se voit tres bien */ }
}

/* ---------- L'usage du bloc de 5 h ---------- */
// Le serveur ne renvoie que des compteurs, jamais de contenu. Deux lectures sont
// possibles et aucune n'est parfaite :
//   - le TEMPS ecoule dans le bloc : exact, sans reglage, mais ne dit rien du volume ;
//   - le VOLUME consomme : plus parlant, mais aucun quota n'est lisible en local, donc
//     le budget est forcement une estimation.
// Par defaut on montre le temps, qui ne ment pas. `?budget=4000000` bascule la jauge
// et la fatigue sur le volume, rapporte a ce budget-la.
const BUDGET = Number(params.get('budget')) || 0;
const USAGE = { elapsed: 0, tokens: 0, messages: 0, blockStart: 0, blockEnd: 0, known: false };
let FATIGUE = 0;

// La part du bloc qui pilote la jauge et la fatigue.
function usageRatio() {
  if (!USAGE.known) return 0;
  return BUDGET > 0 ? clamp01(USAGE.tokens / BUDGET) : USAGE.elapsed;
}

const fmtTok = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' M'
  : n >= 1e3 ? Math.round(n / 1e3) + ' k' : String(n);

async function pullUsage() {
  if (server === null) return;
  try {
    const j = await (await fetch(server + '/usage')).json();
    if (j && typeof j.elapsed === 'number') {
      Object.assign(USAGE, j, { known: true });
      FATIGUE = usageRatio();
      clockDirty = true;
      renderUsage();
      applyBlockPause();
    }
  } catch { /* serveur indisponible : la jauge reste a sa derniere valeur */ }
}
// Bloc de 5 h épuisé : les gens du poste concerné vont en pause. En flotte, chaque
// poste a SON bloc, ouvert à une heure différente — `/usage` renvoie le détail par
// machine, et c'est lui qu'on lit. Se fier à l'agrégat enverrait tout le plateau au
// café parce qu'une seule machine a fini son bloc.
//
// Le seuil n'est pas 1 tout rond : la jauge est rafraîchie toutes les 30 s, donc on
// arriverait à 100 % une demi-minute après coup.
const BLOC_SEUIL = .995;
function applyBlockPause() {
  const parPoste = Array.isArray(USAGE.machines) && USAGE.machines.length
    ? new Map(USAGE.machines.map((m) => [m.machine, m.elapsed]))
    : null;
  for (const s of sessions.values()) {
    // Un poste déjà injoignable est en pause pour une raison plus forte : on ne
    // vient pas lui en substituer une autre.
    if (s.absent) continue;
    const r = parPoste ? (parPoste.get(s.machine) ?? 0) : usageRatio();
    const epuise = r >= BLOC_SEUIL;
    if (epuise === !!s.blocEpuise) continue;
    s.blocEpuise = epuise;
    s.pod.setLampScale(epuise ? .45 : 1);
    for (const a of [s.main, ...s.subs]) {
      if (epuise) a.toPause('bloc'); else a.resumeFromPause();
    }
  }
  renderSessions();
}

// Dix-huit heures. Une session qui attend une réponse ne l'aura pas ce soir : ses
// gens rentrent chez eux. L'îlot RESTE — la session existe toujours, elle attend
// toujours — mais il s'éteint. Un bureau vide le dit mieux qu'un îlot démonté, qui
// prétendrait que la session est finie.
//
// `?depart=20` décale l'heure ; avec `?clock=`, qui fait défiler la journée en
// accéléré, c'est la seule façon de voir le départ sans attendre le soir.
const HEURE_DEPART = Number(params.get('depart')) || 18;
function applyEndOfDay(hour) {
  const soir = hour >= HEURE_DEPART || hour < 6;
  let bouge = false;
  for (const s of sessions.values()) {
    // Un poste injoignable est déjà figé pour une raison plus forte, et ses gens
    // ne peuvent pas « rentrer » d'un bureau où ils ne sont plus.
    const partir = soir && !!s.alert && !s.absent;
    if (partir === !!s.deserte) continue;
    s.deserte = partir;
    s.pod.setLampScale(partir ? 0 : 1);
    for (const a of [s.main, ...s.subs]) {
      if (partir) a.goHome(); else a.comeBack();
    }
    bouge = true;
  }
  // Appelee quatre fois par seconde : on ne refait le panneau que s'il a change.
  if (bouge) renderSessions();
}

setTimeout(pullUsage, 900);
setInterval(pullUsage, 30e3);

function renderUsage() {
  const el = document.getElementById('usage');
  if (!USAGE.known) { el.hidden = true; return; }
  el.hidden = false;
  const r = usageRatio();
  el.textContent = '⏳ ' + Math.round(r * 100) + ' %  ·  ' + fmtTok(USAGE.tokens);
  el.style.color = r > .9 ? '#e0695e' : r > .7 ? '#e0a95c' : '';
  const fin = new Date(USAGE.blockEnd);
  el.title = 'bloc de 5 h · ' + USAGE.messages + ' messages'
    + '\nfin vers ' + fin.toLocaleTimeString('fr-FR').slice(0, 5)
    + (BUDGET > 0 ? '\njauge sur le volume, budget ' + fmtTok(BUDGET)
                  : '\njauge sur le temps écoulé (?budget=… pour le volume)');
}

/* ---------- L'horloge murale ---------- */
// Plutot qu'une jauge posee par-dessus l'image, l'information devient un objet de la
// piece : on la lit comme on lit une pendule de bureau.
const clockCv = document.createElement('canvas');
clockCv.width = clockCv.height = 256;
const clockCtx = clockCv.getContext('2d');
const clockTex = new THREE.CanvasTexture(clockCv);
clockTex.anisotropy = 4;
let clockDirty = true;

function drawClock() {
  const W = 256, R = 128, x = clockCtx;
  x.clearRect(0, 0, W, W);
  x.fillStyle = '#23190f'; x.beginPath(); x.arc(R, R, 118, 0, Math.PI * 2); x.fill();
  // Graduations : une par heure du bloc, cinq en tout.
  x.strokeStyle = 'rgba(244,233,220,.3)'; x.lineWidth = 3;
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i / 5) * Math.PI * 2;
    x.beginPath();
    x.moveTo(R + Math.cos(a) * 104, R + Math.sin(a) * 104);
    x.lineTo(R + Math.cos(a) * 114, R + Math.sin(a) * 114);
    x.stroke();
  }
  const r = usageRatio();
  // L'arc se remplit et se rechauffe : vert tant qu'il reste de la marge, ambre, rouge.
  x.strokeStyle = r > .9 ? '#e0695e' : r > .7 ? '#e0a95c' : '#8fcf8a';
  x.lineWidth = 16; x.lineCap = 'round';
  if (r > .002) {
    x.beginPath();
    x.arc(R, R, 96, -Math.PI / 2, -Math.PI / 2 + r * Math.PI * 2);
    x.stroke();
  }
  x.textAlign = 'center';
  x.fillStyle = '#f4e9dc'; x.font = '700 62px system-ui,Segoe UI,sans-serif';
  x.fillText(USAGE.known ? Math.round(r * 100) + '%' : '—', R, R + 10);
  x.fillStyle = 'rgba(244,233,220,.5)'; x.font = '500 23px ui-monospace,Consolas,monospace';
  x.fillText(USAGE.known ? fmtTok(USAGE.tokens) : 'bloc 5 h', R, R + 46);
  x.font = '500 19px system-ui,Segoe UI,sans-serif';
  x.fillText('BLOC 5 H', R, R - 42);
  clockTex.needsUpdate = true;
}

drawClock();
const clockFace = new THREE.Mesh(new THREE.CircleGeometry(.5, 48),
  new THREE.MeshBasicMaterial({ map: clockTex, transparent: true }));
clockFace.position.set(-1.05, 2.35, wallB(.05)); scene.add(clockFace);

const WX_ICON = { clear: '☀️', cloud: '☁️', rain: '🌧️', snow: '❄️', fog: '🌫️', storm: '⛈️' };
const fmtH = (h) => String(Math.floor(h)).padStart(2, '0') + ':'
  + String(Math.round((h % 1) * 60)).padStart(2, '0');

    + ' · couverture ' + Math.round(WX.clouds * 100) + ' %';
}

async function pullWeather() {
  if (server === null) return; // ouvert en fichier local : pas de serveur a interroger
  try {
    // `?city=Marseille` doit arriver jusqu'au serveur : sans ce report, la page
    // demandait toujours la ville par defaut et le parametre ne faisait rien.
    const ville = params.get('city');
    const url = server + '/weather' + (ville ? '?city=' + encodeURIComponent(ville) : '');
    const j = await (await fetch(url)).json();
    if (j.offline) { WX.offline = true; WX.city = null; }
    else {
      WX.offline = false;
      WX.code = j.code; WX.kind = wxKind(j.code);
      WX.clouds = clamp01((j.clouds ?? 0) / 100);
      WX.temp = j.temp; WX.city = j.city; WX.wind = j.wind ?? 0;
      const ri = hourOfISO(j.sunrise), se = hourOfISO(j.sunset);
      if (ri !== null && se !== null && se > ri) SUN_H = { rise: ri, set: se };
    }
  } catch { WX.offline = true; }
  skyDirty = true;
  renderWeather();
}

/* ---------- Mode démo (sans serveur) ---------- */
let demoTimers = [], demoOn = false;

const post = (tool_name, tool_use_id) => ({ hook_event_name: 'PostToolUse', tool_name, tool_use_id, tool_input: {} });
function scenario(sid, cwd, offset, prompt, steps) {

  at(t, () => handle({ session_id: sid, cwd, hook_event_name: 'SessionStart' })); t += 900;
  at(t, () => handle({ session_id: sid, cwd, hook_event_name: 'UserPromptSubmit', prompt })); t += 1800;
  for (const [dt, o] of steps) { t += dt; const e = { session_id: sid, cwd, ...o }; at(t, () => handle(e)); }
  return t;
}

  ]);
  const endB = scenario('demo-B', 'C:/dev/portail-client', 4000, 'Corrige le bug de pagination', [
    [0, pre('Agent', { subagent_type: 'general-purpose', description: 'Reproduire le bug de pagination' }, 'b1')],
    [2500, pre('Bash', { command: 'npm run dev' })],

    [2000, { hook_event_name: 'SubagentStop' }], [500, post('Agent', 'b1')],
    [1500, pre('Agent', { subagent_type: 'Plan', description: 'Plan du correctif' }, 'b2')],
    [2600, pre('Read', { file_path: 'src/api/cursor.ts' })],
    [2000, { hook_event_name: 'SubagentStop' }], [500, post('Agent', 'b2')],
