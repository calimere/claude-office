<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Office</title>
<style>
  :root { --bg:#2b221c; --panel:rgba(38,28,22,.88); --fg:#f4e9dc; --muted:#b9a894;
    --line:rgba(255,222,186,.13); }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #stage { position:fixed; inset:0; }
  #labels { position:fixed; inset:0; pointer-events:none; }
  .label { position:absolute; transform:translate(-50%,-100%); background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:5px 9px; max-width:168px;
    font-size:11px; box-shadow:0 6px 18px rgba(0,0,0,.4); backdrop-filter:blur(3px); }
  .label b, .label .t { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .label .t { color:var(--muted); }
  /* Pastille d'etat : travail, question, repos. Elle se lit de loin, quand le texte
     de la bulle est deja trop petit — c'est elle qu'on suit sur un plateau de vingt
     ilots, pas le libelle. */
  .label .st { position:absolute; top:-7px; left:-7px; width:17px; height:17px;
    line-height:17px; text-align:center; font-size:10px; font-style:normal;
    border-radius:50%; background:var(--panel); border:1px solid var(--line); }
  .label[data-st=ask] .st { border-color:#e0695e; animation:pulse 1.2s infinite; }
  .label[data-st=rest] .st { border-color:#d9a05b; }
  /* Caméra reculée : la bulle dit de moins en moins, jusqu'à n'être que sa pastille.
     Voir applyLabelDensity(). */
  #labels[data-dense=compact] .label .t,
  #labels[data-dense=compact] .label .say { display:none; }
  #labels[data-dense=pastille] .label { padding:0; border:0; background:none;
    box-shadow:none; backdrop-filter:none; max-width:none; }
  #labels[data-dense=pastille] .label b,
  #labels[data-dense=pastille] .label .t,
  #labels[data-dense=pastille] .label .say { display:none; }
  #labels[data-dense=pastille] .label .st { position:static; display:block;
    width:20px; height:20px; line-height:19px; font-size:11px; }
  .label[data-act=wait] { border-color:#e0695e; animation:pulse 1.2s infinite; }
  .label[data-act=coffee] { border-color:#d9a05b; }
  .label[data-act=game] { border-color:#8a9fd6; }
  .label[data-act=fall] { border-color:#e0a03c; }
  #sessions .staff { margin-top:6px; padding-top:6px; border-top:1px solid var(--line);
    color:var(--muted); font-size:10px; }
  @keyframes pulse { 50% { box-shadow:0 0 0 5px rgba(224,105,94,.3); } }
  #hud { position:fixed; top:12px; left:12px; right:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .pill { background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:6px 13px; font-weight:600; box-shadow:0 4px 14px rgba(0,0,0,.3); }
  #status::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%;
    margin-right:6px; background:#888; vertical-align:middle; }
  #status.live::before { background:#8fcf8a; } #status.demo::before { background:#e0a95c; }
  #log { position:fixed; left:12px; right:12px; bottom:12px; max-width:520px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:9px 12px;
    font:11px/1.6 ui-monospace,Menlo,Consolas,monospace; color:var(--muted);
    box-shadow:0 6px 20px rgba(0,0,0,.32); }
  #log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #log div:last-child { color:var(--fg); }
  #hint { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--panel);
    border:1px solid var(--line); padding:12px 18px; border-radius:14px; display:none; text-align:center; }
  #hint code { color:#e0a95c; }
  #sessions { position:fixed; top:52px; right:12px; width:210px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:9px 11px; display:none;
    box-shadow:0 6px 20px rgba(0,0,0,.32); }
  #sessions h4 { margin:0 0 6px; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  #sessions .s { display:flex; align-items:baseline; gap:6px; padding:3px 0; font-size:11px; }
  #sessions .dot { width:8px; height:8px; border-radius:50%; flex:none; align-self:center; }
  #sessions .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #sessions .ct { margin-left:auto; color:var(--muted); flex:none; }
  #sessions .s { cursor:pointer; border-radius:7px; padding:3px 5px; }
  #sessions .s:hover { background:rgba(255,222,186,.08); }
  #sessions .s[data-alert] { box-shadow:inset 0 0 0 1px rgba(224,105,94,.5); }
  .label .say { display:block; margin-top:4px; padding-top:4px; border-top:1px solid var(--line);
    color:var(--fg); font-style:italic; white-space:normal; max-height:4.6em; overflow:hidden; }
  .pill.btn { cursor:pointer; user-select:none; }
  .pill.btn[aria-pressed=true] { color:#e0a95c; }
  #detail { position:fixed; top:52px; right:232px; width:268px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:11px 13px; display:none;
    box-shadow:0 10px 28px rgba(0,0,0,.42); }
  #detail h4 { margin:0 0 2px; font-size:13px; }
  #detail .sub { color:var(--muted); font-size:10px; word-break:break-all; margin-bottom:8px; }
  #detail dl { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin:0; font-size:11px; }
  #detail dt { color:var(--muted); } #detail dd { margin:0; text-align:right; }
  #detail .close { position:absolute; top:7px; right:10px; cursor:pointer; color:var(--muted); }
  /* Vignettage et grain : deux calques CSS, pas du post-traitement. Ils ne coutent
     rien a la carte graphique et suffisent a poser l'image. */
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:3;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 42%, rgba(12,7,4,.5) 100%); }
  #grain { position:fixed; inset:0; pointer-events:none; z-index:4; opacity:.05;
    background-repeat:repeat; mix-blend-mode:overlay; }
  #actions-wrap { position:relative; }
  #actions-menu { position:absolute; top:calc(100% + 6px); left:0; z-index:5; min-width:250px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:5px;
    box-shadow:0 10px 28px rgba(0,0,0,.42); backdrop-filter:blur(3px); }
  #actions-menu button { display:block; width:100%; text-align:left; background:none; border:0;
    color:var(--fg); font:inherit; font-size:12px; padding:7px 10px; border-radius:9px; cursor:pointer; }
  #actions-menu button:hover, #actions-menu button:focus-visible { background:rgba(255,222,186,.1); outline:none; }
  #actions-menu small { display:block; color:var(--muted); font-size:10px; }
  #vol { width:84px; accent-color:#e0a95c; vertical-align:middle; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="hud"><span class="pill">Claude Office</span><span id="status" class="pill">Connexion…</span>
<span id="sound" class="pill btn" role="button" aria-pressed="false" title="Son des appels">🔕 Son</span>
<span id="actions-wrap"><span id="actions" class="pill btn" role="button" aria-haspopup="menu" aria-expanded="false" title="Mettre un peu d'animation">🎬 Actions ▾</span>
<div id="actions-menu" role="menu" hidden>
<button role="menuitem" data-action="fall">💥 Tout le monde par terre<small>sauf ceux qui travaillent</small></button>
<button role="menuitem" data-action="shuffle">🔀 Tout le monde change de place<small>les employés au repos</small></button>
<button role="menuitem" data-action="cat">🐈 Réveiller le chat</button>
<button role="menuitem" data-action="mop">🧽 Éponger le café renversé</button>
</div></span>
<span id="wx" class="pill" hidden></span>
<span id="usage" class="pill" hidden></span>
<input id="vol" type="range" min="0" max="100" value="35" hidden title="Volume de l'ambiance">
<span id="unfocus" class="pill btn" role="button" hidden>⤢ Tout voir</span></div>
<div id="hint">En attente de Claude Code…<br><small>lance <code>claude</code> dans un terminal</small></div>
<div id="sessions"><h4>Sessions</h4><div id="sessions-list"></div></div>
<div id="detail"><span class="close" id="detail-close">✕</span><h4 id="detail-title"></h4>
<div class="sub" id="detail-sub"></div><dl id="detail-body"></dl></div>
<div id="log"></div>
<div id="vignette"></div><div id="grain"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V3 = THREE.Vector3;
const params = new URLSearchParams(location.search);
// Durée de la pause café avant que l'agent ne rentre chez lui. 5 min par défaut ;
// `?coffee=30` pour observer le cycle complet sans attendre.
let COFFEE_SEC = Number(params.get('coffee')) || 300;

/* ---------- Scène ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b221c);
// Pas de brouillard. Il y en avait un (30 → 62) pour adoucir les bords d'une pièce
// de 30 × 22, où ces distances tombaient au-delà des murs. Dans une pièce de 46 × 37
// il commençait au milieu de l'open space et noyait le fond du plateau : le remède
// est devenu la maladie. Une pièce qu'on regarde en entier n'a pas de lointain.
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);
// Declare ici, rempli bien plus bas : resize() y touche, et un let en zone morte
// leverait une erreur meme teste par typeof.
let composer = null;

const cam = new THREE.OrthographicCamera();
cam.position.set(12, 12, 12);
const controls = new OrbitControls(cam, renderer.domElement);
controls.target.set(0, 0, 0);
controls.maxPolarAngle = Math.PI / 2.3;
controls.minZoom = 0.6; controls.maxZoom = 3.5;
controls.enableDamping = true;

// Cadrage : la caméra se resserre quand il n'y a qu'un îlot, s'élargit quand
// plusieurs projets tournent. Mis à jour par framePods() à chaque ouverture/fermeture.
let camSpan = 8.5;
let frameLast = 0; // derniere reprise du cadrage, pour ne pas la refaire a chaque image
const camTarget = new V3();

// Densité des bulles. À pleine charge, quarante bulles recouvrent le plateau et on
// ne voit plus la pièce. Plus la caméra recule, moins elles en disent : d'abord le
// libellé d'activité disparaît, puis tout sauf la pastille d'état. À vingt îlots,
// « il travaille / il t'attend / il se repose » est de toute façon le seul niveau de
// détail qu'on peut encore lire.
// Le document est interrogé à chaque appel plutôt que capturé dans une constante :
// `resize()` tourne bien avant que le reste du module ne soit évalué.
let labelDensity = '';
function applyLabelDensity() {
  labelDensity = camSpan > 26 ? 'pastille' : camSpan > 17 ? 'compact' : '';
  const el = document.getElementById('labels');
  if (el) el.dataset.dense = labelDensity;
}

function resize() {
  applyLabelDensity();
  if (composer) composer.setSize(innerWidth, innerHeight);
  const w = innerWidth, h = innerHeight, a = w / h;
  const s = Math.max(camSpan, camSpan * 1.4 / a);
  renderer.setSize(w, h);
  Object.assign(cam, { left: -s * a, right: s * a, top: s, bottom: -s, near: -100, far: 100 });
  cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// Pièce — dimensionnée pour la grille d'îlots (voir POD_* plus bas).
//
// Elle ne grandit QUE vers le fond et vers la gauche. Le bord avant ne bouge pas :
// c'est la bande du café, du salon et des places debout, celle que la caméra voit de
// plus près. L'étirer aurait éloigné le mobilier de repos du spectateur et laissé
// une langue de parquet vide au premier plan.
//
// D'où `front` et `back` plutôt qu'une profondeur centrée sur l'origine : le centre
// géométrique de la pièce (`cz`) n'est plus z = 0, et tout ce qui est posé contre un
// mur se place désormais par rapport à ce mur, jamais par rapport à l'origine.
// La pièce n'est plus symétrique en x non plus. Elle s'étend vers la DROITE pour
// loger la cantine, sans toucher au mur de gauche, qui porte le tableau blanc et la
// porte. D'où `left` et `right` plutôt qu'une largeur centrée sur l'origine — même
// raisonnement que `front` et `back`, pour la même raison : on agrandit d'un seul
// côté, et tout ce qui est accroché à un mur doit suivre CE mur.
const ROOM = { left: -23, right: 34, front: 11, back: -26 };
ROOM.w = ROOM.right - ROOM.left;
ROOM.cx = (ROOM.left + ROOM.right) / 2;
ROOM.d = ROOM.front - ROOM.back;
ROOM.cz = (ROOM.front + ROOM.back) / 2;
// Raccourcis de lecture : « contre le mur de gauche », « contre le mur du fond ».
const wallL = (k) => ROOM.left + k;
const wallR = (k) => ROOM.right - k;
const wallB = (k) => ROOM.back + k;
const wallF = (k) => ROOM.front - k;

// Grille d'emplacements — 5 colonnes × 4 rangées = 20 sessions simultanées visibles.
//
// Les rangées vont par PAIRES. Chaque paire encadre une allée, et les deux rangées
// s'ouvrent dessus ; entre deux paires, les îlots se tournent le dos. C'est ce qui
// permet d'ajouter des rangées sans ajouter des allées : quatre rangées, deux allées.
// L'écart de 9 à l'intérieur d'une paire laisse la place d'y marcher (6,1 d'îlot +
// 2,9 d'allée) ; l'écart de 7,5 entre deux paires n'est qu'un interstice, comme
// entre deux colonnes.
//
// L'ordre compte : la rangée la plus proche de la caméra vient en premier, donc une
// maison peu chargée s'installe au premier plan plutôt qu'au fond.
const POD_X = [-13.5, -6, 1.5, 9, 16.5];
const POD_Z = [4.5, -4.5, -12, -21];
// Les allées, et la façon de trouver la sienne. Tout déplacement passe par une allée
// puis par le couloir de gauche, qui les relie toutes.
const AISLES = [0, -16.5];
const aisleFor = (z) => AISLES.reduce((a, b) => (Math.abs(b - z) < Math.abs(a - z) ? b : a));

// Lumière d'intérieur : ciel tiède, rebond chaud du parquet, soleil rasant adouci.
scene.add(new THREE.HemisphereLight(0xffe7cc, 0x4a3426, 0.85));
const sun = new THREE.DirectionalLight(0xffd9a8, 1.15);
// La lumiere ET sa cible sont decalees du meme z : la direction du soleil ne change
// pas, mais son volume d'ombre se recentre sur la piece. Sans ce decalage, les ilots
// du fond seraient eclaires sans jamais projeter — une moitie de plateau qui flotte.
sun.position.set(8, 20, 12 + ROOM.cz); sun.castShadow = true;
sun.target.position.set(0, 0, ROOM.cz); scene.add(sun.target);
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 3; sun.shadow.bias = -0.0008;
const shadowSpan = Math.max(ROOM.w, ROOM.d) * .62 + 8;
Object.assign(sun.shadow.camera, { left: -shadowSpan, right: shadowSpan,
  top: shadowSpan, bottom: -shadowSpan, far: 90 });
scene.add(sun);
const ambient = new THREE.AmbientLight(0xffd9b8, 0.22); scene.add(ambient); // évite le noir dur
const hemi = scene.children.find((o) => o.isHemisphereLight) ?? null;

// L'eclairage suit l'heure reelle : frais le matin, dore en fin d'apres-midi, et le
// soir il ne reste que les suspensions. `?hour=21` pour forcer une ambiance.
const DAYLIGHT = [
  { h: 0,  sun: 0x5a6a8a, i: .18, sky: 0x3b4560, amb: .1,  win: 0x2f3c55, wi: .25 },
  { h: 7,  sun: 0xffd2a8, i: .85, sky: 0xcfe0ff, amb: .2,  win: 0xcfe4ff, wi: .8 },
  { h: 12, sun: 0xfff2dd, i: 1.35, sky: 0xffeedd, amb: .26, win: 0xfff3d8, wi: 1.0 },
  { h: 17, sun: 0xffc07a, i: 1.15, sky: 0xffe0bb, amb: .22, win: 0xffb866, wi: .9 },
  { h: 20, sun: 0xd08a5a, i: .5,  sky: 0x8a6a62, amb: .15, win: 0xff9f55, wi: .6 },
  { h: 24, sun: 0x5a6a8a, i: .18, sky: 0x3b4560, amb: .1,  win: 0x2f3c55, wi: .25 },
];

/* ---------- Horloge de la scene ---------- */
// Par defaut l'heure systeme. `?hour=21` la fige, `?clock=120` fait defiler une
// journee entiere en 120 secondes — indispensable pour regler l'ambiance sans
// attendre le coucher du soleil.
const FIXED_HOUR = params.has('hour') && Number.isFinite(Number(params.get('hour')))
  ? ((Number(params.get('hour')) % 24) + 24) % 24 : null;
const CLOCK_SPEED = Number(params.get('clock')) || 0;
function nowHours(t) {
  if (FIXED_HOUR !== null) return FIXED_HOUR;
  if (CLOCK_SPEED > 0) return (t / CLOCK_SPEED * 24) % 24;
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
}
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

/* ---------- Meteo ---------- */
// Lever et coucher viennent du serveur, donc de la vraie ville : des heures fixes
// seraient fausses de trois heures entre decembre et juin.
let SUN_H = { rise: 7.5, set: 18.5 };
const WX = { kind: 'clear', clouds: 0, code: null, temp: null, city: null, wind: 0, offline: true };

// Codes WMO d'Open-Meteo, ramenes aux cinq temps que la scene sait dessiner.
function wxKind(code) {
  if (code <= 1) return 'clear';
  if (code === 45 || code === 48) return 'fog';
  if (code >= 95) return 'storm';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
  return 'cloud';
}
const hourOfISO = (iso) => { const m = /T(\d\d):(\d\d)/.exec(String(iso)); return m ? +m[1] + +m[2] / 60 : null; };

/* ---------- Le ciel derriere les fenetres ---------- */
// Une seule texture pour les deux fenetres : c'est le meme dehors. Redessinee par
// intermittence seulement — a 10 images par seconde quand il pleut ou qu'il neige,
// et sinon uniquement quand quelque chose a change.
const skyCv = document.createElement('canvas');
skyCv.width = 320; skyCv.height = 180;
const skyCtx = skyCv.getContext('2d');
const skyTex = new THREE.CanvasTexture(skyCv);
skyTex.anisotropy = 4;
let skyDirty = true, skyLast = -9;

// Silhouette de ville, tiree une fois : la redessiner au hasard a chaque image la
// ferait grouiller. Les memes immeubles doivent rester les memes.
const SKYLINE = (() => {
  const out = []; let bx = -8;
  for (let i = 0; bx < 332; i++) {
    const w = 16 + ((i * 37) % 28), h = 26 + ((i * 53) % 66);
    out.push({ x: bx, w, h, seed: i });
    bx += w + 3 + (i % 3);
  }
  return out;
})();

function drawSky(h, t) {
  const W = skyCv.width, H = skyCv.height, x = skyCtx;
  const night = h < SUN_H.rise - .5 || h > SUN_H.set + .5;
  const golden = !night && (h < SUN_H.rise + 1.3 || h > SUN_H.set - 1.3);
  const k = WX.kind;

  const g = x.createLinearGradient(0, 0, 0, H);
  if (night) { g.addColorStop(0, '#0b1120'); g.addColorStop(1, '#223049'); }
  else if (golden) { g.addColorStop(0, '#52618c'); g.addColorStop(.5, '#d59061'); g.addColorStop(1, '#f2bc84'); }
  else if (k === 'clear') { g.addColorStop(0, '#5a9ed6'); g.addColorStop(1, '#c6e3f4'); }
  else if (k === 'fog') { g.addColorStop(0, '#aeb4b8'); g.addColorStop(1, '#d2d6d8'); }
  else { g.addColorStop(0, '#8b97a4'); g.addColorStop(1, '#c2c9d0'); }
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  // Immeubles, puis leurs fenetres : deux passes, pour ne pas jongler avec le style.
  x.fillStyle = night ? '#070b14' : 'rgba(44,52,66,.5)';
  for (const b of SKYLINE) x.fillRect(b.x, H - b.h, b.w, b.h);
  if (night) {
    x.fillStyle = '#ffce84';
    for (const b of SKYLINE) {
      for (let r = 0; r * 9 < b.h - 10; r++) {
        for (let c = 0; c * 6 < b.w - 6; c++) {
          // Allumage stable dans le temps, mais quelques fenetres clignotent lentement.
          const seed = (b.seed * 17 + r * 13 + c * 29) % 11;
          if (seed > 3) continue;
          if (seed === 3 && Math.sin(t * .3 + b.seed + r) < .3) continue;
          x.fillRect(b.x + 3 + c * 6, H - b.h + 6 + r * 9, 3, 5);
        }
      }
    }
  }

  // Nuages : des galets flous, d'autant plus bas et denses que le ciel est couvert.
  if (k !== 'clear') {
    const n = 3 + Math.round(WX.clouds * 6);
    x.fillStyle = night ? 'rgba(90,104,128,.45)' : 'rgba(255,255,255,.5)';
    for (let i = 0; i < n; i++) {
      const cx = ((i * 71 + t * 2.2) % (W + 90)) - 45;
      const cy = 14 + ((i * 29) % 46);
      const rr = 13 + ((i * 17) % 16);
      x.beginPath();
      x.arc(cx, cy, rr, 0, Math.PI * 2);
      x.arc(cx + rr * .8, cy + 4, rr * .72, 0, Math.PI * 2);
      x.arc(cx - rr * .8, cy + 5, rr * .62, 0, Math.PI * 2);
      x.fill();
    }
  }

  if (k === 'fog') { x.fillStyle = 'rgba(214,218,220,.55)'; x.fillRect(0, 0, W, H); }

  // Pluie : des traits obliques, plus serres qu'on ne croit — c'est la densite qui
  // fait lire la pluie, pas la taille des gouttes.
  if (k === 'rain' || k === 'storm') {
    x.strokeStyle = 'rgba(206,224,240,.5)'; x.lineWidth = 1;
    const n = k === 'storm' ? 150 : 100;
    for (let i = 0; i < n; i++) {
      const sx = (i * 61 + t * 150) % (W + 60) - 30;
      const sy = (i * 97 + t * 420) % (H + 40) - 20;
      x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx - 4, sy + 13); x.stroke();
    }
    if (k === 'storm' && Math.sin(t * .7) > .994) { // un eclair, rarement
      x.fillStyle = 'rgba(255,255,255,.75)'; x.fillRect(0, 0, W, H);
    }
  }

  // Neige : des flocons qui tombent lentement et derivent.
  if (k === 'snow') {
    x.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 90; i++) {
      const sx = ((i * 53 + Math.sin(t * .6 + i) * 14) % (W + 20)) - 10;
      const sy = (i * 83 + t * 34) % (H + 20) - 10;
      x.beginPath(); x.arc(sx, sy, 1 + (i % 3) * .5, 0, Math.PI * 2); x.fill();
    }
  }

  // Sur la vitre elle-meme : des gouttes immobiles, et quelques-unes qui coulent.
  if (k === 'rain' || k === 'storm') {
    x.fillStyle = 'rgba(226,240,252,.3)';
    for (let i = 0; i < 46; i++) {
      const dx = (i * 97) % W, dy = (i * 131) % H;
      x.beginPath(); x.arc(dx, dy, 1 + (i % 3), 0, Math.PI * 2); x.fill();
    }
    x.strokeStyle = 'rgba(226,240,252,.34)'; x.lineWidth = 2;
    for (let i = 0; i < 9; i++) {
      const dx = (i * 71) % W;
      const dy = ((i * 53 + t * 26) % (H + 30)) - 15;
      x.beginPath(); x.moveTo(dx, dy); x.lineTo(dx, dy + 16 + (i % 4) * 7); x.stroke();
    }
  }
  skyTex.needsUpdate = true;
}

const windowPanes = [];
// Niveau d'allumage des suspensions, 0 a 1. Elles s'allument avant qu'il fasse nuit
// noire, comme dans un vrai bureau, et restent un peu allumees en plein jour si le
// ciel est couvert — c'est exactement ce qu'on fait chez soi.
function lampLevel(hour) {
  const m = 1.1; // la transition dure environ deux heures
  const up = clamp01((hour - (SUN_H.rise - m)) / (2 * m));
  const down = clamp01(((SUN_H.set + m) - hour) / (2 * m));
  const day = Math.min(up, down); // 1 en plein jour, 0 la nuit
  return Math.max(1 - day, WX.clouds * .5 * day);
}

function applyDaylight(hour) {
  let a = DAYLIGHT[0], b = DAYLIGHT[DAYLIGHT.length - 1];
  for (let i = 0; i < DAYLIGHT.length - 1; i++) {
    if (hour >= DAYLIGHT[i].h && hour <= DAYLIGHT[i + 1].h) { a = DAYLIGHT[i]; b = DAYLIGHT[i + 1]; break; }
  }
  const k = (hour - a.h) / Math.max(1e-6, b.h - a.h);
  const lerpHex = (x, y) => new THREE.Color(x).lerp(new THREE.Color(y), k);
  const num = (x, y) => x + (y - x) * k;
  sun.color.copy(lerpHex(a.sun, b.sun)); sun.intensity = num(a.i, b.i);
  if (hemi) hemi.color.copy(lerpHex(a.sky, b.sky));
  ambient.intensity = num(a.amb, b.amb);
  // Un ciel couvert aplatit tout : moins de soleil, plus d'ambiante diffuse.
  const cover = WX.offline ? 0 : WX.clouds;
  sun.intensity *= 1 - cover * .55;
  ambient.intensity *= 1 + cover * .35;

  // Le soleil traverse vraiment le ciel : d'est en ouest, haut a midi. Ce sont les
  // ombres qui balaient la piece qui font sentir l'heure, pas la teinte seule.
  const p = clamp01((hour - SUN_H.rise) / Math.max(.5, SUN_H.set - SUN_H.rise));
  const elev = Math.sin(Math.PI * p);
  sun.position.set(-21 + p * 42, 3.5 + elev * 23, -16);

  for (const pane of windowPanes) {
    pane.material.emissive.copy(lerpHex(a.win, b.win));
    pane.material.emissiveIntensity = num(a.wi, b.wi);
  }

  // Les suspensions suivent, chacune gardant son materiau : on ne touche qu'a
  // l'intensite, pour que la couleur du projet reste la sienne.
  const lvl = lampLevel(hour);
  for (const pod of pods) {
    pod.applyLamp(lvl);
  }
}

function box(w, h, d, color, extra = {}) {

}


// Parquet dessiné sur canvas : des lames un peu dépareillées valent mieux qu'un aplat.
function parquetTexture() {
  const W = 1024, H = 1024, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const tones = ['#7c5839', '#724f30', '#845f3d', '#6b4a2c', '#7a5435', '#8a6442'];
  x.fillStyle = '#6b4a2e'; x.fillRect(0, 0, W, H);
  const rows = 14, plank = H / rows, len = 190;
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) ? len / 2 : 0;
    for (let i = -1; i * len < W + len; i++) {
      const px = i * len - off;
      x.fillStyle = tones[Math.abs(r * 31 + i * 17) % tones.length];
      x.fillRect(px + 3, r * plank + 3, len - 6, plank - 6);
      x.strokeStyle = 'rgba(60,38,22,.35)'; x.lineWidth = 1;
      for (let g = 0; g < 3; g++) {
        const gy = r * plank + 8 + g * (plank - 16) / 2.4;
        x.beginPath(); x.moveTo(px + 8, gy); x.lineTo(px + len - 8, gy + (g % 2 ? 2 : -2)); x.stroke();
      }
    }
  }
  const t = new THREE.CanvasTexture(c);
  // Répétition proportionnelle à la pièce : une lame doit garder la même taille
  // quand la pièce grandit, sinon le parquet s'étire avec elle.
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(ROOM.w / 10, ROOM.d / 10);
  t.anisotropy = 8; return t;
}

// Enseigne murale. Lettrage dessiné par défaut ; si un logo.png est posé à côté
// d'index.html, il le remplace (le serveur sert les images du dossier).
// Enseigne du mur du fond. Generique par defaut : `?sign=ACME&subsign=LABS` pour
// l'adapter a sa maison, `?subsign=` seul pour ne garder que la ligne principale.
// Un `logo.png` pose a cote d'index.html remplace de toute facon le lettrage.
const SIGN = params.get('sign') ?? 'CLAUDE';
const SIGN_SUB = params.get('subsign') ?? 'OFFICE';

function wordmarkTexture() {
  const W = 1024, H = 256, PAD = 48, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.clearRect(0, 0, W, H);
  x.textAlign = 'center';
  // Une enseigne passee en parametre peut etre longue : on reduit le corps jusqu'a
  // ce qu'elle tienne dans la texture plutot que de la laisser deborder.
  const fit = (txt, size, weight) => {
    for (; size > 12; size -= 2) {
      x.font = `${weight} ${size}px system-ui,Segoe UI,sans-serif`;
      if (x.measureText(txt).width <= W - PAD * 2) break;
    }
  };
  if (SIGN) {
    fit(SIGN, 104, 700);
    x.fillStyle = '#f0e2cf'; x.fillText(SIGN, W / 2, 118);
  }
  if (SIGN_SUB) {
    // Sous-titre espace lettre a lettre, cale sur la largeur du mot principal pour
    // que les deux lignes forment un bloc. Le ton est clair : l'or d'origine se
    // confondait avec le platre du mur, et l'enseigne n'est pas eclairee.
    fit(SIGN_SUB, 62, 600);
    x.fillStyle = '#ecd6b4';
    const step = Math.min(68, (W - PAD * 2) / Math.max(1, SIGN_SUB.length));
    SIGN_SUB.split('').forEach((ch, i) =>
      x.fillText(ch, W / 2 + (i - (SIGN_SUB.length - 1) / 2) * step, 196));
  }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t;
}

// Une grande table et ses chaises : c'est le seul meuble de la piece qui ne serve
// qu'a une heure precise.
/* ---------- La cantine ---------- */
// La bande avant ne faisait que 3,45 de profondeur, et devait loger le café, le
// salon, les places debout ET une table : tout s'y entassait, et cinq chaises pour
// quatre-vingts employés possibles, ce n'était pas une cantine mais un strapontin.
//
// La pièce s'étend donc vers la droite, et une cloison vitrée — celle-là même qu'on
// a retirée des îlots, où elle mentait sur la taille des équipes — y fait une vraie
// salle. Le coin café y bascule tout seul : il est ancré au mur de droite, qui vient
// de reculer. Une cantine avec sa machine à café, c'est ce qu'est un vrai bureau.

// Cloison : bois en bas, verre dépoli en haut. Même facture que les anciennes
// cloisons d'îlot — on ne jette pas un matériau qui marchait, on le met là où il
// dit quelque chose de vrai.
function cloison(px, pz, w, d) {
  const base = box(w, .78, d, 0x6d4b33); base.position.set(px, .39, pz); scene.add(base);
  const glass = new THREE.Mesh(new THREE.BoxGeometry(w, .9, d),
    new THREE.MeshStandardMaterial({ color: 0xd6e4e6, transparent: true, opacity: .2, roughness: .15 }));
  glass.position.set(px, 1.25, pz); scene.add(glass);
  const rail = box(w + .06, .07, d + .06, 0x5c3f2a);
  rail.position.set(px, 1.73, pz); scene.add(rail);
}
// La cloison de l'aile, percée d'une ouverture par salle, et les refends qui les
// séparent. Les tronçons servent aussi à la navigation : marqués d'un bloc, ils
// mureraient les salles et personne n'irait jamais y mettre les pieds.
const AILE_SEGMENTS = [];
for (const s of Object.values(SALLES)) {
  const [p0, p1] = s.porte;
  for (const [a, b] of [[s.z0, p0], [p1, s.z1]]) {
    if (b - a < .05) continue;
    AILE_SEGMENTS.push([AILE_X, (a + b) / 2, .12, b - a]);
  }
  // Refend au fond de la salle. Celui du fond de la pièce est déjà un mur.
  if (s.z0 > ROOM.back) {
    AILE_SEGMENTS.push([(AILE_X + ROOM.right) / 2, s.z0, ROOM.right - AILE_X, .12]);
  }
}
for (const [x, z, w, d] of AILE_SEGMENTS) cloison(x, z, w, d);

/* ---------- Le coin loisir : baby-foot et billard ---------- */
// Derrière le salon, dans la même salle. Deux jeux qui se jouent DEBOUT et à
// plusieurs : c'est ce qui les distingue du canapé, où l'on s'affale seul devant la
// console. Un bureau se regarde aussi pour ses moments où l'on ne travaille pas.
const BABY_Z = -7.3, BILLARD_Z = -10.8, JEUX_X = 28;
const JEU_SPOTS = [];

// Baby-foot : caisse sur quatre pieds, barres en travers, deux joueurs par côté.
{
  const caisse = box(1.5, .35, 2.4, 0x7a4a2e); caisse.position.set(JEUX_X, .72, BABY_Z);
  scene.add(caisse);
  const tapis = box(1.34, .04, 2.24, 0x2f6b48); tapis.position.set(JEUX_X, .9, BABY_Z);
  scene.add(tapis);
  for (const dx of [-.68, .68]) {
    for (const dz of [-1.1, 1.1]) {
      const p = box(.12, .55, .12, 0x5c4436); p.position.set(JEUX_X + dx, .27, BABY_Z + dz);
      scene.add(p);
    }
  }
  // Les barres dépassent de part et d'autre : c'est ce qui le rend reconnaissable.
  for (const dz of [-.75, -.25, .25, .75]) {
    const b = box(2.1, .05, .05, 0xb9b2a6, { metalness: .5, roughness: .4 });
    b.position.set(JEUX_X, .98, BABY_Z + dz); scene.add(b);
  }
  for (const dz of [-.5, .5]) {
    for (const dx of [-.42, .42]) {
      JEU_SPOTS.push({ pos: new V3(JEUX_X + dx, 0, BABY_Z + dz * 2.6), kind: 'baby', busy: false,
        face: Math.atan2(dx * .2, dz) });
    }
  }
}

{

  for (const dx of [-1.3, 1.3]) {

      scene.add(p);
    }

  for (const [cx, cz] of [[-1.0, 0], [1.0, 0], [0, -.4], [0, .4]]) {

// Trois tables de six, chaises des deux côtés : on déjeune en se parlant, ce que la
// bande avant ne permettait pas. L'allée de gauche (x 23 → 24,7) dessert les trois.
const LUNCH_TABLE_X = 26.5;
const LUNCH_TABLES = [2.0, 5.5, 9.0];
const LUNCH_SPOTS = [];
for (const tz of LUNCH_TABLES) {
  const top = box(3.6, .1, 1.3, 0xa5784f); top.position.set(LUNCH_TABLE_X, .78, tz);
  scene.add(top);
  for (const dx of [-1.6, 1.6]) {
    for (const dz of [-.45, .45]) {
      const p = box(.12, .78, .12, 0x6b4e35); p.position.set(LUNCH_TABLE_X + dx, .39, tz + dz);
      scene.add(p);
    }
  }
  for (const dz of [-1.15, 1.15]) {
    for (const dx of [-1.2, 0, 1.2]) {
      const x = LUNCH_TABLE_X + dx, z = tz + dz;
      const assise = box(.5, .08, .5, 0x7a5a4c); assise.position.set(x, .46, z); scene.add(assise);
      const dossier = box(.5, .5, .07, 0x7a5a4c);
      dossier.position.set(x, .72, z + (dz < 0 ? -.23 : .23)); scene.add(dossier);
      for (const [lx, lz] of [[-.2, -.2], [.2, -.2], [-.2, .2], [.2, .2]]) {
        const l = box(.06, .44, .06, 0x5c4436); l.position.set(x + lx, .22, z + lz); scene.add(l);
      }
      // Tourne vers la table : atan2(moi - cible), comme partout ailleurs ici.
      LUNCH_SPOTS.push({ pos: new V3(x, 0, z), kind: 'lunch', busy: false,
        face: Math.atan2(0, dz) });
    }
  }
  // Deux assiettes par table, pour qu'elle ne soit pas nue quand personne n'y est.
  for (const dx of [-1.1, 1.1]) {
    const a = new THREE.Mesh(new THREE.CylinderGeometry(.22, .18, .04, 14),
      new THREE.MeshStandardMaterial({ color: 0xeee6d8, roughness: .5 }));
    a.position.set(LUNCH_TABLE_X + dx, .85, tz); a.castShadow = true; scene.add(a);
  }
}

// Heure courante, tenue a jour par la boucle de rendu. claimLeisure() en a besoin
// pour savoir si c'est l'heure de manger, et elle est appelee hors de la boucle.
let HEURE = 9;
const MIDI = [12, 14];

// Une place libre pour un employe desoeuvre. On evite de lui rendre l'occupation
// qu'il vient de quitter, sinon il se rassoit exactement la ou il etait.
//
// Entre midi et deux, la table passe devant tout le reste : c'est l'heure, et un
// bureau ou l'on dejeune debout au distributeur est un bureau triste. Ceux qui
// TRAVAILLENT ne sont pas concernes — on ne les leve pas de leur poste, pas plus
// qu'a dix-huit heures.
function claimLeisure(avoid) {
  const seated = avoid === 'couch' ? [COFFEE_SPOTS, COUCH_SPOTS] : [COUCH_SPOTS, COFFEE_SPOTS];
  // Les jeux passent après le canapé et le bar, mais avant les places debout : on
  // préfère une partie de baby-foot à rester planté à discuter, et les places debout
  // restent ce qu'elles ont toujours été — le dernier recours qui évite que
  // quelqu'un se retrouve immobile au milieu de la pièce.
  const pools = HEURE >= MIDI[0] && HEURE < MIDI[1]
    ? [LUNCH_SPOTS, ...seated, JEU_SPOTS, STAND_SPOTS]
    : [...seated, JEU_SPOTS, STAND_SPOTS];
  for (const pool of pools) {
    const k = pool.find((p) => !p.busy);
    if (k) { k.busy = true; return k; }
  }
  return null; // tout est pris : l'employe reste la ou il est
}

// Tapis : epouse la bande, sans glisser sous les cloisons (paroi droite en x = 12,05).
const coffeeRug = box(4.8, .03, 3.4, 0x8c5a46, { roughness: 1 });
coffeeRug.position.set(12.4, .015, 9.6); coffeeRug.castShadow = false;
coffeeRug.receiveShadow = true; scene.add(coffeeRug);

// Baie serveurs, dans l'angle du fond a droite. Trois armoires : seule celle du
// milieu est branchee sur les donnees — une LED par commande shell encore en cours
// (background_tasks des hooks). Les deux autres ne sont que du decor qui respire.
// La baie a désormais SA salle, au fond de l'aile. Deux rangées d'armoires, comme
// une vraie salle machine : on en met huit là où trois flottaient contre un mur.
//
// Une seule reste branchée sur les données, et c'est volontaire — une salle serveur
// où tout clignote en rythme ne dirait plus rien de ce qui tourne vraiment. Les sept
// autres gardent leurs veilleuses fixes.
const RACK_X = (AILE_X + ROOM.right) / 2, RACK_Z = -16.5, RACK_Z2 = -21.5;
const RACK_LEDS = 8;
const rackLeds = [];
for (const [cx, cz] of [
  [RACK_X - 1.9, RACK_Z], [RACK_X - .63, RACK_Z], [RACK_X + .63, RACK_Z], [RACK_X + 1.9, RACK_Z],
  [RACK_X - 1.9, RACK_Z2], [RACK_X - .63, RACK_Z2], [RACK_X + .63, RACK_Z2], [RACK_X + 1.9, RACK_Z2],
]) {
  const live = cx === RACK_X - .63 && cz === RACK_Z;
  const body = box(1.15, 2.0, .85, 0x2a2420); body.position.set(cx, 1.0, cz); scene.add(body);
  const top = box(1.25, .08, .95, 0x3a322c); top.position.set(cx, 2.04, cz); scene.add(top);
  // Grille d'aeration et poignee : sans elles, une armoire n'est qu'un bloc noir.
  for (let i = 0; i < 4; i++) {
    const vent = box(.8, .05, .02, 0x15110f);
    vent.position.set(cx, .26 + i * .13, cz + .44); scene.add(vent);
  }
  const handle = box(.09, .3, .07, 0x6a615a, { metalness: .5, roughness: .4 });
  handle.position.set(cx + .44, 1.52, cz + .45); scene.add(handle);
  for (let i = 0; i < RACK_LEDS; i++) {
    const led = box(.5, .07, .02, 0x1e1a17, { emissive: 0x000000 });
    led.position.set(cx, 1.82 - i * .2, cz + .44); scene.add(led);
    // Les voisines gardent quelques veilleuses fixes : la salle machine vit, mais
    // seul le rack du milieu dit quelque chose de vrai sur les sessions.
    if (live) rackLeds.push(led); else if (i % 3 === 0) led.material.emissive.setHex(0x2f6b48);
  }
}
// Chemin de cables entre les armoires et le mur : trois boucles molles.
for (const [cz, col] of [[-9.74, 0x4a6fa8], [-9.62, 0xb03a2e], [-9.5, 0x6a615a]]) {
  const duct = box(3.6, .06, .06, col);
  duct.position.set(13.2, 2.12, cz); scene.add(duct);
}
function runningTasks() {
  return [...sessions.values()].reduce((n, s) => n + (s.bg?.length ?? 0), 0);
}
function refreshRack() {
  const n = Math.min(runningTasks(), RACK_LEDS);
  rackLeds.forEach((led, i) => led.material.emissive.setHex(i < n ? 0x6fcf97 : 0x000000));
}

// Le feuillage est un groupe distinct du pot : il peut ainsi ployer tres legerement
// autour de sa base, comme sous un courant d'air. Le pot, lui, ne bouge pas.
const plants = [];
function plant(x, z, s = 1) {
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(.34 * s, .26 * s, .55 * s, 12),
    new THREE.MeshStandardMaterial({ color: 0xb06a44, roughness: .85 }));
  pot.position.set(x, .27 * s, z); pot.castShadow = true; scene.add(pot);
  const foliage = new THREE.Group(); foliage.position.set(x, 0, z); scene.add(foliage);
  for (const [dx, dy, dz, r] of [[0, .95, 0, .52], [.26, .72, .14, .34], [-.22, .76, -.16, .3]]) {
    const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry(r * s, 0),
      new THREE.MeshStandardMaterial({ color: 0x5d8f56, flatShading: true, roughness: .9 }));
    leaf.position.set(dx * s, dy * s, dz * s); leaf.castShadow = true; foliage.add(leaf);
  }
  plants.push({ g: foliage, ph: Math.abs(x * 3.1 + z * 1.7) % 6.28 });
}
// Les deux plantes de l'avant droit ont cede la place au coin cafe. Celle qui avait
// repris l'angle du fond a droite laisse maintenant la place a la baie serveurs :
// elle se cale entre les deux fenetres, seul pan de mur encore nu.
// Les deux plantes du fond se posent dans les angles, qui ont recule avec les murs ;
// la troisieme reste a l'avant gauche, derriere les places debout.
plant(wallR(17.0), wallB(1.7), 1.25); plant(wallL(2.1), wallB(1.4), 1);
plant(-7.4, wallF(.4), .85);

// Étagère et bouquins : du détail tiède sur le mur du fond
const shelf = box(3.4, .12, .5, 0x6d4b33); shelf.position.set(-11.5, 1.75, wallB(.3)); scene.add(shelf);
const BOOKS = [0xb5553f, 0xd2a35c, 0x5d8f56, 0x8a6fa3, 0xc97b5a, 0x6e8ca8];
for (let i = 0; i < 11; i++) {
  const h = .3 + (i % 4) * .06;
  const b = box(.14, h, .34, BOOKS[i % BOOKS.length]);
  b.position.set(-12.9 + i * .26, 1.81 + h / 2, wallB(.3)); scene.add(b);
}

/* ---------- Mur de gauche : tableau blanc et modele de donnees ---------- */
// Ce qu'on trouve vraiment dans un open space de devs : un tableau couvert de
// schemas a moitie effaces, et le modele de donnees punaise juste a cote.

// roundRect n'existe pas avant 2023 : on retombe sur un rectangle droit.
const rrect = (ctx, rx, ry, w, h, r) => {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(rx, ry, w, h, r); else ctx.rect(rx, ry, w, h);
};

function whiteboardTexture() {
  const W = 1024, H = 390, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#eceae2'; x.fillRect(0, 0, W, H);
  // Trainees de gomme : un tableau qui sert n'est jamais propre.
  x.fillStyle = 'rgba(188,194,188,.33)';
  for (const [sx, sy, sw, sh] of [[56, 196, 300, 54], [612, 42, 220, 36], [330, 300, 160, 70]])
    x.fillRect(sx, sy, sw, sh);

  // Le schema de l'appli elle-meme : hooks -> serveur -> scene.
  x.lineWidth = 5; x.lineJoin = 'round'; x.textAlign = 'center';
  x.font = '600 31px system-ui,Segoe UI,sans-serif';
  [['hooks', '#2f3640'], ['server.js', '#2f6fb0'], ['three.js', '#2f8f52']].forEach(([lab, col], i) => {
    const bx = 48 + i * 292;
    x.strokeStyle = col; rrect(x, bx, 46, 200, 82, 12); x.stroke();
    x.fillStyle = col; x.fillText(lab, bx + 100, 95);
    if (i > 1) return;
    x.strokeStyle = '#2f3640'; x.beginPath();
    x.moveTo(bx + 208, 87); x.lineTo(bx + 278, 87); x.stroke();
    x.fillStyle = '#2f3640'; x.beginPath();
    x.moveTo(bx + 284, 87); x.lineTo(bx + 266, 78); x.lineTo(bx + 266, 96); x.fill();
  });
  x.font = '500 23px ui-monospace,Consolas,monospace'; x.fillStyle = '#b03a2e';
  x.fillText('POST /event', 338, 150); x.fillText('SSE /stream', 630, 150);

  // Post-it du sprint, alignes sous le schema.
  const NOTES = [['#f2d675', 'coffee'], ['#f0a9b5', 'ERD v2'], ['#9fd4c1', 'glTF ?'], ['#bcc9ef', 'tokens']];
  NOTES.forEach(([col, lab], i) => {
    const nx = 56 + i * 128;
    x.fillStyle = 'rgba(70,60,45,.18)'; x.fillRect(nx + 4, 216, 108, 108);
    x.fillStyle = col; x.fillRect(nx, 212, 108, 108);
    x.fillStyle = 'rgba(50,42,32,.78)'; x.font = '600 20px system-ui,Segoe UI,sans-serif';
    x.fillText(lab, nx + 54, 252);
    x.strokeStyle = 'rgba(50,42,32,.3)'; x.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      x.beginPath(); x.moveTo(nx + 16, 272 + k * 14); x.lineTo(nx + 92 - k * 18, 272 + k * 14); x.stroke();
    }
  });

  // Burndown : deux axes, la droite ideale en pointilles, et la vraie courbe.
  const gx = 620, gy = 330, gw = 350, gh = 150;
  x.strokeStyle = '#4a5560'; x.lineWidth = 3;
  x.beginPath(); x.moveTo(gx, gy - gh); x.lineTo(gx, gy); x.lineTo(gx + gw, gy); x.stroke();
  x.strokeStyle = 'rgba(74,85,96,.35)'; x.lineWidth = 2; x.setLineDash([7, 7]);
  x.beginPath(); x.moveTo(gx, gy - gh); x.lineTo(gx + gw, gy); x.stroke(); x.setLineDash([]);
  x.strokeStyle = '#2f8f52'; x.lineWidth = 4; x.beginPath();
  [[0, 150], [52, 138], [104, 118], [156, 112], [208, 74], [260, 58], [312, 22], [350, 10]]
    .forEach(([dx, dy], i) => (i ? x.lineTo(gx + dx, gy - dy) : x.moveTo(gx + dx, gy - dy)));
  x.stroke();
  x.fillStyle = '#4a5560'; x.font = '500 20px ui-monospace,Consolas,monospace';
  x.textAlign = 'left'; x.fillText('burndown', gx + 6, gy - gh - 12);

  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t;
}

// Modele de donnees : trois tables et leurs liens, comme un ERD imprime et punaise.
function erdTexture() {
  const W = 1024, H = 487, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#f3efe6'; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#d6cdbb'; x.lineWidth = 6; x.strokeRect(3, 3, W - 6, H - 6);

  const HEAD = 42, ROW = 34, TW = 236;
  const TABLES = [
    { n: 'sessions', x: 44,  y: 56,  col: '#2f6fb0', rows: ['id  PK', 'cwd', 'started_at'] },
    { n: 'agents',   x: 396, y: 240, col: '#8a5fa8', rows: ['id  PK', 'session_id  FK', 'type'] },
    { n: 'events',   x: 744, y: 56,  col: '#2f8f52', rows: ['id  PK', 'agent_id  FK', 'tool', 'ts'] },
  ];
  // Les liens d'abord : ils doivent passer sous les tables, pas dessus.
  x.strokeStyle = '#8a7f6c'; x.lineWidth = 3;
  x.beginPath(); x.moveTo(162, 56 + HEAD + 3 * ROW); x.lineTo(162, 282); x.lineTo(396, 282); x.stroke();
  x.beginPath(); x.moveTo(632, 282); x.lineTo(862, 282); x.lineTo(862, 56 + HEAD + 4 * ROW); x.stroke();
  x.fillStyle = '#8a7f6c'; x.font = '600 22px ui-monospace,Consolas,monospace'; x.textAlign = 'center';
  x.fillText('1', 182, 272); x.fillText('N', 376, 272);
  x.fillText('1', 652, 272); x.fillText('N', 842, 272);

  for (const tb of TABLES) {
    const h = HEAD + tb.rows.length * ROW;
    x.fillStyle = 'rgba(70,60,45,.16)'; x.fillRect(tb.x + 5, tb.y + 6, TW, h);
    x.fillStyle = '#ffffff'; x.fillRect(tb.x, tb.y, TW, h);
    x.strokeStyle = tb.col; x.lineWidth = 3; x.strokeRect(tb.x, tb.y, TW, h);
    x.fillStyle = tb.col; x.fillRect(tb.x, tb.y, TW, HEAD);
    x.fillStyle = '#ffffff'; x.font = '700 24px system-ui,Segoe UI,sans-serif'; x.textAlign = 'left';
    x.fillText(tb.n, tb.x + 14, tb.y + 29);
    x.font = '400 21px ui-monospace,Consolas,monospace';
    tb.rows.forEach((r, i) => {
      x.fillStyle = i % 2 ? '#f6f4ef' : '#ffffff';
      x.fillRect(tb.x + 2, tb.y + HEAD + i * ROW, TW - 4, ROW);
      x.fillStyle = r.includes('PK') ? '#2f3640' : '#5c5447';
      x.fillText(r, tb.x + 14, tb.y + HEAD + i * ROW + 23);
    });
  }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t;
}

// Accroche un panneau sur le mur de gauche. rotation.y = PI/2 : la face regarde
// vers +x, donc vers la camera, et le texte se lit dans le bon sens.
function wallBoard(z, w, h, tex, frameCol) {
  const X = wallL(.06);
  const frame = box(.07, h + .16, w + .16, frameCol);
  frame.position.set(X - .02, 2.25, z); scene.add(frame);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex }));
  face.rotation.y = Math.PI / 2; face.position.set(X + .03, 2.25, z); scene.add(face);
  return face;
}
// Le mur de gauche court maintenant sur toute la profondeur. On garde les deux

tray.position.set(wallL(.16), 1.24, BOARD_Z); scene.add(tray);
for (const [dz, col] of [[-.5, 0x2f3640], [-.26, 0x2f6fb0], [-.02, 0xb03a2e]]) {

/* ---------- La vie de la piece : chat, vapeur, poussiere ---------- */
// Rien ici ne dit quoi que ce soit sur les sessions. C'est du decor anime, et c'est
// precisement le point : une piece ou il ne se passe rien quand personne ne travaille
// est une piece morte. Ce qui donne envie de regarder, c'est ce qui bouge sans raison.

// Point flou partage par la vapeur et la poussiere : un carre net ferait des confettis.
function softDot() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(.35, 'rgba(255,255,255,.5)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const DOT = softDot();

// Nuage de points generique. La couleur est portee par sommet : en melange additif,
// un point qui tend vers le noir disparait — c'est ainsi qu'on fait varier l'opacite
// particule par particule, ce qu'un PointsMaterial seul ne permet pas.
function cloud(n, size, tint) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    map: DOT, size, transparent: true, depthWrite: false, vertexColors: true,
    blending: THREE.AdditiveBlending, sizeAttenuation: true,
  }));
  pts.frustumCulled = false; scene.add(pts);
  return { pts, pos, col, tint, n, geo };
}

/* --- Vapeur : au-dessus des tasses du comptoir, et des mains qui en tiennent une --- */
const STEAM = cloud(34, .17, [1, .93, .84]);
const STEAM_LIFE = 2.6;
// Les ages sont echelonnes des le depart : sans ca, toutes les particules naissent et
// meurent ensemble et le panache bat comme un coeur au lieu de monter. En attendant sa
// premiere apparition, une particule patiente sous le plancher, hors de vue.
const steamP = [...Array(STEAM.n)].map(() => ({ age: Math.random() * STEAM_LIFE, x: 0, y: -99, z: 0, vx: 0, vz: 0 }));
// Les tasses posees fument toujours ; une place du bar ne fume que si quelqu'un l'occupe.
function steamSources() {
  const out = [[10.3, 1.24, 9.15], [10.3, 1.24, 9.6], [10.3, 1.24, 10.05]];
  for (const k of COFFEE_SPOTS) if (k.busy) out.push([k.pos.x, 1.08, k.pos.z]);
  return out;
}

/* --- Poussiere : elle ne dit rien, elle donne de l'air a la piece --- */
const DUST = cloud(230, .055, [1, .86, .66]);
const dustP = [...Array(DUST.n)].map(() => ({
  x: (Math.random() - .5) * 28, y: .3 + Math.random() * 3.3, z: (Math.random() - .5) * 20.5,
  ph: Math.random() * 6.28, sp: .018 + Math.random() * .045, br: .18 + Math.random() * .4,
}));

/* ---------- Le chat ---------- */
// Il ne sert a rien, et c'est tout l'interet : c'est la seule chose de la piece dont
// l'activite ne depend pas de toi. Il dort, s'etire, change de place, recommence.
function makeCat() {
  const g = new THREE.Group(); scene.add(g);
  const fur = new THREE.MeshStandardMaterial({ color: 0xc98a52, roughness: .92 });
  const body = new THREE.Group(); g.add(body);
  const trunk = box(.19, .18, .40, 0xc98a52, { roughness: .92 });
  trunk.position.y = .15; body.add(trunk);
  for (const dz of [-.10, .02, .14]) { // rayures
    const stripe = box(.197, .186, .035, 0xa96e3c, { roughness: .92 });
    stripe.position.set(0, .15, dz); body.add(stripe);
  }
  const chest = box(.13, .09, .1, 0xf0ddc4, { roughness: .92 });
  chest.position.set(0, .09, -.15); body.add(chest);

  const head = new THREE.Group(); head.position.set(0, .26, -.23); body.add(head);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(.105, 14, 12), fur);
  skull.castShadow = true; head.add(skull);
  const muzzle = box(.085, .055, .07, 0xf0ddc4, { roughness: .92 });
  muzzle.position.set(0, -.03, -.08); head.add(muzzle);
  const ears = [];
  for (const sx of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(.045, .09, 4), fur);
    ear.position.set(sx * .06, .1, .015); ear.rotation.z = sx * .2; head.add(ear); ears.push(ear);
  }
  const legs = [];
  for (const [lx, lz] of [[-.06, -.13], [.06, -.13], [-.06, .13], [.06, .13]]) {
    const leg = box(.05, .13, .05, 0xb87a46, { roughness: .92 });
    leg.position.set(lx, .065, lz); body.add(leg); legs.push(leg);
  }
  // Queue en deux segments : le bout fouette plus vite que la base.
  const tail = new THREE.Group(); tail.position.set(0, .18, .19); body.add(tail);
  const t1 = box(.045, .045, .18, 0xc98a52, { roughness: .92 }); t1.position.z = .09; tail.add(t1);
  const tip = new THREE.Group(); tip.position.z = .18; tail.add(tip);
  const t2 = box(.04, .04, .15, 0xa96e3c, { roughness: .92 }); t2.position.z = .075; tip.add(t2);
  return { g, body, trunk, head, ears, legs, tail, tip };
}

// Ses places. Toutes dans la bande avant, toutes atteignables par la voie degagee
// devant le canape : le chat ne traverse jamais un ilot.
const CAT_LANE_Z = COUCH_LANE_Z;
const CAT_SPOTS = [
  { pos: new V3(LOUNGE_X + .9, .99, LOUNGE_Z - .53), face: Math.PI, sleep: true },  // dossier du canape
  { pos: new V3(LOUNGE_X - 1.8, .81, LOUNGE_Z), face: Math.PI, sleep: false },      // accoudoir
  { pos: new V3(LOUNGE_X, .47, LOUNGE_Z + 1.4), face: 0, sleep: false },            // table basse
  { pos: new V3(LOUNGE_X - 1.3, .03, 9.95), face: Math.PI, sleep: true },           // tapis, devant la tele
  { pos: new V3(-5.5, .02, 9.3), face: -Math.PI / 2, sleep: false },                // parquet, pres des places debout
];

const cat = makeCat();
const CAT = {
  spot: CAT_SPOTS[0], next: null, state: 'rest', t0: 0, until: 25,
  from: new V3(), to: new V3(), curl: 1, face: CAT_SPOTS[0].face,
};
cat.g.position.copy(CAT_SPOTS[0].pos);
cat.g.rotation.y = CAT_SPOTS[0].face;

// Duree d'une sieste : assez longue pour qu'on ne le surprenne pas a tourner en rond,
// assez courte pour qu'on le voie bouger si on regarde quelques minutes.
const catNap = () => 55 + Math.random() * 110;
const ease = (p) => p * p * (3 - 2 * p);

function updateCat(dt, t) {
  const g = cat.g;
  const S = CAT.state;

  if (S === 'rest') {
    CAT.curl += ((CAT.spot.sleep ? 1 : 0) - CAT.curl) * Math.min(1, dt * 2.5);
    if (t >= CAT.until) { CAT.state = 'stretch'; CAT.t0 = t; }
  } else if (S === 'stretch') {
    const p = Math.min(1, (t - CAT.t0) / 1.5);
    CAT.curl += (0 - CAT.curl) * Math.min(1, dt * 3);
    const arch = Math.sin(p * Math.PI);
    cat.trunk.scale.z = 1 + .28 * arch;
    cat.body.position.y = .035 * arch;
    cat.head.rotation.x = -.5 * arch;
    if (p >= 1) {
      cat.trunk.scale.z = 1; cat.body.position.y = 0; cat.head.rotation.x = 0;
      let n = CAT.spot;
      while (n === CAT.spot) n = CAT_SPOTS[(Math.random() * CAT_SPOTS.length) | 0];
      CAT.next = n;
      CAT.from.copy(g.position);
      CAT.to.set(g.position.x, .02, CAT_LANE_Z);
      CAT.state = 'down'; CAT.t0 = t;
    }
  } else if (S === 'down' || S === 'up') {
    const dur = S === 'down' ? .5 : .62;
    const p = Math.min(1, (t - CAT.t0) / dur);
    g.position.lerpVectors(CAT.from, CAT.to, ease(p));
    g.position.y += Math.sin(p * Math.PI) * (S === 'down' ? .12 : .22); // l'arc du saut
    if (p >= 1) {
      g.position.copy(CAT.to);
      if (S === 'down') { CAT.state = 'walk'; }
      else { CAT.spot = CAT.next; CAT.face = CAT.spot.face; CAT.state = 'rest'; CAT.until = t + catNap(); }
    }
  } else if (S === 'walk') {
    const tx = CAT.next.pos.x, d = tx - g.position.x, step = 1.15 * dt;
    if (Math.abs(d) <= step) {
      g.position.x = tx;
      CAT.from.copy(g.position); CAT.to.copy(CAT.next.pos);
      CAT.state = 'up'; CAT.t0 = t;
    } else {
      g.position.x += Math.sign(d) * step;
      CAT.face = Math.sign(d) > 0 ? -Math.PI / 2 : Math.PI / 2;
      // demarche : le corps monte et descend doucement
      cat.body.position.y = Math.abs(Math.sin(t * 9)) * .022;
      cat.legs.forEach((l, i) => { l.rotation.x = Math.sin(t * 9 + i * 1.6) * .5; });
    }
  }

  if (S !== 'walk') cat.legs.forEach((l) => { l.rotation.x = 0; });
  // Orientation : on glisse vers l'angle voulu plutot que de pivoter d'un bloc.
  let da = CAT.face - g.rotation.y;
  while (da > Math.PI) da -= 2 * Math.PI;
  while (da < -Math.PI) da += 2 * Math.PI;
  g.rotation.y += da * Math.min(1, dt * 6);

  // Pose : enroule quand il dort, deplie quand il veille.
  const c = CAT.curl;
  if (S !== 'stretch') {
    cat.body.position.y = (S === 'walk' ? cat.body.position.y : 0) - .035 * c;
    cat.trunk.scale.z = 1 - .16 * c;
    cat.head.position.set(0, .26 - .12 * c, -.23 + .09 * c);
    cat.head.rotation.x = .5 * c;
  }
  cat.legs.forEach((l) => { l.scale.y = 1 - .7 * c; l.position.y = .065 * (1 - .7 * c); });
  cat.trunk.scale.y = 1 + (.02 + .035 * c) * Math.sin(t * (c ? 1.1 : 1.9)); // il respire
  // La queue s'enroule au repos, fouette quand il veille.
  cat.tail.rotation.y = c * 1.45;
  cat.tail.rotation.x = -.2 + (1 - c) * .28 * Math.sin(t * 1.3);
  cat.tip.rotation.x = (1 - c) * .45 * Math.sin(t * 2.2 + 1);
  // Oreille : un bref frisson de temps en temps, jamais en continu.
  const tw = Math.pow(Math.max(0, Math.sin(t * .37)), 60);
  cat.ears[0].rotation.x = tw * .5 * Math.sin(t * 26);
}

/* ---------- Mise a jour groupee du decor anime ---------- */
function updateLife(dt, t) {
  updateCat(dt, t);

  // Vapeur : chaque particule monte, s'ecarte un peu, s'eteint, et repart d'une source.
  const src = steamSources();
  for (let i = 0; i < STEAM.n; i++) {
    const p = steamP[i];
    p.age += dt;
    if (p.age >= STEAM_LIFE) { // sur l'age seul : tester aussi y resynchroniserait tout
      const s0 = src[(Math.random() * src.length) | 0];
      p.age = 0; p.x = s0[0]; p.y = s0[1]; p.z = s0[2];
      p.vx = (Math.random() - .5) * .09; p.vz = (Math.random() - .5) * .09;
    }
    const k = p.age / STEAM_LIFE;
    p.y += (.26 + k * .18) * dt;
    p.x += p.vx * dt; p.z += p.vz * dt;
    STEAM.pos[i * 3] = p.x; STEAM.pos[i * 3 + 1] = p.y; STEAM.pos[i * 3 + 2] = p.z;
    // Monte vite, s'efface lentement : une volute ne clignote pas.
    const a = Math.sin(Math.min(1, k * 1.15) * Math.PI) * .5;
    STEAM.col[i * 3] = STEAM.tint[0] * a;
    STEAM.col[i * 3 + 1] = STEAM.tint[1] * a;
    STEAM.col[i * 3 + 2] = STEAM.tint[2] * a;
  }
  STEAM.geo.attributes.position.needsUpdate = true;
  STEAM.geo.attributes.color.needsUpdate = true;

  // Poussiere : derive lente, retour en bas quand elle sort par le haut.
  for (let i = 0; i < DUST.n; i++) {
    const p = dustP[i];
    p.y += p.sp * dt;
    if (p.y > 3.6) { p.y = .3; p.x = (Math.random() - .5) * 28; p.z = (Math.random() - .5) * 20.5; }
    const wob = Math.sin(t * .22 + p.ph) * .5;
    DUST.pos[i * 3] = p.x + wob;
    DUST.pos[i * 3 + 1] = p.y;
    DUST.pos[i * 3 + 2] = p.z + Math.cos(t * .18 + p.ph) * .4;
    const a = p.br * (.55 + .45 * Math.sin(t * .8 + p.ph * 3)); // scintillement
    DUST.col[i * 3] = DUST.tint[0] * a;
    DUST.col[i * 3 + 1] = DUST.tint[1] * a;
    DUST.col[i * 3 + 2] = DUST.tint[2] * a;
  }
  DUST.geo.attributes.position.needsUpdate = true;
  DUST.geo.attributes.color.needsUpdate = true;

  // Les suspensions oscillent autour de leur attache, chacune a son rythme.
  for (const p of pods) {
    p.lamp.rotation.z = .014 * Math.sin(t * .66 + p.lampPhase);
    p.lamp.rotation.x = .010 * Math.sin(t * .49 + p.lampPhase * 1.4);
  }
  // Les feuillages ploient, deux fois plus lentement : rien ne doit battre la mesure.
  for (const pl of plants) {
    pl.g.rotation.z = .035 * Math.sin(t * .33 + pl.ph);
    pl.g.rotation.x = .028 * Math.sin(t * .27 + pl.ph * .7);
  }
}



/* ---------- Bureaux ---------- */
// Memes teintes qu'avant (vert, ambre, bleu, violet, taupe, rose, rouge) desaturees :
// un écran allumé doit se lire sans crever l'ambiance tamisée.
const SCREEN = { type: 0x74c98d, term: 0xe8a84e, read: 0x6fa3d6, web: 0xa88cc9,
  think: 0x9a8b7c, plan: 0xdb8fa8, wait: 0xe0695e, idle: 0x3a2f27, walk: 0x3a2f27,
  coffee: 0x3a2f27 };

function makeDesk(parent, x, z) {
  const g = new THREE.Group(); g.position.set(x, 0, z); parent.add(g);

  for (const [mx, ry] of [[-.54, .2], [.54, -.2]]) {

    const stand = box(.09, .3, .09, 0x222222); stand.position.set(mx, 1.1, -.3); g.add(stand);
    const mon = box(.98, .62, .05, 0x15171c);
    mon.position.set(mx, 1.42, -.3); mon.rotation.y = ry; g.add(mon);
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(.88, .52), screenMat);
    scr.position.set(mx + Math.sin(ry) * .031, 1.42, -.3 + Math.cos(ry) * .031);
    scr.rotation.y = ry; g.add(scr);
  }
  const kb = box(.7, .03, .22, 0x3a3d45); kb.position.set(0, .965, .3); g.add(kb);

  const backr = box(.62, .65, .08, 0x7a5a4c); backr.position.set(0, .95, 1.27); g.add(backr);
  const post = box(.06, .5, .06, 0x4a403a); post.position.set(0, .28, .95); g.add(post);
  const mug = new THREE.Mesh(new THREE.CylinderGeometry(.07, .06, .12, 10),

      if (!act) { screenMat.emissive.setHex(0x0b0e14); screenMat.emissiveIntensity = 1; return; }

}

/* ---------- Navigation : A* sur une grille d'occupation ---------- */
// La piece est decoupee en cases de 20 cm. Chaque meuble, cloison et bureau bloque
// les cases que son emprise couvre, elargie de NAV.pad (le gabarit d'un personnage).
// Les trajets sont cherches en A* sur 8 voisins, puis lisses par visibilite directe :
// on marche en ligne droite tant que rien ne s'interpose, au lieu d'un escalier de
// cases. Les ilots vont et viennent avec les sessions : la grille est reconstruite a
// la demande, des que l'un d'eux apparait ou disparait (invalidateNav()).
// L'origine de la grille, c'est le coin de la piece — et depuis que la piece ne
// grandit que vers le fond, son centre n'est plus z = 0. `-ROOM.d / 2` decalerait
// toute la grille de la moitie de ce qu'on a ajoute : les agents contourneraient des
// meubles absents et traverseraient ceux qui sont la.
const NAV = { cell: .2, pad: .22, x0: ROOM.left, z0: ROOM.back };
NAV.cols = Math.round(ROOM.w / NAV.cell);
NAV.rows = Math.round(ROOM.d / NAV.cell);
let navGrid = null; // Uint8Array, 1 = bloque
function invalidateNav() { navGrid = null; }

// [centre x, centre z, largeur, profondeur, marge ?]
// Les meubles que la navigation doit contourner. Chacun est donne par la MEME
// expression que l'objet qu'il represente : ecrits en dur, ils restaient a leur
// ancienne place quand la piece s'agrandissait — la grille evitait alors des meubles
// fantomes et laissait traverser les vrais, sans que rien ne le signale.
const STATIC_OBSTACLES = [
  [wallR(4.4), COFFEE.z, 1.34, 2.74],     // comptoir et machine
  [COFFEE.x, COFFEE.z, .9, 2.6],          // mange-debout
  // Canape et table basse : marge mince. La voie qui les separe (z = 9,35) ne fait
  // que 35 cm — c'est par elle qu'on gagne sa place. Une marge pleine la fermerait.
  [LOUNGE_X, LOUNGE_Z, 3.9, 1.4, .05],
  [LOUNGE_X, LOUNGE_Z + 1.4, 1.7, .7, .05],
  [LOUNGE_X, TV_Z, 2.0, .52],             // televiseur et console
  [RACK_X, RACK_Z, 5.2, .85], [RACK_X, RACK_Z2, 5.2, .85], // les deux rangees de la baie
  // Les trois tables de la cantine. Les chaises sont a 1,15 du centre, le plateau
  // fait 0,65 de demi-profondeur : avec la marge de 0,22 de la grille, elles restent
  // accessibles, et il reste 1,76 de passage entre deux tables.
  ...LUNCH_TABLES.map((z) => [LUNCH_TABLE_X, z, 3.6, 1.3]),
  [JEUX_X, BABY_Z, 1.5, 2.4],             // baby-foot
  [JEUX_X, BILLARD_Z, 3.0, 1.7],          // billard
  // Les cloisons de l'aile, troncon par troncon : les ouvertures doivent rester
  // praticables, sinon les trois salles sont murees et personne n'y va jamais.
  ...AILE_SEGMENTS,
  [wallR(17.0), wallB(1.7), .85, .85],    // plantes
  [wallL(2.1), wallB(1.4), .68, .68],
  [-7.4, wallF(.4), .58, .58],
];

function buildNav() {
  const { cols, rows, cell, x0, z0, pad } = NAV, g = new Uint8Array(cols * rows);
  // Bloque toute case dont le CENTRE tombe dans le rectangle elargi.
  const mark = (cx, cz, w, d, m = pad) => {
    const i0 = Math.max(0, Math.ceil((cx - w / 2 - m - x0) / cell - .5));
    const i1 = Math.min(cols - 1, Math.floor((cx + w / 2 + m - x0) / cell - .5));
    const j0 = Math.max(0, Math.ceil((cz - d / 2 - m - z0) / cell - .5));
    const j1 = Math.min(rows - 1, Math.floor((cz + d / 2 + m - z0) / cell - .5));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) g[j * cols + i] = 1;
  };
  // Bords de la piece : murs du fond et de gauche, et vide du cote camera.
  const band = Math.ceil(pad / cell);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++)
    if (i < band || j < band || i >= cols - band || j >= rows - band) g[j * cols + i] = 1;
  for (const o of STATIC_OBSTACLES) mark(...o);
  // Plus de cloisons a contourner : seuls les bureaux bloquent. L'ancienne version
  // marquait aussi les trois panneaux, avec `open = z < 0 ? 1 : -1` — la regle
  // d'avant les quatre rangees. Pour la rangee z = -12, le fond etait donc marque
  // du MAUVAIS cote : la grille fermait l'ouverture et ouvrait le fond.
  for (const p of pods) {
    // Plateau du bureau ; l'assise est a +0,8 en z, donc le centre du plateau a -0,8.
    for (const d of p.desks) mark(d.seat.x, d.seat.z - .8, 2.2, 1.1);
  }
  return g;
}

const navCell = (x, z) => {
  const i = Math.min(NAV.cols - 1, Math.max(0, Math.floor((x - NAV.x0) / NAV.cell)));
  const j = Math.min(NAV.rows - 1, Math.max(0, Math.floor((z - NAV.z0) / NAV.cell)));
  return j * NAV.cols + i;
};
const navCenter = (k) => new V3(
  NAV.x0 + (k % NAV.cols + .5) * NAV.cell, 0, NAV.z0 + (Math.floor(k / NAV.cols) + .5) * NAV.cell);

// Case libre la plus proche (un siege, une place de canape sont dans un meuble).
function nearestFree(k) {
  const { cols, rows } = NAV, ci = k % cols, cj = Math.floor(k / cols);
  for (let r = 1; r < 20; r++) {
    let best = -1, bd = Infinity;
    for (let j = cj - r; j <= cj + r; j++) for (let i = ci - r; i <= ci + r; i++) {
      if (Math.max(Math.abs(i - ci), Math.abs(j - cj)) !== r) continue; // l'anneau seul
      if (i < 0 || j < 0 || i >= cols || j >= rows || navGrid[j * cols + i]) continue;
      const d = (i - ci) ** 2 + (j - cj) ** 2;
      if (d < bd) { bd = d; best = j * cols + i; }
    }
    if (best >= 0) return best;
  }
  return -1;
}

// A* 8-connexe, heuristique octile. Pas de coupe d'angle : une diagonale exige que
// ses deux cases orthogonales soient libres, sinon on raserait l'arete d'un bureau.
function astar(s, e) {
  const { cols, rows } = NAV, n = cols * rows, SQ2 = Math.SQRT2;
  const gs = new Float32Array(n).fill(Infinity), from = new Int32Array(n).fill(-1);
  const shut = new Uint8Array(n);
  const ei = e % cols, ej = Math.floor(e / cols);
  const h = (k) => {
    const dx = Math.abs(k % cols - ei), dz = Math.abs(Math.floor(k / cols) - ej);
    return Math.max(dx, dz) + (SQ2 - 1) * Math.min(dx, dz);
  };
  // Tas binaire minimal sur f = g + h.
  const heap = [], fs = [];
  const push = (k, f) => {
    let i = heap.length; heap.push(k); fs.push(f);
    while (i > 0) {
      const p = (i - 1) >> 1; if (fs[p] <= f) break;
      heap[i] = heap[p]; fs[i] = fs[p]; i = p;
    }
    heap[i] = k; fs[i] = f;
  };
  const pop = () => {
    const top = heap[0], k = heap.pop(), f = fs.pop();
    if (heap.length) {
      let i = 0;
      for (;;) {
        let c = 2 * i + 1; if (c >= heap.length) break;
        if (c + 1 < heap.length && fs[c + 1] < fs[c]) c++;
        if (fs[c] >= f) break;
        heap[i] = heap[c]; fs[i] = fs[c]; i = c;
      }
      heap[i] = k; fs[i] = f;
    }
    return top;
  };
  gs[s] = 0; push(s, h(s));
  while (heap.length) {
    const k = pop();
    if (k === e) {
      const out = [];
      for (let c = e; c !== -1; c = from[c]) out.push(c);
      return out.reverse();
    }
    if (shut[k]) continue;
    shut[k] = 1;
    const ci = k % cols, cj = Math.floor(k / cols);
    for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dz) continue;
      const i = ci + dx, j = cj + dz;
      if (i < 0 || j < 0 || i >= cols || j >= rows) continue;
      const m = j * cols + i;
      if (navGrid[m] || shut[m]) continue;
      if (dx && dz && (navGrid[cj * cols + i] || navGrid[j * cols + ci])) continue;
      const ng = gs[k] + (dx && dz ? SQ2 : 1);
      if (ng < gs[m]) { gs[m] = ng; from[m] = k; push(m, ng + h(m)); }
    }
  }
  return null;
}

// Segment entierement en cases libres ? Echantillonne tous les demi-pas de grille.
function navClear(a, b) {
  const dx = b.x - a.x, dz = b.z - a.z;
  const n = Math.ceil(Math.hypot(dx, dz) / (NAV.cell * .5));
  for (let s = 0; s <= n; s++) {
    if (navGrid[navCell(a.x + dx * s / n, a.z + dz * s / n)]) return false;
  }
  return true;
}

// Liste des points a rejoindre, depuis `from` (exclu) jusqu'a `to` (inclus). Si le
// depart ou l'arrivee est dans un meuble (un siege), on en sort ou on y entre par la
// case libre la plus proche, en ligne droite : c'est le geste de s'asseoir.
function findPath(from, to) {
  if (!navGrid) navGrid = buildNav();
  const s = navCell(from.x, from.z), e = navCell(to.x, to.z);
  const sIn = !navGrid[s], eIn = !navGrid[e];
  const sf = sIn ? s : nearestFree(s), ef = eIn ? e : nearestFree(e);
  const cells = sf >= 0 && ef >= 0 ? astar(sf, ef) : null;
  if (!cells) return [to.clone()]; // aucun passage : on y va tout droit, comme avant
  const pts = cells.map(navCenter);
  // Extremites exactes a la place des centres de case quand elles sont libres.
  pts[0] = sIn ? from.clone() : pts[0];
  pts[pts.length - 1] = eIn ? to.clone() : pts[pts.length - 1];
  // Lissage par visibilite : de chaque point, on saute au plus lointain visible.
  const out = [pts[0]];
  for (let i = 0; i < pts.length - 1;) {
    let j = pts.length - 1;
    while (j > i + 1 && !navClear(pts[i], pts[j])) j--;
    out.push(pts[j]); i = j;
  }
  if (!sIn) out.unshift(from.clone());
  if (!eIn) out.push(to.clone());
  return out.slice(1);
}

/* ---------- Îlots : un par session, nommé d'après le projet ---------- */
// Bureaux d'un ilot. L'ordre d'attribution est recalcule par ilot (cote ouvert
// d'abord), si bien que le lead s'assoit toujours face a l'allee.
// Nombre maximal de bureaux par ilot. Limite d'emprise au sol : avec des colonnes
// espacees de 7,5 et des rangees de 7,5 a 9, une troisieme rangee mordrait sur le
// voisin. Au-dela, deux agents partagent le dernier bureau.
const POD_MAX_DESKS = 4;
// Couleur d'identite d'un projet : tapis, abat-jour, liseres, cadre du panneau et
// pastille du panneau Sessions. Terre cuite, sauge, bleu poussiereux, moutarde,
// prune, canard.
const TINTS = [0xc9795b, 0x7f9d6f, 0x6e8ca8, 0xd2a35c, 0xa97fa0, 0x5fa39b];

const podSlots = [];
for (const z of POD_Z) for (const x of POD_X) podSlots.push({ x, z, count: 0 });
// Ordre de remplissage : depuis le milieu de la première rangée, vers l'extérieur.
// Une maison à trois sessions doit occuper trois emplacements voisins, pas les trois
// coins d'un plateau de vingt — la caméra cadre ce qui est occupé, et trois îlots
// aux extrémités la forcent à tout dézoomer pour ne montrer que du parquet.
// Le z pèse un peu plus que le x : on préfère élargir la rangée de devant avant
// d'aller au fond, parce que c'est celle que la caméra voit le mieux.
const FILL_X = POD_X[(POD_X.length - 1) >> 1], FILL_Z = POD_Z[0];
const fillRank = (s) => Math.hypot(s.x - FILL_X, (s.z - FILL_Z) * 1.35);
podSlots.sort((a, b) => fillRank(a) - fillRank(b));

// Descente de lit de l'îlot : c'est elle qui porte le nom du projet. Au sol plutôt
// qu'en panneau suspendu — un panneau en l'air masquait les bureaux du fond et
// flottait sans rien toucher ; un tapis ancre l'équipe à son emplacement.
function matTexture(title, sub, tint) {
  const W = 640, H = 200, PAD = 38, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const hex = '#' + tint.toString(16).padStart(6, '0');
  // Laine teintée a la couleur du projet, champ sombre au centre pour que le nom
  // ressorte sur le parquet.
  x.fillStyle = hex; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(34,24,17,.82)'; x.fillRect(14, 14, W - 28, H - 28);
  x.strokeStyle = hex; x.lineWidth = 3; x.strokeRect(25, 25, W - 50, H - 50);
  // Frange tissee en haut et en bas : ca se lit comme un tapis, pas comme une dalle.
  x.fillStyle = hex;
  for (let i = 0; i < 56; i++) { x.fillRect(15 + i * 11, 1, 5, 10); x.fillRect(15 + i * 11, H - 11, 5, 10); }
  x.textAlign = 'center';
  // Un nom long doit RETRECIR, pas s'ecraser : le maxWidth de fillText le rendait
  // filiforme et illisible de loin. On cherche le plus grand corps qui tienne.
  let size = 92;
  for (; size > 26; size -= 3) {
    x.font = '700 ' + size + 'px system-ui,Segoe UI,sans-serif';
    if (x.measureText(title).width <= W - PAD * 2) break;
  }
  x.fillStyle = '#f7eee2'; x.fillText(title, W / 2, 112);
  x.fillStyle = 'rgba(247,238,226,.46)'; x.font = '400 30px ui-monospace,Consolas,monospace';
  x.fillText(sub, W / 2, 158, W - PAD * 2);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t;
}

const pods = new Set();

// UNE lumiere de gyrophare pour toute la piece, qui se pose sur l'ilot qui appelle.
// Une lumiere invisible ne coute rien : three.js ignore les objets non visibles au
// moment de collecter les lumieres de la scene. C'est ce qui permet de la garder
// allumee en permanence sans la payer quand personne n'appelle.
// Deux appels simultanes : la sphere emissive clignote sur chacun des deux ilots,
// seule la lumiere va au premier. C'est la bonne economie — c'est la sphere qu'on
// regarde, la lumiere ne fait que chauffer le plafond autour.
const beaconLight = new THREE.PointLight(0xffffff, 0, 9, 2);
beaconLight.visible = false; scene.add(beaconLight);
let beaconPod = null;
function placeBeaconLight() {
  beaconPod = [...pods].find((p) => p.beaconColor != null) ?? null;
  beaconLight.visible = beaconPod != null;
  if (!beaconPod) { beaconLight.intensity = 0; return; }
  beaconLight.color.setHex(beaconPod.beaconColor);
  beaconLight.position.set(beaconPod.slot.x, 5.1, beaconPod.slot.z);
}

class Pod {
  constructor(title, sub, tint) {
    this.tint = tint; this.members = new Set(); this.closing = false; this.closed = false;
    // Au-delà de podSlots.length sessions simultanées, on empile sur l'emplacement
    // le moins chargé ; le comptage garde la libération correcte.
    this.slot = podSlots.find((s) => !s.count)
      ?? podSlots.reduce((a, b) => (b.count < a.count ? b : a));
    this.slot.count++;
    const { x, z } = this.slot;
    this.g = new THREE.Group(); scene.add(this.g);

    // Tapis : liseré à la couleur du projet, laine teintée au centre
    const edge = box(1, .04, 1, tint, { roughness: 1 });
    edge.position.set(x, .02, z); edge.castShadow = false; this.g.add(edge);
    this.edge = edge;
    // Tapis et lisere sont des boites UNITAIRES qu'on met a l'echelle : l'ilot change
    // de taille a chaque arrivee ou depart, et refaire une geometrie a chaque fois
    // couterait plus cher que de redimensionner celle qui existe.
    const inner = new THREE.Color(0x5a4336).lerp(new THREE.Color(tint), .45);
    const rug = box(1, .05, 1, inner, { roughness: 1 });
    rug.position.set(x, .045, z); rug.castShadow = false;
    rug.userData.pod = this; this.g.add(rug);
    this.rug = rug;

    // Suspension au-dessus de l'îlot : c'est elle qui donne le halo chaud. Toutes ses
    // pièces sont réunies dans un groupe ancré au plafond (y = 4,5), parce qu'une
    // suspension qui oscille tourne autour de son point d'attache : la rotation du
    // groupe suffit alors, là où des positions absolues auraient demandé de recalculer
    // chaque pièce. Les décalages locaux redonnent exactement les hauteurs d'avant.
    this.lamp = new THREE.Group(); this.lamp.position.set(x, 4.5, z); this.g.add(this.lamp);
    this.lampPhase = (hash(title) % 628) / 100;
    const cord = box(.035, 1.1, .035, 0x3a302a); cord.position.set(0, -.55, 0); this.lamp.add(cord);
    const lampShade = new THREE.Mesh(new THREE.ConeGeometry(.78, .62, 20, 1, true),
      new THREE.MeshStandardMaterial({ color: tint, roughness: .75, side: THREE.DoubleSide }));
    lampShade.position.set(0, -1.4, 0); this.lamp.add(lampShade);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(.15, 12, 10),
      new THREE.MeshStandardMaterial({ color: 0xfff1d4, emissive: 0xffc980, emissiveIntensity: 1.5 }));
    bulb.position.set(0, -1.64, 0); this.lamp.add(bulb);
    const lampLight = new THREE.PointLight(0xffc98a, 15, 11, 2);
    lampLight.position.set(0, -1.7, 0); this.lamp.add(lampLight);
    this.lampLight = lampLight; this.bulb = bulb; // pilotes par le cycle jour/nuit

    // Plus de cloisons. Elles disaient « une équipe de quatre » quel que soit
    // l'effectif réel : une session seule occupait quand même quatre places, et une
    // équipe de plus de quatre débordait en s'entassant à deux par bureau. Une boîte
    // de taille fixe ne pouvait mentir que dans un sens ou dans l'autre.
    //
    // C'est le tapis qui porte l'identité de l'équipe désormais — sa couleur et sa
    // descente de lit — et il se dimensionne sur le nombre de gens réellement là.
    const open = aisleFor(z) > z ? 1 : -1; // sens de l'ouverture : vers SON allée
    this.open = open;

    // Descente de lit devant l'ouverture, entre le portillon et l'allée : elle porte
    // le nom du projet. Posee au ras du sol, a l'exterieur du grand tapis de l'ilot.
    this.mat = new THREE.Mesh(new THREE.PlaneGeometry(4.0, 1.25),
      new THREE.MeshBasicMaterial({ map: matTexture(title, sub, tint), transparent: true }));
    this.mat.rotation.x = -Math.PI / 2;
    this.mat.position.set(x, .04, z + 3.8 * open);
    this.mat.userData.pod = this; // cliquable comme le tapis de l'ilot
    this.g.add(this.mat);

    // Gyrophare : eteint la plupart du temps, il s'allume quand la session appelle.
    this.beacon = new THREE.Mesh(new THREE.SphereGeometry(.26, 14, 12),
      new THREE.MeshStandardMaterial({ color: 0x3a2f27, emissive: 0x000000 }));
    this.beacon.position.set(x, 5.25, z); this.beacon.visible = false; this.g.add(this.beacon);
    // Pas de lumiere propre au gyrophare : il y en a UNE pour toute la piece, et
    // elle se deplace sur l'ilot qui appelle (voir beaconLight plus bas). A vingt
    // emplacements, une lumiere ponctuelle par ilot pour le gyrophare plus une pour
    // la suspension faisait quarante lumieres dynamiques dans la scene — chaque
    // fragment du decor les parcourait toutes, y compris les trente-neuf eteintes.

    // Le point d'entrée dans l'allée est pose par fitRug() : il suit le bord du
    // tapis, qui bouge avec l'effectif.

    // Un seul bureau au départ : une session commence toujours par son lead seul.
    // Les autres s'ajoutent quand des agents arrivent.
    this.desks = [];
    this.addDesk();
    pods.add(this); invalidateNav(); framePods();
  }

  // Un bureau de plus, posé à la suite. Les positions déjà attribuées ne bougent
  // JAMAIS : un employé assis ne doit pas glisser parce qu'un collègue arrive. D'où
  // des bureaux qu'on ajoute et retire par la fin, et jamais par le milieu.
  //
  // Côté ouvert en premier : le lead, servi d'abord, s'assoit face à l'allée dans
  // les deux rangées — sinon il tourne le dos au spectateur dans l'une des deux.
  addDesk() {
    const i = this.desks.length;
    const col = i % 2 ? 1.6 : -1.6, rang = (i / 2) | 0;
    const d = makeDesk(this.g, this.slot.x + col, this.slot.z + this.open * (1.6 - 3.2 * rang));
    this.desks.push(d);
    this.fitRug();
    invalidateNav();
    return d;
  }

  // Le tapis épouse les bureaux posés. Une colonne pour une personne, deux au-delà ;
  // une rangée par paire. L'îlot grandit et rétrécit avec l'équipe, ce qui est tout
  // l'objet de la manœuvre.
  fitRug() {
    const n = Math.max(1, this.desks.length);
    const cols = Math.min(2, n), rangs = Math.ceil(n / 2);
    const w = cols === 2 ? 5.8 : 3.6;
    // Le -0,3 rend a l'ilot a deux rangees exactement sa profondeur d'origine (6,1).
    // Sans lui il gagnait 15 cm, qu'il prenait a la bande avant — et la bande avant
    // n'en a pas a donner : elle fait 3,3 entre le dernier ilot et le mur.
    const d = rangs * 3.2 - .3;
    // Centre des bureaux posés : une seule colonne est décalée, deux sont centrées.
    const cx = this.slot.x + (cols === 2 ? 0 : -1.6);
    const cz = this.slot.z + this.open * (1.6 - 1.6 * (rangs - 1));
    this.rug.scale.set(w - .3, 1, d - .3);
    this.rug.position.set(cx, .045, cz);
    this.edge.scale.set(w, 1, d);
    this.edge.position.set(cx, .02, cz);
    // Moitiés réelles de l'emprise au sol de l'îlot, telle qu'elle est dessinée.
    this.half = { x: w / 2, z: d / 2, cx, cz };
    // La descente de lit et le portillon restent devant l'ouverture, alignés sur le
    // bord du tapis — qui vient de bouger.
    if (this.mat) this.mat.position.set(cx, .04, cz + this.open * (d / 2 + 1.1));
    this.gate = new V3(cx, 0, cz + this.open * (d / 2 + .4));
  }
  // Une place de plus quand il le faut : l'îlot pousse un bureau plutôt que de
  // prétendre en avoir quatre depuis le début.
  //
  // PLAFOND À QUATRE, et c'est une limite d'emprise au sol, pas de code : les
  // colonnes de la grille sont espacées de 7,5 et les rangées de 7,5 à 9 — une
  // troisième rangée de bureaux mordrait sur l'îlot voisin. Au-delà de quatre, on
  // double donc sur le dernier bureau, comme avant. Pour faire mieux il faudrait
  // qu'une grande équipe réserve un second emplacement.
  claimDesk() {
    const libre = this.desks.find((k) => !k.busy);
    if (libre) { libre.busy = true; libre.occupants = (libre.occupants || 0) + 1; return libre; }
    const d = this.desks.length < POD_MAX_DESKS ? this.addDesk() : this.desks[this.desks.length - 1];
    d.busy = true; d.occupants = (d.occupants || 0) + 1; return d;
  }
  // La suspension suit le cycle du jour, mais aussi l'etat de l'ilot : tamisee
  // quand le poste ne repond plus, eteinte quand les gens sont partis le soir. Le
  // dernier niveau du jour est retenu pour qu'un changement d'etat s'applique tout
  // de suite, sans attendre le prochain tour du cycle.
  applyLamp(lvl) {
    if (lvl != null) this.lampLevel = lvl;
    const k = this.lampScale ?? 1;
    const l = (this.lampLevel ?? 0) * k;
    this.lampLight.intensity = 15 * l;
    // Une suspension eteinte n'a rien a faire dans la liste des lumieres de la
    // scene : three.js ignore les objets non visibles quand il la constitue. A vingt
    // ilots, ce sont vingt lumieres ponctuelles que chaque fragment du decor cesse
    // de parcourir en plein jour — et le decor, c'est toute la piece.
    this.lampLight.visible = l > .02;
